        ${url ? `<img src="${url}">` : `
          <label>
            <span class="photo-slot-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span>
            <span>${escapeHtml(label)}</span>
            <input type="file" accept="image/*" data-photo-input="${key}">
          </label>`}
      </div>`;
  }

  function historyBlockHtml() {
    if (!historyCtx) {
      return `<div class="empty-hint">ไม่พบประวัติเดิม</div>`;
    }
    const { first, last } = historyCtx;
    return `
      <div class="box-quiet">
        ${row("วันที่สักครั้งแรก", formatDate(first.visitDate))}
        ${row("ระยะเวลาจากครั้งแรกถึงวันนี้", monthsSince(first.visitDate))}
        ${row("เทคนิคเดิม", last.technique)}
        ${row("สีเดิม", last.colorUsed)}
        ${row("กล้ามเนื้อคิ้วล่าสุด", (state.currentCustomer && state.currentCustomer.skinProfile && state.currentCustomer.skinProfile.muscle) || "ยังไม่ได้ประเมิน")}
        <div class="photo-row" style="margin-top:10px">
          ${photoBoxReadOnly(first.beforePhotoUrl)}
          ${photoBoxReadOnly(first.afterPhotoUrl)}
        </div>
        <button type="button" class="icon-btn" id="tuViewLastBtn" style="padding-left:0; margin-top:6px">ดูรายละเอียด ›</button>
      </div>`;
  }

  function render() {
    const draft = state.visitDraft;

    container.innerHTML = `
      ${visitHeaderHtml()}
      <div class="form-section-title" style="margin-top:4px">ส่วนที่ 1 — ประวัติเดิม</div>
      ${historyBlockHtml()}

      ${readinessBlockHtml(draft)}

      <div class="form-section-title">ส่วนที่ 2 — ติดตามผลหลังลอก</div>
      <div class="step-group">
        <div class="step-group-title">ความพึงพอใจกับผลลัพธ์หลังลอก <span class="required-star">*</span></div>
        ${radioField("satisfaction", OPTIONS.touchupSatisfaction, draft)}
      </div>
      <div class="step-group">
        <div class="step-group-title">การติดสีโดยรวม <span class="required-star">*</span></div>
        ${radioField("colorRetention", OPTIONS.touchupColorRetention, draft)}
      </div>
      <div class="step-group">
        <div class="step-group-title">มีสิ่งที่ต้องการแก้ไขเพิ่มเติมหรือไม่ <span class="required-star">*</span></div>
        ${radioField("wantsMoreChange", OPTIONS.touchupWantsMoreChange, draft)}
      </div>
      <div class="step-group" id="changeItemsBlock" ${draft.wantsMoreChange === "มี" ? "" : "hidden"}>
        <div class="step-group-title">สิ่งที่ต้องการแก้ไขเพิ่มเติม</div>
        ${chipGroup("changeItems", OPTIONS.touchupChangeItems, draft, true)}
      </div>
      <div class="step-group">
        <div class="step-group-title">ระดับความเข้มหลังทำเสร็จวันนี้ <span class="required-star">*</span></div>
        ${radioField("intensity", OPTIONS.intensity, draft)}
        <p class="muted small" style="margin-top:8px">${escapeHtml(INTENSITY_DISCLAIMER)}</p>
      </div>
      <div class="step-group">
        <div class="step-group-title">รูป Before <span class="required-star">*</span></div>
        <div class="photo-row">${photoSlot("before", "Before")}</div>
      </div>

      <div class="form-section-title">ส่วนที่ 3 — การออกแบบ</div>
      <div class="step-group">
        <div class="step-group-title">เทคนิคที่เลือกใช้ครั้งนี้</div>
        <p class="muted small">ค่าเริ่มต้นเป็นเทคนิคเดิม: ${escapeHtml((historyCtx && historyCtx.last.technique) || "-")}</p>
        ${radioField("technique", OPTIONS.technique, draft)}
      </div>
      <div class="step-group">
        <div class="step-group-title">ทรงที่ออกแบบ</div>
        <p class="muted small">ค่าเริ่มต้นเป็นทรงเดิม: ${escapeHtml((historyCtx && historyCtx.last.shapeDesign) || "-")}</p>
        ${chipGroup("shapeDesign", OPTIONS.touchupShape, draft, false)}
      </div>
      <div class="step-group">
        <div class="step-group-title">สีที่ต้องการ</div>
        <p class="muted small">ค่าเริ่มต้นเป็นสีเดิม: ${escapeHtml((historyCtx && historyCtx.last.colorUsed) || "-")}</p>
        ${radioField("colorChoice", OPTIONS.colorChoice8, draft)}
      </div>
      <div class="step-group">
        <div class="step-group-title">การกันคิ้ว</div>
        ${radioField("browGuard", OPTIONS.browGuard, draft)}
      </div>

      <div class="form-section-title">ส่วนที่ 4 — สรุปข้อมูลก่อนเริ่มทำ</div>
      <div class="box-quiet">
        ${row("การติดสีโดยรวม", draft.colorRetention)}
        ${draft.wantsMoreChange === "มี" && (draft.changeItems || []).length
          ? row("สิ่งที่ต้องการแก้ไขเพิ่มเติม", (draft.changeItems || []).map((v) => (v === "Other" ? (draft.changeItemsOther || "อื่นๆ") : v)).join(", "))
          : ""}
        ${row("เทคนิคที่เลือก", draft.technique || (historyCtx && historyCtx.last.technique))}
        ${row("ทรงที่ออกแบบ", draft.shapeDesign === "Other" ? (draft.shapeDesignOther || "อื่นๆ") : (draft.shapeDesign || (historyCtx && historyCtx.last.shapeDesign)))}
        ${row("สีที่เลือก", draft.colorChoice || (historyCtx && historyCtx.last.colorUsed))}
        ${row("ระดับความเข้มหลังทำเสร็จวันนี้", draft.intensity)}
      </div>

      <div class="step-group-title">ข้อตกลงและความยินยอม <span class="required-star">*</span></div>
      <div class="step-group" data-radio-key="finalAgree">
        <label class="agree-row">
          <input type="radio" name="finalAgree" value="agreed" ${draft.finalAgree === "agreed" ? "checked" : ""}>
          <span>${escapeHtml(FINAL_AGREEMENT_TEXT)}</span>
        </label>
      </div>

      <div class="step-group-title">ลายเซ็นลูกค้า <span class="required-star">*</span></div>
      <div class="sig-wrap"><canvas id="tuSigCanvas"></canvas></div>
      <div class="sig-actions"><button id="tuSigClearBtn" type="button">ล้างลายเซ็น</button></div>
    `;

    pad = createSignaturePad(document.getElementById("tuSigCanvas"));
    document.getElementById("tuSigClearBtn").addEventListener("click", () => pad.clear());

    const viewLastBtn = document.getElementById("tuViewLastBtn");
    if (viewLastBtn) {
      viewLastBtn.addEventListener("click", () => show("visitDetail", { data: historyCtx.last }));
    }

    container.querySelectorAll("[data-photo-input]").forEach((inputEl) => {
      inputEl.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const dataUrl = await readFileAsDataUrl(file);
        state.visitDraft[inputEl.dataset.photoInput + "PhotoDataUrl"] = dataUrl;
        render();
      });
    });
  }

  bindFieldEvents(container, state.visitDraft, (changedRadioName) => {
    bindReadinessToggle(container, state.visitDraft, changedRadioName);
    // ต้อง toggle DOM ตรง ๆ ห้าม re-render ทั้ง container เพราะจะล้างลายเซ็น/รูปที่เพิ่งใส่
    if (changedRadioName === "wantsMoreChange") {
      const block = document.getElementById("changeItemsBlock");
      if (block) block.hidden = state.visitDraft.wantsMoreChange !== "มี";
    }
  });

  ["click", "input", "change", "mousedown", "touchstart"].forEach((evt) => {
    container.addEventListener(evt, (e) => {
      const errEl = e.target.closest(".field-error");
      if (errEl) errEl.classList.remove("field-error");
    });
  });

  function clearFieldErrors() {
    container.querySelectorAll(".field-error").forEach((el) => el.classList.remove("field-error"));
  }
  function flagError(selector) {
    const el = container.querySelector(selector);
    if (el) el.classList.add("field-error");
    return el;
  }
  function scrollToFirstError(...els) {
    const first = els.find(Boolean);
    if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
    return !first;
  }

  backBtn.addEventListener("click", () => show(state.currentCustomer ? "customerProfile" : "home"));
  wireNotServedButton(document.getElementById("touchupNotServedBtn"));
  wireDraftSaveButton(document.getElementById("touchupDraftBtn"));

  nextBtn.addEventListener("click", () => {
    if (!state.currentCustomer || !state.visitContext) { show("home"); return; }

    clearFieldErrors();
    const draft = state.visitDraft;
    const scarEl = !draft.hasScar ? flagError('[data-radio-key="hasScar"]') : null;
    const irritationEl = !draft.irritation7d ? flagError('[data-radio-key="irritation7d"]') : null;
    const allergyEl = !draft.allergyInfo ? flagError('[data-radio-key="allergyInfo"]') : null;
    const satisfactionEl = !draft.satisfaction ? flagError('[data-radio-key="satisfaction"]') : null;
    const retentionEl = !draft.colorRetention ? flagError('[data-radio-key="colorRetention"]') : null;
    const wantsMoreEl = !draft.wantsMoreChange ? flagError('[data-radio-key="wantsMoreChange"]') : null;
    const intensityEl = !draft.intensity ? flagError('[data-radio-key="intensity"]') : null;
    const beforeEl = !draft.beforePhotoDataUrl ? flagError('[data-photo-key="before"]') : null;
    const changeItemsEl = draft.wantsMoreChange === "มี" && !(draft.changeItems || []).length ? flagError('[data-chip-key="changeItems"]') : null;
    const agreeEl = !draft.finalAgree ? flagError('[data-radio-key="finalAgree"]') : null;
    const alreadySigned = Boolean(draft.signatureCustomerDataUrl);
    const sigEl = (!pad || (pad.isEmpty() && !alreadySigned)) ? flagError(".sig-wrap") : null;

    const noErrors = scrollToFirstError(scarEl, irritationEl, allergyEl, satisfactionEl, retentionEl, wantsMoreEl, intensityEl, beforeEl, changeItemsEl, agreeEl, sigEl);
    if (!noErrors) return;

    if (!pad.isEmpty()) {
      draft.signatureCustomerDataUrl = pad.toDataURL();
    }
    draft.agreedAt = Date.now();
    // เก็บค่าเดิมจากประวัติไว้ใน draft ให้ techFields.js (ส่วนที่ 5) ใช้ fallback ตอนสร้าง payload
    // โดยไม่ต้อง fetch ประวัติซ้ำอีกรอบ — เผื่อกรณีช่างไม่ได้เลือกค่าใหม่ในส่วนที่ 3 (ไม่บังคับตอบ)
    if (historyCtx) {
      draft.prevTechnique = historyCtx.last.technique || null;
      draft.prevShapeDesign = historyCtx.last.shapeDesign || null;
      draft.prevColorUsed = historyCtx.last.colorUsed || null;
      if (!draft.technique && historyCtx.last.technique) draft.technique = historyCtx.last.technique;
      if (!draft.shapeDesign && historyCtx.last.shapeDesign && OPTIONS.touchupShape.includes(historyCtx.last.shapeDesign)) {
        draft.shapeDesign = historyCtx.last.shapeDesign;
      }
      if (!draft.colorChoice && historyCtx.last.colorUsed) draft.colorChoice = historyCtx.last.colorUsed;
    }
    show("techFields");
  });

  onEnter("formTouchup", async () => {
    const c = state.currentCustomer;
    if (!c) { show("home"); return; }
    historyCtx = null;
    container.innerHTML = `<div class="empty-hint">Loading history...</div>`;
    try {
      historyCtx = await loadHistoryCtx(c.customerId);
    } catch (e) {
      historyCtx = null;
      container.innerHTML = `<div class="empty-hint">โหลดประวัติเดิมไม่สำเร็จ</div>`;
      return;
    }
    if (!historyCtx) {
      container.innerHTML = `<div class="empty-hint">ไม่พบประวัติเดิม</div>`;
      return;
    }
    const draft = state.visitDraft;
    if (!draft.prevTechnique) draft.prevTechnique = historyCtx.last.technique || null;
    if (!draft.prevShapeDesign) draft.prevShapeDesign = historyCtx.last.shapeDesign || null;
    if (!draft.prevColorUsed) draft.prevColorUsed = historyCtx.last.colorUsed || null;
    if (!draft.technique && historyCtx.last.technique) draft.technique = historyCtx.last.technique;
    if (!draft.shapeDesign && historyCtx.last.shapeDesign && OPTIONS.touchupShape.includes(historyCtx.last.shapeDesign)) {
      draft.shapeDesign = historyCtx.last.shapeDesign;
    }
    if (!draft.colorChoice && historyCtx.last.colorUsed) draft.colorChoice = historyCtx.last.colorUsed;
    render();
  });
}
</script>
<script>
// ==== js/screens/techFields.js ====
// techFields.js — ส่วนบันทึกหลังทำ ใช้ร่วมกันทั้ง Form 1/2/3 (สัดส่วนสีที่ใช้, ความแดงผิว, ความติดสี, รูป After, ลายเซ็นช่าง)
// เหมือนกันทุกฟอร์มตามสเปก ("กติกากลางของทั้ง 3 ฟอร์ม") จึงมีหน้าเดียวใช้ร่วมกัน แยกแค่ payload ตอนบันทึก









function initTechFields() {
  const body = document.getElementById("techBody");
  const draftBtn = document.getElementById("tuSaveDraftBtn");
  const closeBtn = document.getElementById("tuSaveCloseBtn");

  function photoSlot(key, label) {
    const url = state.visitDraft[key + "PhotoDataUrl"];
    return `
      <div class="photo-slot" data-photo-key="${key}">
        ${url ? `<img src="${url}">` : `
          <label>
            <span class="photo-slot-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span>
            <span>${label}</span>
            <input type="file" accept="image/*" data-photo-input="${key}">
          </label>`}
      </div>`;
  }

  function render() {
    const draft = state.visitDraft;
    body.innerHTML = `
      ${visitHeaderHtml()}
      <div class="step-group">
        <div class="step-group-title">สัดส่วนสีที่ใช้ <span class="required-star">*</span></div>
        ${mixRatioField("mixRatioParts", OPTIONS.mixColors, draft)}
      </div>

      <div class="step-group">
        <div class="step-group-title">ความแดงผิว</div>
        ${radioField("redness", OPTIONS.redness, draft)}
      </div>

      <div class="step-group">
        <div class="step-group-title">ความติดสี</div>
        ${radioField("adherence", OPTIONS.adherence, draft)}
      </div>

      <div class="step-group">
        <div class="step-group-title">รูป After <span class="required-star">*</span></div>
        <div class="photo-row">${photoSlot("after", "After")}</div>
      </div>

      <div class="step-group">
        <div class="step-group-title">ลายเซ็นช่างผู้ให้บริการ</div>
        <div class="tech-sig-wrap">
          <img src="${TECH_SIGNATURE_DATA_URL}" alt="ลายเซ็นช่าง">
        </div>
        <p class="muted small" style="text-align:center">(ชนิสตา ศุภสุข)</p>
      </div>
    `;

    body.querySelectorAll("[data-photo-input]").forEach((inputEl) => {
      inputEl.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const dataUrl = await readFileAsDataUrl(file);
        state.visitDraft[inputEl.dataset.photoInput + "PhotoDataUrl"] = dataUrl;
        render();
      });
    });
  }

  bindFieldEvents(body, state.visitDraft, () => {});
  bindMixRatioEvents(body, state.visitDraft);

  document.getElementById("techBackBtn").addEventListener("click", () => show(state.formType || "form1"));
  wireNotServedButton(document.getElementById("techNotServedBtn"));

  function clearFieldErrors() {
    body.querySelectorAll(".field-error").forEach((el) => el.classList.remove("field-error"));
  }
  function flagError(selector) {
    const el = body.querySelector(selector);
    if (el) el.classList.add("field-error");
    return el;
  }

  function missingRequiredBeforeClose(draft) {
    if (!draft.beforePhotoDataUrl) return "รูป Before";
    if (!draft.finalAgree) return "Consent";
    if (!draft.signatureCustomerDataUrl) return "ลายเซ็นลูกค้า";
    if (!draft.hasScar || !draft.irritation7d || !draft.allergyInfo) return "ข้อมูลความพร้อมก่อนรับบริการ";
    if (draft.hasScar === "มี" && !(draft.scarCause || []).length) return "สาเหตุแผลเป็น";
    if (draft.hasScar === "มี" && (draft.scarCause || []).includes("Other") && !draft.scarCauseOther?.trim()) return "รายละเอียดแผลเป็น";
    if (draft.irritation7d === "มี" && !draft.irritationDetail?.trim()) return "รายละเอียดความระคายเคือง";
    if (draft.allergyInfo === "มี" && !draft.allergyDetail?.trim()) return "รายละเอียดอาการแพ้/ข้อมูลสำคัญ";
    if (state.formType === "form1") {
      if (!(draft.concerns || []).length) return "ปัญหาหลักที่กังวล";
      if (!draft.desiredOverview) return "ภาพรวมที่ต้องการ";
      if (!draft.intensity) return "ระดับความเข้ม";
      if (!draft.preServiceAgree) return "ยอมรับเงื่อนไขก่อนเริ่มบริการ";
    }
    if (state.formType === "form2") {
      if (!(draft.oldMarkLook || []).length) return "ลักษณะรอยเก่า";
      if (!(draft.fixPoints || []).length) return "จุดที่ต้องการแก้ไข";
      if (!draft.desiredOverview) return "ภาพรวมที่ต้องการ";
      if (!draft.intensity) return "ระดับความเข้ม";
      if (!draft.preServiceAgree) return "ยอมรับเงื่อนไขก่อนเริ่มบริการ";
    }
    if (state.formType === "form3") {
      if (!draft.satisfaction) return "ความพึงพอใจหลังลอก";
      if (!draft.colorRetention) return "การติดสีโดยรวม";
      if (!draft.wantsMoreChange) return "มีสิ่งที่ต้องการแก้ไขเพิ่มเติมหรือไม่";
      if (draft.wantsMoreChange === "มี" && !(draft.changeItems || []).length) return "สิ่งที่ต้องการแก้ไขเพิ่มเติม";
      if (!draft.intensity) return "ระดับความเข้ม";
      if (!(draft.technique || draft.prevTechnique)) return "เทคนิคที่เลือก";
      if (!(draft.colorChoice || draft.prevColorUsed)) return "สีที่เลือก";
      if (!(draft.shapeDesign || draft.prevShapeDesign)) return "ทรงที่ออกแบบ";
    }
    return "";
  }

  async function uploadAndBuildFolder() {
    const draft = state.visitDraft;
    const folderMeta = {
      customerPhone: state.currentCustomer.phoneNormalized,
      customerName: state.currentCustomer.fullName || state.currentCustomer.nickname,
      serviceType: state.serviceType,
      visitKey: ensureVisitSessionKey(draft)
    };
    const folderRes = await ensureVisitFolder(folderMeta);
    const uploadMeta = { folderId: folderRes.folderId };
    const hasSignature = Boolean(draft.signatureCustomerDataUrl);
    const [beforeUp, afterUp, sigUp] = await Promise.all([
      draft.beforePhotoDataUrl ? uploadImage(draft.beforePhotoDataUrl, { ...uploadMeta, filename: "before.jpg" }) : Promise.resolve(null),
      draft.afterPhotoDataUrl ? uploadImage(draft.afterPhotoDataUrl, { ...uploadMeta, filename: "after.jpg" }) : Promise.resolve(null),
      hasSignature
        ? uploadImage(draft.signatureCustomerDataUrl, { ...uploadMeta, filename: "signature_customer.png" })
        : Promise.resolve(null)
    ]);
    return {
      beforePhotoUrl: beforeUp ? beforeUp.url : null,
      afterPhotoUrl: afterUp ? afterUp.url : null,
      signatureCustomerUrl: hasSignature ? sigUp.url : null
    };
  }

  // payload ร่วมของทั้งปุ่ม "บันทึกแบบร่าง" และ "บันทึกเสร็จและปิด Visit" — เหมือนกันทั้ง 3 ฟอร์ม
  // ต่างกันแค่ formType/serviceType และฟิลด์เฉพาะฟอร์มที่ฝังมาใน draft อยู่แล้วจากหน้าก่อนหน้า
  function buildPayload(status) {
    const draft = state.visitDraft;
    return {
      serviceId: state.visitContext.visitId,
      customerId: state.currentCustomer.customerId,
      zervaBookingId: state.visitContext.zervaBookingId,
      timeSlot: state.visitContext.timeSlot,
      serviceType: state.serviceType,
      formType: state.formType,
      status,
      visitDate: state.visitContext.visitDate || Date.now(),
      technique: draft.technique || draft.prevTechnique || null,
      colorUsed: draft.colorChoice || draft.prevColorUsed || null,
      intensity: draft.intensity || null,
      muscle: draft.muscle || null,
      shapeDesign: draft.shapeDesign === "Other" ? (draft.shapeDesignOther || "อื่นๆ") : (draft.shapeDesign || draft.prevShapeDesign || null),
      browGuard: draft.browGuard || null,
      satisfaction: draft.satisfaction || null,
      colorRetention: draft.colorRetention || null,
      wantsMoreChange: draft.wantsMoreChange || null,
      changeItems: draft.wantsMoreChange === "มี" ? (draft.changeItems || []) : [],
      redness: draft.redness || null,
      adherence: draft.adherence || null,
      mixRatio: formatMixRatio("mixRatioParts", draft),
      note: [draft.shapeDesignNote, draft.adjustFromLast, draft.dontWant].filter((v) => v && v.trim()).join(" / ") || null
    };
  }

  draftBtn.addEventListener("click", async () => {
    if (!state.currentCustomer || !state.visitContext) { show("home"); return; }
    draftBtn.disabled = true;
    const draft = state.visitDraft;
    try {
      const { beforePhotoUrl, afterPhotoUrl, signatureCustomerUrl } = await uploadAndBuildFolder();
      const payload = {
        ...buildPayload("draft"),
        beforePhotoUrl, afterPhotoUrl, signatureCustomerUrl,
        signatureTechUrl: "(ชนิสตา ศุภสุข) — ลายเซ็นคงที่",
        rawAnswers: { ...draft, beforePhotoDataUrl: undefined, afterPhotoDataUrl: undefined }
      };
      await saveVisit(payload);
      alert("บันทึกแบบร่างแล้ว — กลับมาทำต่อได้ทุกเมื่อ");
    } catch (e) {
      console.warn("saveVisit (draft) failed:", e);
      alert("บันทึกแบบร่างไม่สำเร็จ — เช็คสัญญาณอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง");
    } finally {
      draftBtn.disabled = false;
    }
  });

  closeBtn.addEventListener("click", async () => {
    if (!state.currentCustomer || !state.visitContext) { show("home"); return; }
    clearFieldErrors();
    const draft = state.visitDraft;

    const mixRatio = formatMixRatio("mixRatioParts", draft);
    const missingBeforeClose = missingRequiredBeforeClose(draft);
    const mixEl = !mixRatio ? flagError('[data-mix-group="mixRatioParts"]') : null;
    const afterEl = !draft.afterPhotoDataUrl ? flagError('.photo-slot[data-photo-key="after"]') : null;
    const firstError = mixEl || afterEl;
    if (missingBeforeClose) {
      alert(`ยังปิด Visit ไม่ได้ — ขาดข้อมูลบังคับ: ${missingBeforeClose}`);
      return;
    }
    if (firstError) { firstError.scrollIntoView({ behavior: "smooth", block: "center" }); return; }

    closeBtn.disabled = true;
    try {
      const { beforePhotoUrl, afterPhotoUrl, signatureCustomerUrl } = await uploadAndBuildFolder();
      const payload = {
        ...buildPayload("เสร็จสิ้น"),
        mixRatio,
        beforePhotoUrl, afterPhotoUrl, signatureCustomerUrl,
        signatureTechUrl: "(ชนิสตา ศุภสุข) — ลายเซ็นคงที่",
        rawAnswers: { ...draft, beforePhotoDataUrl: undefined, afterPhotoDataUrl: undefined }
      };

      // ส่ง serviceId เดิมจาก Step 3 เสมอ (state.visitContext.visitId) เพื่อให้ saveVisit() ฝั่งเซิร์ฟเวอร์
      // "อัปเดตแถวเดิม" แทนสร้างแถวใหม่ — ถ้า state.visitContext หลุดไปคนละตัวจาก race/reload กลางทาง
      // (เช่น รีเฟรชหน้าระหว่างกรอกฟอร์ม) payload.serviceId จะไม่ตรงกับแถวเดิมในชีต แล้วได้ Visit ซ้อนกัน
      // เช็คซ้ำตรงนี้กันเคสที่ visitContext หายไประหว่างทาง
      if (!payload.serviceId) throw new Error("ไม่พบ Visit ID — กรุณากลับไปเริ่มใหม่จาก Customer Profile");

      const res = await saveVisit(payload);
      state.lastSavedServiceId = res.serviceId;
      show("confirmation");
    } catch (e) {
      console.warn("saveVisit (close) failed:", e);
      alert("บันทึกไม่สำเร็จ — เช็คสัญญาณอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง (ข้อมูลที่กรอกยังอยู่ในหน้านี้)");
      closeBtn.disabled = false;
    }
  });

  onEnter("techFields", render);
}
</script>
<script>
// ==== js/screens/confirmation.js ====
function initConfirmation() {
  const summaryEl = document.getElementById("confirmSummary");
  const exportBtn = document.getElementById("exportPdfBtn");
  const backHomeBtn = document.getElementById("backHomeBtn");

  exportBtn.addEventListener("click", async () => {
    exportBtn.disabled = true;
    exportBtn.textContent = "Generating PDF...";
    const res = await exportConsentPdf(state.lastSavedServiceId);
    exportBtn.disabled = false;
    exportBtn.textContent = "Export Consent Form (PDF) — mock";
    alert(res.note);
  });

  backHomeBtn.addEventListener("click", () => {
    state.reset();
    show("home");
  });

  onEnter("confirmation", () => {
    const c = state.currentCustomer;
    summaryEl.textContent = `Saved ${state.serviceType} visit for ${c ? (c.nickname || c.fullName) : ""} (ID ${state.lastSavedServiceId})`;
  });
}
</script>
<script>
// ==== js/main.js ====
initShell();
initLogin();
initHome();
initNewCustomer();
initCustomerProfile();
initVisitDetail();
initCreateVisit();
initServiceType();
initFormOne();
initFormTwo();
initFormTouchup();
initTechFields();
initConfirmation();

// เปิดหน้าใดหน้าหนึ่งตรง ๆ ได้ระหว่าง dev/testing เช่น
// index.html?debugScreen=customerProfile&debugCustomer=C0001&debugServiceType=สักคิ้ว
// ห่อด้วย async IIFE แทน top-level await เพราะไฟล์นี้จะถูกรวมเป็น <script> ธรรมดา
// (ไม่ใช่ type=module) ตอนแปลงเป็น Apps Script — top-level await ใช้ไม่ได้ในสคริปต์ปกติ
(async () => {
  const params = new URLSearchParams(location.search);
  const debugScreen = params.get("debugScreen");
  const debugCustomerId = params.get("debugCustomer");
  const debugServiceType = params.get("debugServiceType");

  // เช็ค session token (คุกกี้) กับเซิร์ฟเวอร์ทุกครั้งที่โหลดหน้า/refresh ใหม่ — ไม่เชื่อ flag ฝั่ง client เฉยๆ
  const token = getToken();
  const session = token ? await checkSession(token) : { valid: false };

  // debug เจาะจงหน้า / หรือ session ยัง valid อยู่จริง → ข้าม login; ไม่เช่นนั้นโชว์ login
  if (debugScreen || session.valid) {
    hideLogin();
  } else {
    showLogin();
  }

  if (debugCustomerId) {
    try {
      state.currentCustomer = await getCustomer(debugCustomerId);
    } catch (e) {
      console.warn("debugCustomer: ต้อง login ก่อนถึงจะดึงข้อมูลลูกค้าได้", e);
    }
  }
  if (debugServiceType) {
    state.serviceType = debugServiceType;
  }
  show(debugScreen || "home", { pushHistory: false });
})();
</script>
