// ==== js/utils.js ====
function formatDate(ts) {
  if (!ts) return "-";
  const d = new Date(ts);
  const months = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  const buddhistYear = d.getFullYear() + 543;
  return `${d.getDate()} ${months[d.getMonth()]} ${buddhistYear}`;
}

// วันที่แบบสั้น YYYY-MM-DD ใช้ในตาราง Customers (ตรงตามสไตล์ตัวอย่างที่ร้านส่งมา)
function formatDateShort(ts) {
  if (!ts) return "-";
  const d = new Date(ts);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

// unique key ต่อ visit หนึ่งครั้ง ใช้กันชื่อ Drive folder ชนกันเมื่อลูกค้าคนเดียวกันมีหลาย visit วันเดียวกัน
// สร้างครั้งแรกที่เรียกแล้ว cache ไว้ใน draft — เรียกซ้ำได้ค่าเดิมตลอดวงจรชีวิตของ visit นั้น
function ensureVisitSessionKey(draft) {
  if (!draft.visitSessionKey) {
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    draft.visitSessionKey = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  }
  return draft.visitSessionKey;
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ==== js/state.js ====
// state.js — เก็บ state ระหว่างหน้าจอ (ฝั่ง client เท่านั้น, ไม่ persist)
// เทียบเท่ากับตัวแปรที่ส่งผ่านกันระหว่างหน้าใน Apps Script HtmlService

const state = {
  currentCustomer: null,      // customer object ที่กำลังเปิดดู/เพิ่มประวัติ
  serviceType: null,          // "สักคิ้ว" | "เติมสี"
  visitDraft: {},             // คำตอบฟอร์มที่กำลังกรอก สะสมไปเรื่อย ๆ จนกว่าจะบันทึกจริง
  browStepIndex: 0,
  lastSavedServiceId: null,

  // สำคัญ: ล้างค่าใน object เดิม (ไม่สร้าง object ใหม่) เพราะ bindFieldEvents()
  // เก็บ reference ของ state.visitDraft ไว้ตอน init หน้าจอ ถ้า reassign ใหม่
  // event handler เก่าจะยังชี้ไป object เก่า ทำให้ข้อมูลไม่ sync
  resetVisitDraft() {
    Object.keys(this.visitDraft).forEach((k) => delete this.visitDraft[k]);
  },

  reset() {
    this.currentCustomer = null;
    this.serviceType = null;
    this.resetVisitDraft();
    this.browStepIndex = 0;
  }
};

// ==== js/router.js ====
// router.js — สลับหน้าจอแบบง่าย (ไม่ใช้ URL hash เพื่อให้เหมือนพฤติกรรม Apps Script HtmlService SPA)

const enterHandlers = {};
let historyStack = ["home"];

function onEnter(screenId, handler) {
  enterHandlers[screenId] = handler;
}

function show(screenId, opts = {}) {
  document.querySelectorAll(".screen").forEach((el) => el.classList.remove("active"));
  const target = document.getElementById("screen-" + screenId);
  if (!target) {
    console.error("Unknown screen:", screenId);
    return;
  }
  target.classList.add("active");

  if (opts.pushHistory !== false) {
    if (historyStack[historyStack.length - 1] !== screenId) {
      historyStack.push(screenId);
    }
  }

  if (enterHandlers[screenId]) {
    enterHandlers[screenId](opts.data);
  }
  window.scrollTo(0, 0);
}

function goBack(fallback = "home") {
  historyStack.pop(); // ทิ้งหน้าปัจจุบัน
  const prev = historyStack.pop() || fallback;
  show(prev);
}

// ผูกปุ่มที่มี data-back="screenId" ให้กลับไปหน้านั้นแบบตรง ๆ (ไม่พึ่ง history stack)
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-back]");
  if (btn) {
    show(btn.getAttribute("data-back"));
  }
});

// ==== js/shell.js ====
function initShell() {
  const hamburgerBtn = document.getElementById("hamburgerBtn");
  const dropdown = document.getElementById("mobileDropdown");
  const overlay = document.getElementById("mobileMenuOverlay");
  const closeBtn = document.getElementById("mobileMenuClose");
  let closeTimer;

  function closeDropdown() {
    dropdown.classList.remove("is-open");
    overlay.classList.remove("is-visible");
    hamburgerBtn.setAttribute("aria-expanded", "false");
    clearTimeout(closeTimer);
    closeTimer = window.setTimeout(() => {
      dropdown.hidden = true;
      overlay.hidden = true;
    }, 220);
  }

  function openDropdown() {
    clearTimeout(closeTimer);
    dropdown.hidden = false;
    overlay.hidden = false;
    requestAnimationFrame(() => {
      dropdown.classList.add("is-open");
      overlay.classList.add("is-visible");
    });
    hamburgerBtn.setAttribute("aria-expanded", "true");
  }

  hamburgerBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (dropdown.hidden) openDropdown();
    else closeDropdown();
  });

  closeBtn.addEventListener("click", closeDropdown);
  overlay.addEventListener("click", closeDropdown);

  document.addEventListener("click", (e) => {
    if (!dropdown.hidden && !dropdown.contains(e.target) && e.target !== hamburgerBtn) {
      closeDropdown();
    }
  });

  dropdown.querySelectorAll(".mobile-dropdown-item").forEach((item) => {
    item.addEventListener("click", closeDropdown);
  });

  // ปุ่มโปรไฟล์ในเมนูมือถือ (Reset password / Log out)
  dropdown.querySelectorAll("[data-account-action]").forEach((item) => {
    item.addEventListener("click", () => {
      const action = item.dataset.accountAction;
      closeDropdown();
      if (action === "reset") {
        openReset();
      } else if (action === "logout") {
        setLoggedIn(false);
        show("home");
        showLogin();
      }
    });
  });

  // ลิงก์เมนู (sidebar เดสก์ท็อป + dropdown มือถือ) ที่มี data-nav ให้พาไปหน้านั้นจริง ๆ
  document.querySelectorAll("[data-nav]").forEach((link) => {
    link.addEventListener("click", (e) => {
      e.preventDefault();
      show(link.dataset.nav);
    });
  });

  initUserMenu();
}

// เมนูผู้ใช้ที่ footer ของ sidebar: Reset password / Log out
function initUserMenu() {
  const menu = document.getElementById("userMenu");
  const trigger = document.getElementById("userMenuTrigger");
  const popover = document.getElementById("userMenuPopover");
  if (!menu || !trigger || !popover) return;

  function closeMenu() {
    menu.classList.remove("is-open");
    popover.hidden = true;
    trigger.setAttribute("aria-expanded", "false");
  }

  function openMenu() {
    menu.classList.add("is-open");
    popover.hidden = false;
    trigger.setAttribute("aria-expanded", "true");
  }

  trigger.addEventListener("click", (e) => {
    e.stopPropagation();
    if (popover.hidden) openMenu();
    else closeMenu();
  });

  document.addEventListener("click", (e) => {
    if (!popover.hidden && !menu.contains(e.target)) closeMenu();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeMenu();
  });

  popover.querySelectorAll(".user-menu-item").forEach((item) => {
    item.addEventListener("click", () => {
      const action = item.dataset.action;
      closeMenu();
      // TODO: เชื่อมระบบ auth จริงเมื่อ backend พร้อม (เพื่อนอีกคนทำ)
      if (action === "reset") {
        openReset();
      } else if (action === "logout") {
        setLoggedIn(false);
        show("home");
        showLogin();
      }
    });
  });
}

// ==== js/signaturePad.js ====
// signaturePad.js — canvas เซ็นชื่อแบบง่าย รองรับ touch/pen บน iPad Safari

function createSignaturePad(canvas) {
  const ctx = canvas.getContext("2d");
  let drawing = false;
  let hasInk = false;
  let last = null;

  function resize() {
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.4;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#0b3d2e";
  }
  resize();
  window.addEventListener("resize", resize);

  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    const point = e.touches ? e.touches[0] : e;
    return { x: point.clientX - rect.left, y: point.clientY - rect.top };
  }

  function start(e) {
    e.preventDefault();
    drawing = true;
    last = pos(e);
  }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
    hasInk = true;
  }
  function end() { drawing = false; }

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  canvas.addEventListener("touchend", end);

  return {
    clear() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hasInk = false;
    },
    isEmpty() { return !hasInk; },
    toDataURL() { return canvas.toDataURL("image/png"); }
  };
}

// ==== js/fieldHelpers.js ====
// fieldHelpers.js — ตัวช่วยสร้าง HTML ฟิลด์ฟอร์มแบบใช้ซ้ำได้ (chip / radio / text)
// ใช้ร่วมกันระหว่าง formBrow.js และ techFields.js


function radioField(key, options, draft) {
  return `
    <div class="radio-row" data-radio-key="${key}">
      ${options.map((opt) => `
        <label class="native-choice">
          <input type="radio" name="${key}" value="${escapeHtml(opt)}" ${draft[key] === opt ? "checked" : ""}>
          <span>${escapeHtml(opt)}</span>
        </label>
      `).join("")}
    </div>`;
}

// option ที่ชื่อ "Other" จะมีช่องกรอกข้อความต่อท้ายทันที (โชว์เฉพาะตอนติ๊กเลือก) — ค่าที่พิมพ์เก็บแยกไว้ที่ draft[`${key}Other`]
function chipGroup(key, options, draft, multi) {
  const selected = multi ? (draft[key] || []) : [draft[key]].filter(Boolean);
  const otherKey = `${key}Other`;
  const inputType = multi ? "checkbox" : "radio";
  return `
    <div class="choice-grid" data-chip-key="${key}" data-chip-multi="${multi ? "1" : "0"}">
      ${options.map((opt) => {
        const isOther = opt === "Other";
        const checked = selected.includes(opt);
        return `
          <label class="native-choice">
            <input type="${inputType}" ${multi ? "" : `name="${key}"`} data-chip-value="${escapeHtml(opt)}" ${checked ? "checked" : ""}>
            <span>${isOther ? "อื่นๆ" : escapeHtml(opt)}</span>
          </label>
          ${isOther ? `<input type="text" class="input other-input" data-other-key="${otherKey}" placeholder="ระบุ..." value="${escapeHtml(draft[otherKey] || "")}" ${checked ? "" : "hidden"}>` : ""}
        `;
      }).join("")}
    </div>`;
}

// placeholder ปิดไว้ตามคำสั่งผู้ใช้ — พารามิเตอร์ยังรับไว้เผื่อเปิดใช้อีกครั้งในอนาคต
function textField(key, placeholder, draft) {
  return `<input type="text" class="input" data-text-key="${key}" value="${escapeHtml(draft[key] || "")}"><!-- placeholder="${escapeHtml(placeholder || "")}" -->`;
}

function textAreaField(key, placeholder, draft) {
  return `<textarea class="input textarea" data-text-key="${key}">${escapeHtml(draft[key] || "")}</textarea><!-- placeholder="${escapeHtml(placeholder || "")}" -->`;
}

// ผูก event delegation ให้ container ที่มี chip/radio/text field จาก helper ข้างบน
// เรียกครั้งเดียวตอน init แล้ว renderStep() ใหม่ได้เรื่อย ๆ โดยไม่ต้องผูกซ้ำ
function bindFieldEvents(container, draft, onChange) {
  container.addEventListener("change", (e) => {
    const chipGroupEl = e.target.closest("[data-chip-key]");
    if (chipGroupEl && e.target.dataset.chipValue !== undefined) {
      const key = chipGroupEl.dataset.chipKey;
      const multi = chipGroupEl.dataset.chipMulti === "1";
      const value = e.target.dataset.chipValue;
      if (multi) {
        const arr = draft[key] || (draft[key] = []);
        const idx = arr.indexOf(value);
        if (e.target.checked && idx < 0) arr.push(value);
        if (!e.target.checked && idx >= 0) arr.splice(idx, 1);
      } else {
        draft[key] = e.target.checked ? value : null;
      }
      const otherInput = chipGroupEl.querySelector("[data-other-key]");
      if (otherInput) {
        otherInput.hidden = multi ? !draft[key].includes("Other") : draft[key] !== "Other";
      }
      onChange();
      return;
    }

    const radioGroupEl = e.target.closest("[data-radio-key]");
    if (radioGroupEl && e.target.name) {
      draft[e.target.name] = e.target.value;
      onChange(e.target.name);
    }
  });

  container.addEventListener("input", (e) => {
    if (e.target.dataset.textKey) {
      draft[e.target.dataset.textKey] = e.target.value;
    }
    if (e.target.dataset.otherKey) {
      draft[e.target.dataset.otherKey] = e.target.value;
    }
  });
}

// ==== Server API bridge (แทนที่ js/mockApi.js) ====
// ห่อ google.script.run ให้เรียกแบบ Promise เหมือน mockApi.js เดิม ชื่อฟังก์ชันตรงกันทุกตัว
// normalizePhone เป็น utility ล้วน ๆ (ไม่ต้องยิงเซิร์ฟเวอร์) — คัดลอกมาจาก js/mockApi.js ตรงตัว
// เพราะฝั่ง client (gas/JavaScript.html) กับฝั่ง server (gas/*.gs) เป็นคนละ scope กันโดยสิ้นเชิงใน Apps Script
function normalizePhone(phone) {
  if (!phone) return "";
  let p = String(phone).replace(/[^\d+]/g, "");
  if (p.startsWith("+66")) p = "0" + p.slice(3);
  else if (p.startsWith("66") && p.length > 9) p = "0" + p.slice(2);
  return p;
}
function callServer_(name, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler((err) => reject(err))
      [name](...args);
  });
}
function checkPasscode(pin) { return callServer_("checkPasscode", pin); }
function searchCustomers(query) { return callServer_("searchCustomers", query); }
function listRecentCustomers(limit) { return callServer_("listRecentCustomers", limit); }
function listCustomersWithStats() { return callServer_("listCustomersWithStats"); }
function findCustomerByPhone(phone) { return callServer_("findCustomerByPhone", phone); }
function createCustomer(data) { return callServer_("createCustomer", data); }
function getCustomer(customerId) { return callServer_("getCustomer", customerId); }
function getHistoryByCustomer(customerId) { return callServer_("getHistoryByCustomer", customerId); }
function saveVisit(payload) { return callServer_("saveVisit", payload); }
function ensureVisitFolder(meta) { return callServer_("ensureVisitFolder", meta); }
function uploadImage(dataUrl, meta) { return callServer_("uploadImage", dataUrl, meta); }
function exportConsentPdf(serviceId) { return callServer_("exportConsentPdf", serviceId); }

function initGate() {
  const input = document.getElementById("passcodeInput");
  const errorEl = document.getElementById("gateError");
  const submitBtn = document.getElementById("gateSubmit");

  async function trySubmit() {
    errorEl.hidden = true;
    submitBtn.disabled = true;
    const res = await checkPasscode(input.value.trim());
    submitBtn.disabled = false;
    if (res.success) {
      input.value = "";
      show("home");
    } else {
      errorEl.hidden = false;
    }
  }

  submitBtn.addEventListener("click", trySubmit);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") trySubmit();
  });

  onEnter("gate", () => {
    input.value = "";
    errorEl.hidden = true;
    input.focus();
  });
}

// login.js — หน้าเข้าสู่ระบบ + modal รีเซ็ตรหัสผ่าน (UI เท่านั้น) วางทับทั้งแอปด้วย z-index สูง
// TODO: เชื่อมระบบ auth จริงเมื่อ backend พร้อม (เพื่อนอีกคนทำ)

const LOGGED_IN_KEY = "pyneCrmLoggedIn";

let screen, form, emailInput, pwInput, errorEl;
let resetOverlay, resetForm, resetPw, resetPwConfirm, resetError;

function isLoggedIn() {
  return localStorage.getItem(LOGGED_IN_KEY) === "1";
}

function setLoggedIn(value) {
  if (value) localStorage.setItem(LOGGED_IN_KEY, "1");
  else localStorage.removeItem(LOGGED_IN_KEY);
}

function showLogin() {
  if (!screen) return;
  closeReset(); // กันไม่ให้ modal reset ค้างทับหน้า login
  screen.hidden = false;
  if (emailInput) emailInput.value = "";
  if (pwInput) pwInput.value = "";
  if (errorEl) errorEl.hidden = true;
  if (emailInput) emailInput.focus();
}

function hideLogin() {
  if (screen) screen.hidden = true;
}

function openReset() {
  if (!resetOverlay) return;
  resetPw.value = "";
  resetPwConfirm.value = "";
  resetError.hidden = true;
  resetOverlay.hidden = false;
  resetPw.focus();
}

function closeReset() {
  if (resetOverlay) resetOverlay.hidden = true;
}

function initLogin() {
  screen = document.getElementById("loginScreen");
  form = document.getElementById("loginForm");
  emailInput = document.getElementById("loginEmail");
  pwInput = document.getElementById("loginPassword");
  errorEl = document.getElementById("loginError");
  const toggleBtn = document.getElementById("loginTogglePw");
  const forgotBtn = document.getElementById("loginForgot");

  resetOverlay = document.getElementById("resetOverlay");
  resetForm = document.getElementById("resetForm");
  resetPw = document.getElementById("resetPw");
  resetPwConfirm = document.getElementById("resetPwConfirm");
  resetError = document.getElementById("resetError");
  closeReset(); // เริ่มต้นให้ modal ปิดเสมอ กันสถานะค้างจากการโหลดผิดปกติ

  if (form) {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      // ยังไม่มีระบบ auth จริง (รอ backend) — กด Sign In เข้าหน้าหลักได้เลย
      errorEl.hidden = true;
      setLoggedIn(true);
      hideLogin();
    });

    toggleBtn.addEventListener("click", () => {
      const show = pwInput.type === "password";
      pwInput.type = show ? "text" : "password";
      toggleBtn.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });

    forgotBtn.addEventListener("click", openReset);
  }

  initResetModal();
}

function initResetModal() {
  if (!resetOverlay || !resetForm) return;
  const closeBtn = document.getElementById("resetClose");
  const backBtn = document.getElementById("resetBack");

  resetForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const pw = resetPw.value.trim();
    const confirm = resetPwConfirm.value.trim();
    if (!pw || pw !== confirm) {
      resetError.hidden = false;
      return;
    }
    resetError.hidden = true;
    // TODO: ส่งรหัสใหม่ไป backend จริงเมื่อพร้อม
    closeReset();
    alert("Password updated");
  });

  // ปุ่มลูกตาโชว์/ซ่อนรหัสของทั้งสองช่อง
  resetForm.querySelectorAll("[data-reset-toggle]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const field = document.getElementById(btn.dataset.resetToggle);
      const show = field.type === "password";
      field.type = show ? "text" : "password";
      btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });
  });

  closeBtn.addEventListener("click", closeReset);
  backBtn.addEventListener("click", closeReset);
  resetOverlay.addEventListener("click", (e) => {
    if (e.target === resetOverlay) closeReset();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !resetOverlay.hidden) closeReset();
  });
}

      });

      popover.querySelectorAll("[data-action]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          closeAllMenus();
          if (!customer) return;
          if (btn.dataset.action === "view") openProfile(customer);
          else if (btn.dataset.action === "service") openService(customer);
        });
      });
    });
  }

  function closeAllOpenMenus() {
    tbody.querySelectorAll(".row-menu.is-open").forEach((menu) => {
      menu.classList.remove("is-open");
      const pop = menu.querySelector(".row-menu-popover");
      const trigger = menu.querySelector(".row-menu-trigger");
      if (pop) pop.hidden = true;
      if (trigger) trigger.setAttribute("aria-expanded", "false");
    });
  }

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".row-menu")) closeAllOpenMenus();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeAllOpenMenus();
  });

  async function loadCustomers() {
    table.hidden = true;
    emptyState.hidden = false;
    emptyState.textContent = "Loading...";
    allCustomers = await listCustomersWithStats();
    renderSummary();
    render();
  }

  searchInput.addEventListener("input", render);

  newCustomerBtn.addEventListener("click", () => {
    // ลูกค้าใหม่: สร้างลูกค้าเข้าฐานข้อมูลก่อน แล้วจึงเลือกบริการ (แยกตัวตนออกจากฟอร์มคอนเซ้นต์)
    state.currentCustomer = null;
    state.serviceType = null;
    state.resetVisitDraft();
    show("newCustomer");
  });

  onEnter("home", () => {
    searchInput.value = "";
    loadCustomers();
  });
}

// ==== js/screens/newCustomer.js ====
// newCustomer.js — หน้าสร้างลูกค้าใหม่ (แยกออกจากฟอร์มบริการ)
// flow: home > "+ New Customer" > หน้านี้ > สร้างลูกค้าเข้า DB > เปิด modal เลือกบริการ






function initNewCustomer() {
  const nameEl = document.getElementById("ncName");
  const phoneEl = document.getElementById("ncPhone");
  const lineEl = document.getElementById("ncLine");
  const warnEl = document.getElementById("ncWarning");
  const createBtn = document.getElementById("ncCreateBtn");
  const backBtn = document.getElementById("newCustomerBackBtn");

  backBtn.addEventListener("click", () => show("home"));

  function clearErrors() {
    [nameEl, phoneEl].forEach((el) => el.classList.remove("field-error"));
    warnEl.innerHTML = "";
  }

  [nameEl, phoneEl].forEach((el) => {
    el.addEventListener("input", () => el.classList.remove("field-error"));
  });

  createBtn.addEventListener("click", async () => {
    clearErrors();
    const name = nameEl.value.trim();
    const phone = phoneEl.value.trim();
    const line = lineEl.value.trim();

    let firstErr = null;
    if (!name) { nameEl.classList.add("field-error"); firstErr = firstErr || nameEl; }
    if (!phone) { phoneEl.classList.add("field-error"); firstErr = firstErr || phoneEl; }
    if (firstErr) { firstErr.scrollIntoView({ behavior: "smooth", block: "center" }); return; }

    createBtn.disabled = true;

    // กันเบอร์ซ้ำ: ถ้ามีลูกค้าเบอร์นี้แล้ว เสนอให้เปิดประวัติคนเดิมแทนการสร้างซ้ำ
    const existing = await findCustomerByPhone(phone);
    if (existing) {
      createBtn.disabled = false;
      warnEl.innerHTML = `
        <div class="dup-warning">
          ⚠ This phone number already exists: <b>${escapeHtml(existing.name)}</b> (${escapeHtml(existing.phoneDisplay)})<br>
          Please use the existing customer instead of creating a duplicate.
          <br><button class="btn btn-primary" id="ncUseExistingBtn" type="button" style="margin-top:8px">Open this customer</button>
        </div>`;
      document.getElementById("ncUseExistingBtn").addEventListener("click", () => {
        state.currentCustomer = existing;
        show("customerProfile");
      });
      return;
    }

    const res = await createCustomer({ name, phone, line });
    createBtn.disabled = false;
    if (!res.success) {
      warnEl.innerHTML = `<div class="dup-warning">⚠ Could not create customer (this phone may have just been added). Please try again.</div>`;
      return;
    }

    // สร้างลูกค้าสำเร็จ → ตั้งเป็นลูกค้าปัจจุบัน แล้วพาไปหน้าประวัติพร้อมเปิด modal เลือกบริการทับ
    state.currentCustomer = res.customer;
    state.serviceType = null;
    state.resetVisitDraft();
    show("customerProfile");
    openServiceTypeModal();
  });

  onEnter("newCustomer", () => {
    nameEl.value = "";
    phoneEl.value = "";
    lineEl.value = "";
    clearErrors();
    createBtn.disabled = false;
  });
}

function initCustomerProfile() {
  const profileCard = document.getElementById("profileCard");
  const historyList = document.getElementById("historyList");
  const addVisitBtn = document.getElementById("addVisitBtn");

  addVisitBtn.addEventListener("click", () => {
    state.resetVisitDraft();
    state.serviceType = null;
    openServiceTypeModal();
  });

  onEnter("customerProfile", async () => {
    const c = state.currentCustomer;
    if (!c) { show("home"); return; }

    profileCard.innerHTML = `
      <div class="pname">${escapeHtml(c.name)}</div>
      <div class="pmeta">📞 ${escapeHtml(c.phoneDisplay)}${c.line ? " &nbsp;·&nbsp; LINE: " + escapeHtml(c.line) : ""}</div>
    `;

    historyList.innerHTML = `<div class="empty-hint">Loading history...</div>`;
    const history = await getHistoryByCustomer(c.customerId);

    if (history.length === 0) {
      historyList.innerHTML = `<div class="empty-hint">No service history yet</div>`;
      return;
    }

    historyList.innerHTML = history.map((v) => `
      <div class="history-item" data-id="${v.serviceId}">
        <span class="hdate">${formatDate(v.visitDate)}</span>
        <span class="htype ${v.serviceType === "เติมสี" ? "touchup" : ""}">${escapeHtml(v.serviceType)}</span>
        <div class="hdetail">
          Technique: ${escapeHtml(v.technique || "-")} · Color: ${escapeHtml(v.colorUsed || "-")}<br>
          Intensity: ${escapeHtml(v.intensity || "-")}
          ${v.note ? `<br>Note: ${escapeHtml(v.note)}` : ""}
        </div>
      </div>
    `).join("");

    historyList.querySelectorAll(".history-item").forEach((el) => {
      el.addEventListener("click", () => {
        const visit = history.find((h) => h.serviceId === el.dataset.id);
        show("visitDetail", { data: visit });
      });
    });
  });
}

function fmtValue(v) {
  if (Array.isArray(v)) return v.length ? v.join(", ") : "-";
  if (v === undefined || v === null || v === "") return "-";
  return String(v);
}

function row(label, value) {
  return `
    <div class="detail-row">
      <div class="detail-label">${escapeHtml(label)}</div>
      <div class="detail-value">${escapeHtml(fmtValue(value))}</div>
    </div>`;
}

// ==== js/screens/serviceType.js ====
let modalEl = null;
let closeTimer = null;

function getModal() {
  if (!modalEl) modalEl = document.getElementById("serviceTypeModal");
  return modalEl;
}

// เปิด modal เลือกประเภทบริการทับหน้าจอปัจจุบัน (home หรือ customerProfile)
function openServiceTypeModal() {
  const modal = getModal();
  if (!modal) return;
  // "เติมสี" ใช้ได้เฉพาะลูกค้าเก่าที่มีประวัติอยู่แล้ว — ลูกค้าใหม่ต้องทำ "สักคิ้ว" เท่านั้น
  document.getElementById("chooseTouchupBtn").hidden = !state.currentCustomer;
  clearTimeout(closeTimer);
  modal.hidden = false;
  requestAnimationFrame(() => modal.classList.add("is-open"));
}

function closeServiceTypeModal() {
  const modal = getModal();
  if (!modal || modal.hidden) return;
  modal.classList.remove("is-open");
  closeTimer = setTimeout(() => { modal.hidden = true; }, 220);
}

function initServiceType() {
  const modal = getModal();
  if (!modal) return;

  document.getElementById("serviceTypeCloseBtn").addEventListener("click", closeServiceTypeModal);

  // คลิกพื้นหลัง (backdrop) เพื่อปิด
  modal.addEventListener("click", (e) => {
    if (e.target === modal) closeServiceTypeModal();
  });

  // ปุ่ม Esc เพื่อปิด
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !modal.hidden) closeServiceTypeModal();
  });

  document.getElementById("chooseBrowBtn").addEventListener("click", () => {
    state.serviceType = "สักคิ้ว";
    state.resetVisitDraft();
    state.browStepIndex = 0;
    closeServiceTypeModal();
    show("formBrow");
  });

  document.getElementById("chooseTouchupBtn").addEventListener("click", () => {
    state.serviceType = "เติมสี";
    state.resetVisitDraft();
    closeServiceTypeModal();
    show("formTouchup");
  });
}

function todayDateValue() {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function nowTimeValue() {
  const d = new Date();
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

    const techniqueEl = !draft.technique ? flagError('[data-chip-key="technique"]') : null;
    const intensityEl = !draft.intensity ? flagError("#intensityOptions") : null;
    const agreeEl = !draft.agree ? flagError('[data-radio-key="agree"]') : null;
    // ถ้าเคยเซ็นแล้วตอนกดถัดไปครั้งก่อน (draft.signatureCustomerDataUrl มีค่า) แล้วย้อนกลับมาดูหน้านี้อีกที
    // แคนวาสจะว่างเปล่าเพราะสร้างใหม่ทุกครั้ง — ไม่บังคับให้เซ็นซ้ำถ้ามีลายเซ็นเดิมอยู่แล้ว
    const alreadySigned = Boolean(draft.signatureCustomerDataUrl);
    const sigEl = (!pad || (pad.isEmpty() && !alreadySigned)) ? flagError(".sig-wrap") : null;

    const noErrors = scrollToFirstError(dateEl || timeEl, hadBrowEl, skinTypeEl, techniqueEl, intensityEl, agreeEl, sigEl);
    if (!noErrors) return;

    // เก็บลายเซ็นเป็น dataURL ดิบไว้ใน draft ก่อน แล้วค่อย upload รวมกับรูป before/after
    // ที่หน้า techFields (page 2) ทีเดียว เพื่อให้ทุกไฟล์ของ visit นี้ลงโฟลเดอร์เดียวกัน
    if (!pad.isEmpty()) {
      draft.signatureCustomerDataUrl = pad.toDataURL();
    }
    draft.agreedAt = Date.now();
    show("techFields");
  });

  backBtn.addEventListener("click", () => {
    show(state.currentCustomer ? "customerProfile" : "home");
    openServiceTypeModal();
  });

  onEnter("formBrow", render);
}

// ==== js/screens/formTouchup.js ====
// formTouchup.js — ร่างเบื้องต้น (DRAFT) รอฟิลด์ฉบับสมบูรณ์จากร้าน ดู implementation-plan-phase1.md






function initFormTouchup() {
  const prevBox = document.getElementById("touchupPrevVisit");
  const adjustEl = document.getElementById("tuAdjust");
  const intensityEl = document.getElementById("tuIntensity");
  const priceEl = document.getElementById("tuPrice");
  const nextBtn = document.getElementById("tuNextBtn");
  const backBtn = document.getElementById("touchupBackBtn");

  backBtn.addEventListener("click", () => {
    show(state.currentCustomer ? "customerProfile" : "home");
    openServiceTypeModal();
  });

  nextBtn.addEventListener("click", () => {
    state.visitDraft.adjustFromLast = adjustEl.value.trim();
    state.visitDraft.intensity = intensityEl.value;
    state.visitDraft.touchupPrice = priceEl.value;
    show("techFields");
  });

  onEnter("formTouchup", async () => {
    adjustEl.value = "";
    priceEl.value = "";
    const c = state.currentCustomer;
    if (!c) { show("home"); return; }
    prevBox.textContent = "กำลังโหลดประวัติล่าสุด...";
    const history = await getHistoryByCustomer(c.customerId);
    if (history.length === 0) {
      prevBox.innerHTML = `<b>ไม่มีประวัติเก่า</b> — ลูกค้าคนนี้ยังไม่เคยมีประวัติในระบบ`;
      return;
    }
    const last = history[0];
    prevBox.innerHTML = `
      <b>ครั้งล่าสุด:</b> ${formatDate(last.visitDate)} (${escapeHtml(last.serviceType)})<br>
      เทคนิค: ${escapeHtml(last.technique || "-")} · สี: ${escapeHtml(last.colorUsed || "-")}<br>
      ความเข้ม: ${escapeHtml(last.intensity || "-")}
      ${last.note ? `<br>หมายเหตุ: ${escapeHtml(last.note)}` : ""}
    `;
  });
}

// ==== js/screens/techFields.js ====
function initTechFields() {
  const body = document.getElementById("techBody");
  const saveBtn = document.getElementById("techSaveBtn");
  const backBtn = document.getElementById("techBackBtn");

  function photoSlot(key, label) {
    const url = state.visitDraft[key + "PhotoDataUrl"];
    return `
      <div class="photo-slot" data-photo-key="${key}">
        ${url ? `<img src="${url}">` : `
          <label>
            <span style="font-size:22px">📷</span>
            <span>${label}</span>
            <input type="file" accept="image/*" data-photo-input="${key}">
          </label>`}
      </div>`;
  }

  function render() {
    const isTouchup = state.serviceType === "เติมสี";
    body.innerHTML = `
      <div class="step-group">
        <div class="step-group-title">รูป Before / After <span class="required-star">*</span></div>
        <div class="photo-row">
          ${photoSlot("before", "Before")}
          ${photoSlot("after", "After")}
        </div>
      </div>

      ${!isTouchup ? `
      <div class="step-group">
        <div class="step-group-title">กล้ามเนื้อคิ้ว</div>
        ${chipGroup("muscle", OPTIONS.muscle, state.visitDraft, true)}
        <div class="step-group-title">ทรงที่ออกแบบ</div>
        ${chipGroup("shapeDesign", OPTIONS.shapeDesign, state.visitDraft, true)}
        <div class="step-group-title">การกันคิ้ว</div>
        ${radioField("browGuard", OPTIONS.browGuard, state.visitDraft)}
      </div>` : ""}

      <div class="step-group">
        <div class="step-group-title">สีที่ใช้</div>
        ${chipGroup("colorUsed", OPTIONS.colorUsed, state.visitDraft, false)}
      </div>

      <div class="step-group">
        <div class="step-group-title">ผลการวิเคราะห์จากช่าง</div>
        ${textAreaField("analysis", "บันทึกผลการวิเคราะห์ / หมายเหตุ", state.visitDraft)}
      </div>

      <div class="step-group">
        <div class="step-group-title">ลายเซ็นช่างผู้ให้บริการ</div>
        <div class="tech-sig-wrap">
          <img src="${TECH_SIGNATURE_DATA_URL}" alt="ลายเซ็นช่าง">
        </div>
        <p class="muted small" style="text-align:center">(ชนิสตา ศุภสุข)</p>
      </div>
    `;

    body.querySelectorAll("[data-photo-input]").forEach((inputEl) => {
      inputEl.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const dataUrl = await readFileAsDataUrl(file);
        state.visitDraft[inputEl.dataset.photoInput + "PhotoDataUrl"] = dataUrl;
        render();
      });
    });
  }

  bindFieldEvents(body, state.visitDraft, () => {});

  backBtn.addEventListener("click", () => show("formBrow"));

  saveBtn.addEventListener("click", async () => {
    body.querySelectorAll(".field-error").forEach((el) => el.classList.remove("field-error"));
    const beforeEl = !state.visitDraft.beforePhotoDataUrl ? body.querySelector('.photo-slot[data-photo-key="before"]') : null;
    const afterEl = !state.visitDraft.afterPhotoDataUrl ? body.querySelector('.photo-slot[data-photo-key="after"]') : null;
    if (beforeEl) beforeEl.classList.add("field-error");
    if (afterEl) afterEl.classList.add("field-error");
    if (beforeEl || afterEl) {
      (beforeEl || afterEl).scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    saveBtn.disabled = true;

    const draft = state.visitDraft;

    // ลูกค้าถูกสร้างเข้าฐานข้อมูลตั้งแต่ก่อนเข้าฟอร์มแล้ว (หน้า newCustomer / customerProfile)
    if (!state.currentCustomer) { saveBtn.disabled = false; show("home"); return; }

    // folder ใน Drive ตั้งชื่อด้วยเบอร์โทรของลูกค้าปัจจุบัน
    const folderMeta = {
      customerPhone: state.currentCustomer.phoneNormalized,
      customerName: state.currentCustomer.name,
      serviceType: state.serviceType,
      visitKey: ensureVisitSessionKey(draft)
    };

    const hasSignature = Boolean(draft.signatureCustomerDataUrl);

    const folderRes = await ensureVisitFolder(folderMeta);

    const uploadMeta = { folderId: folderRes.folderId };
    const [beforeUp, afterUp, sigUp] = await Promise.all([
      uploadImage(draft.beforePhotoDataUrl, { ...uploadMeta, filename: "before.jpg" }),
      uploadImage(draft.afterPhotoDataUrl, { ...uploadMeta, filename: "after.jpg" }),
      hasSignature
        ? uploadImage(draft.signatureCustomerDataUrl, { ...uploadMeta, filename: "signature_customer.png" })
        : Promise.resolve(null)
    ]);

    const serviceDateTime = state.visitDraft.serviceDate && state.visitDraft.serviceTime
      ? new Date(`${state.visitDraft.serviceDate}T${state.visitDraft.serviceTime}`).getTime()
      : Date.now();

    const payload = {
      customerId: state.currentCustomer.customerId,
      serviceType: state.serviceType,
      visitDate: serviceDateTime,
      technique: state.visitDraft.technique || null,
      colorUsed: state.visitDraft.colorUsed || null,
      intensity: state.visitDraft.intensity || null,
      muscle: state.visitDraft.muscle || null,
      shapeDesign: state.visitDraft.shapeDesign || null,
      browGuard: state.visitDraft.browGuard || null,
      analysis: state.visitDraft.analysis || null,
      note: state.visitDraft.adjustFromLast || state.visitDraft.dontWant || null,
      beforePhotoUrl: beforeUp.url,
      afterPhotoUrl: afterUp.url,
      signatureCustomerUrl: hasSignature ? sigUp.url : null,
      signatureTechUrl: "(ชนิสตา ศุภสุข) — ลายเซ็นคงที่",
      rawAnswers: { ...state.visitDraft, beforePhotoDataUrl: undefined, afterPhotoDataUrl: undefined }
    };

    const res = await saveVisit(payload);
    saveBtn.disabled = false;
    state.lastSavedServiceId = res.serviceId;
    show("confirmation");
  });

  onEnter("techFields", render);
}

function initConfirmation() {
  const summaryEl = document.getElementById("confirmSummary");

  const backHomeBtn = document.getElementById("backHomeBtn");

  exportBtn.addEventListener("click", async () => {
    exportBtn.disabled = true;

    const res = await exportConsentPdf(state.lastSavedServiceId);
    exportBtn.disabled = false;
    exportBtn.textContent = "Export Consent Form (PDF) — mock";
    alert(res.note);
  });

  backHomeBtn.addEventListener("click", () => {
    state.reset();
    show("home");
  });

    const c = state.currentCustomer;
    summaryEl.textContent = `Saved ${state.serviceType} visit for ${c ? c.name : ""} (ID ${state.lastSavedServiceId})`;
  });
}

// index.html?debugScreen=customerProfile&debugCustomer=C0001&debugServiceType=สักคิ้ว
// ห่อด้วย async IIFE แทน top-level await เพราะไฟล์นี้จะถูกรวมเป็น <script> ธรรมดา
// (ไม่ใช่ type=module) ตอนแปลงเป็น Apps Script — top-level await ใช้ไม่ได้ในสคริปต์ปกติ
(async () => {
  const params = new URLSearchParams(location.search);
  const debugScreen = params.get("debugScreen");
  const debugCustomerId = params.get("debugCustomer");
  const debugServiceType = params.get("debugServiceType");

  if (debugCustomerId) {
    state.currentCustomer = await getCustomer(debugCustomerId);
  }
  if (debugServiceType) {
    state.serviceType = debugServiceType;
  }
  show(debugScreen || "home", { pushHistory: false });

  // debug เจาะจงหน้า / หรือเคย Sign In ไว้แล้ว → ข้าม login; ไม่เช่นนั้นโชว์ login
  if (debugScreen || isLoggedIn()) {
    hideLogin();
  } else {
    showLogin();
  }
})();
