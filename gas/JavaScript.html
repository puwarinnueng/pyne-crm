// ==== js/utils.js ====
function formatDate(ts) {
  if (!ts) return "-";
  const d = new Date(ts);
  const months = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  const buddhistYear = d.getFullYear() + 543;
  return `${d.getDate()} ${months[d.getMonth()]} ${buddhistYear}`;
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ==== js/router.js ====
// router.js — สลับหน้าจอแบบง่าย (ไม่ใช้ URL hash เพื่อให้เหมือนพฤติกรรม Apps Script HtmlService SPA)

const enterHandlers = {};
let historyStack = ["gate"];

function onEnter(screenId, handler) {
  enterHandlers[screenId] = handler;
}

function show(screenId, opts = {}) {
  document.querySelectorAll(".screen").forEach((el) => el.classList.remove("active"));
  const target = document.getElementById("screen-" + screenId);
  if (!target) {
    console.error("Unknown screen:", screenId);
    return;
  }
  target.classList.add("active");

  if (opts.pushHistory !== false) {
    if (historyStack[historyStack.length - 1] !== screenId) {
      historyStack.push(screenId);
    }
  }

  if (enterHandlers[screenId]) {
    enterHandlers[screenId](opts.data);
  }
  window.scrollTo(0, 0);
}

function goBack(fallback = "home") {
  historyStack.pop(); // ทิ้งหน้าปัจจุบัน
  const prev = historyStack.pop() || fallback;
  show(prev);
}

// ผูกปุ่มที่มี data-back="screenId" ให้กลับไปหน้านั้นแบบตรง ๆ (ไม่พึ่ง history stack)
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-back]");
  if (btn) {
    show(btn.getAttribute("data-back"));
  }
});

// ==== js/signaturePad.js ====
// signaturePad.js — canvas เซ็นชื่อแบบง่าย รองรับ touch/pen บน iPad Safari

function createSignaturePad(canvas) {
  const ctx = canvas.getContext("2d");
  let drawing = false;
  let hasInk = false;
  let last = null;

  function resize() {
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.4;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#0b3d2e";
  }
  resize();
  window.addEventListener("resize", resize);

  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    const point = e.touches ? e.touches[0] : e;
    return { x: point.clientX - rect.left, y: point.clientY - rect.top };
  }

  function start(e) {
    e.preventDefault();
    drawing = true;
    last = pos(e);
  }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
    hasInk = true;
  }
  function end() { drawing = false; }

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  canvas.addEventListener("touchend", end);

  return {
    clear() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hasInk = false;
    },
    isEmpty() { return !hasInk; },
    toDataURL() { return canvas.toDataURL("image/png"); }
  };
}

// ==== js/fieldHelpers.js ====
// fieldHelpers.js — ตัวช่วยสร้าง HTML ฟิลด์ฟอร์มแบบใช้ซ้ำได้ (chip / radio / text)
// ใช้ร่วมกันระหว่าง formBrow.js และ techFields.js


function radioField(key, options, draft) {
  return `
    <div class="radio-row" data-radio-key="${key}">
      ${options.map((opt) => `
        <label>
          <input type="radio" name="${key}" value="${opt}" ${draft[key] === opt ? "checked" : ""}>
          <span>${opt}</span>
        </label>
      `).join("")}
    </div>`;
}

function chipGroup(key, options, draft, multi) {
  const selected = multi ? (draft[key] || []) : [draft[key]].filter(Boolean);
  return `
    <div class="choice-grid" data-chip-key="${key}" data-chip-multi="${multi ? "1" : "0"}">
      ${options.map((opt) => `
        <div class="chip ${selected.includes(opt) ? "selected" : ""}" data-chip-value="${escapeHtml(opt)}">${escapeHtml(opt)}</div>
      `).join("")}
    </div>`;
}

function textField(key, placeholder, draft) {
  return `<input type="text" class="input" data-text-key="${key}" placeholder="${placeholder || ""}" value="${escapeHtml(draft[key] || "")}">`;
}

function textAreaField(key, placeholder, draft) {
  return `<textarea class="input textarea" data-text-key="${key}" placeholder="${placeholder || ""}">${escapeHtml(draft[key] || "")}</textarea>`;
}

// ผูก event delegation ให้ container ที่มี chip/radio/text field จาก helper ข้างบน
// เรียกครั้งเดียวตอน init แล้ว renderStep() ใหม่ได้เรื่อย ๆ โดยไม่ต้องผูกซ้ำ
function bindFieldEvents(container, draft, onChange) {
  container.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    const group = chip.closest("[data-chip-key]");
    const key = group.dataset.chipKey;
    const multi = group.dataset.chipMulti === "1";
    const value = chip.dataset.chipValue;
    if (multi) {
      const arr = draft[key] || [];
      const idx = arr.indexOf(value);
      if (idx >= 0) arr.splice(idx, 1); else arr.push(value);
      draft[key] = arr;
      // สลับ class โดยตรงแทนการ re-render ทั้ง container เพื่อไม่ให้ state ของฟิลด์อื่นในหน้าเดียวกัน
      // (เช่น signature canvas ใน techFields.js) หายไปตอนคลิก chip
      chip.classList.toggle("selected");
    } else {
      const wasSelected = draft[key] === value;
      draft[key] = wasSelected ? null : value;
      group.querySelectorAll(".chip").forEach((c) => c.classList.remove("selected"));
      if (!wasSelected) chip.classList.add("selected");
    }
    onChange();
  });

  container.addEventListener("change", (e) => {
    const radioGroupEl = e.target.closest("[data-radio-key]");
    if (radioGroupEl && e.target.name) {
      draft[e.target.name] = e.target.value;
      onChange(e.target.name);
    }
  });

  container.addEventListener("input", (e) => {
    if (e.target.dataset.textKey) {
      draft[e.target.dataset.textKey] = e.target.value;
    }
  });
}

// ==== Server API bridge (แทนที่ js/mockApi.js) ====
// ห่อ google.script.run ให้เรียกแบบ Promise เหมือน mockApi.js เดิม ชื่อฟังก์ชันตรงกันทุกตัว
function callServer_(name, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler((err) => reject(err))
      [name](...args);
  });
}
function checkPasscode(pin) { return callServer_("checkPasscode", pin); }
function searchCustomers(query) { return callServer_("searchCustomers", query); }
function createCustomer(data) { return callServer_("createCustomer", data); }
function getCustomer(customerId) { return callServer_("getCustomer", customerId); }
function getHistoryByCustomer(customerId) { return callServer_("getHistoryByCustomer", customerId); }
function saveVisit(payload) { return callServer_("saveVisit", payload); }
function uploadImage(dataUrl, meta) { return callServer_("uploadImage", dataUrl, meta); }
function exportConsentPdf(serviceId) { return callServer_("exportConsentPdf", serviceId); }

// ==== js/screens/gate.js ====
function initGate() {
  const input = document.getElementById("passcodeInput");
  const errorEl = document.getElementById("gateError");
  const submitBtn = document.getElementById("gateSubmit");

  async function trySubmit() {
    errorEl.hidden = true;
    submitBtn.disabled = true;
    const res = await checkPasscode(input.value.trim());
    submitBtn.disabled = false;
    if (res.success) {
      input.value = "";
      show("home");
    } else {
      errorEl.hidden = false;
    }
  }

  submitBtn.addEventListener("click", trySubmit);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") trySubmit();
  });

  onEnter("gate", () => {
    input.value = "";
    errorEl.hidden = true;
    input.focus();
  });
}

        <div>›</div>

    resultsEl.querySelectorAll(".result-item").forEach((el) => {
      el.addEventListener("click", () => {
        const customer = results.find((c) => c.customerId === el.dataset.id);
        state.currentCustomer = customer;
        show("customerProfile");
      });
    });
  }

  btn.addEventListener("click", runSearch);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });
  newCustomerBtn.addEventListener("click", () => show("newCustomer"));
  logoutBtn.addEventListener("click", () => show("gate"));

    input.value = "";

    input.focus();
  });
}

function initNewCustomer() {
  const nameEl = document.getElementById("ncName");
  const phoneEl = document.getElementById("ncPhone");
  const lineEl = document.getElementById("ncLine");
  const noteEl = document.getElementById("ncNote");
  const warningEl = document.getElementById("ncPhoneWarning");
  const saveBtn = document.getElementById("ncSaveBtn");

  async function trySave() {
    warningEl.hidden = true;
    warningEl.innerHTML = "";

    if (!nameEl.value.trim() || !phoneEl.value.trim()) {
      warningEl.hidden = false;
      warningEl.textContent = "กรุณากรอกชื่อและเบอร์โทร";
      return;
    }

    saveBtn.disabled = true;
    const res = await createCustomer({
      name: nameEl.value.trim(),
      phone: phoneEl.value.trim(),
      line: lineEl.value.trim(),
      note: noteEl.value.trim()
    });
    saveBtn.disabled = false;

    if (!res.success && res.error === "duplicate") {
      warningEl.hidden = false;
      warningEl.innerHTML = `
        <div class="dup-warning">
          ⚠ เบอร์นี้มีอยู่ในระบบแล้ว: <b>${escapeHtml(res.existing.name)}</b> (${escapeHtml(res.existing.phoneDisplay)})<br>
          กรุณาเลือกลูกค้าเดิมแทนการสร้างใหม่
          <br><button class="btn btn-primary" id="ncGoExisting" style="margin-top:8px">ไปที่ลูกค้าคนนี้</button>
        </div>`;
      document.getElementById("ncGoExisting").addEventListener("click", () => {
        state.currentCustomer = res.existing;
        show("customerProfile");
      });
      return;
    }

    state.currentCustomer = res.customer;
    show("customerProfile");
  }

  saveBtn.addEventListener("click", trySave);

  onEnter("newCustomer", () => {
    nameEl.value = "";
    phoneEl.value = "";
    lineEl.value = "";
    noteEl.value = "";
    warningEl.hidden = true;
  });
}

function initFormBrow() {
  const container = document.getElementById("browStepContainer");
  const stepTitle = document.getElementById("browStepTitle");
  const stepIndicator = document.getElementById("browStepIndicator");
  const nextBtn = document.getElementById("browNextBtn");
  const backBtn = document.getElementById("browBackBtn");

  function renderStep() {
    const step = STEPS[state.browStepIndex];
    stepTitle.textContent = step.title;
    stepIndicator.textContent = `${state.browStepIndex + 1}/${STEPS.length}`;
    container.innerHTML = step.render(state.visitDraft);
    nextBtn.textContent = state.browStepIndex === STEPS.length - 1 ? "ถัดไป: เงื่อนไข + เซ็นยินยอม" : "ถัดไป";
  }

  bindFieldEvents(container, state.visitDraft, (changedRadioName) => {
    // chip เปลี่ยน selected class เองแล้วใน bindFieldEvents — ที่นี่ต้อง re-render แค่ตอน
    // "hadBrowBefore" เปลี่ยน เพื่อโชว์/ซ่อนช่อง "ลักษณะรอยเก่า" แบบมีเงื่อนไข
    if (changedRadioName === "hadBrowBefore") {
      renderStep();
    }
  });

  nextBtn.addEventListener("click", () => {
    const step = STEPS[state.browStepIndex];
    if (step.valid && !step.valid(state.visitDraft)) {
      alert("กรุณากรอกข้อมูลที่มี * ให้ครบก่อนไปต่อ");
      return;
    }
    if (state.browStepIndex < STEPS.length - 1) {
      state.browStepIndex += 1;
      renderStep();
    } else {
      show("consentSign");
    }
  });

  backBtn.addEventListener("click", () => {
    if (state.browStepIndex > 0) {
      state.browStepIndex -= 1;
      renderStep();
    } else {
      show("serviceType");
    }
  });

  onEnter("formBrow", () => {
    state.browStepIndex = 0;
    renderStep();
  });
}

function initConsentSign() {
  const body = document.getElementById("consentBody");
  const nextBtn = document.getElementById("consentNextBtn");
  const backBtn = document.getElementById("consentBackBtn");
  let pad = null;

  function updateNextState() {
    const agreed = body.querySelector("#agreeCheckbox")?.checked;
    const hasIntensity = !!state.visitDraft.intensity;
    const hasSignature = pad && !pad.isEmpty();
    nextBtn.disabled = !(agreed && hasIntensity && hasSignature);
  }

  function render() {
    body.innerHTML = `
      ${CONSENT_BLOCKS.map((block) => `
        <div class="consent-block">
          <div class="src">${escapeHtml(block.title)}</div>
          ${escapeHtml(block.body).replace(/\n/g, "<br>")}
        </div>
      `).join("")}

      <div class="step-group-title">ลูกค้าเลือกระดับความเข้มที่ต้องการ *</div>
      <div id="intensityOptions">
        ${INTENSITY_OPTIONS.map((opt) => `
          <div class="intensity-option ${state.visitDraft.intensity === opt.value ? "selected" : ""}" data-intensity="${escapeHtml(opt.value)}">
            <b>${escapeHtml(opt.label)}</b><br>${escapeHtml(opt.text)}
          </div>
        `).join("")}
      </div>

      <label class="agree-row">
        <input type="checkbox" id="agreeCheckbox">
        <span>${escapeHtml(AGREEMENT_TEXT)}</span>
      </label>

      <div class="step-group-title">ลายเซ็นลูกค้า *</div>
      <div class="sig-wrap">
        <canvas id="sigCanvas"></canvas>
      </div>
      <div class="sig-actions"><button id="sigClearBtn" type="button">ล้างลายเซ็น</button></div>
    `;

    pad = createSignaturePad(document.getElementById("sigCanvas"));

    body.querySelectorAll("[data-intensity]").forEach((el) => {
      el.addEventListener("click", () => {
        state.visitDraft.intensity = el.dataset.intensity;
        body.querySelectorAll("[data-intensity]").forEach((x) => x.classList.remove("selected"));
        el.classList.add("selected");
        updateNextState();
      });
    });

    document.getElementById("agreeCheckbox").addEventListener("change", updateNextState);
    document.getElementById("sigCanvas").addEventListener("pointerup", updateNextState);
    document.getElementById("sigCanvas").addEventListener("touchend", updateNextState);
    document.getElementById("sigCanvas").addEventListener("mouseup", updateNextState);
    document.getElementById("sigClearBtn").addEventListener("click", () => { pad.clear(); updateNextState(); });

    updateNextState();
  }

  nextBtn.addEventListener("click", async () => {
    if (!pad || pad.isEmpty()) return;
    nextBtn.disabled = true;
    const uploaded = await uploadImage(pad.toDataURL(), {
      customerId: state.currentCustomer.customerId,
      customerName: state.currentCustomer.name,
      serviceType: state.serviceType,
      filename: "signature_customer.png"
    });
    state.visitDraft.signatureCustomerUrl = uploaded.url;
    state.visitDraft.agreedAt = Date.now();
    show("techFields");
  });

  backBtn.addEventListener("click", () => {
    show(state.serviceType === "เติมสี" ? "formTouchup" : "formBrow");
  });

  onEnter("consentSign", render);
}

function initTechFields() {
  const body = document.getElementById("techBody");
  const saveBtn = document.getElementById("techSaveBtn");
  let techPad = null;

  function photoSlot(key, label) {
    const url = state.visitDraft[key + "PhotoDataUrl"];
    return `
      <div class="photo-slot" data-photo-key="${key}">
        ${url ? `<img src="${url}">` : `
          <label>
            <span style="font-size:22px">📷</span>
            <span>${label}</span>
            <input type="file" accept="image/*" capture="environment" data-photo-input="${key}">
          </label>`}
      </div>`;
  }

  function render() {
    const isTouchup = state.serviceType === "เติมสี";
    body.innerHTML = `
      <div class="step-group">
        <div class="step-group-title">รูป Before / After *</div>
        <div class="photo-row">
          ${photoSlot("before", "Before")}
          ${photoSlot("after", "After")}
        </div>
      </div>

      ${!isTouchup ? `
      <div class="step-group">
        <div class="step-group-title">กล้ามเนื้อคิ้ว</div>
        ${chipGroup("muscle", OPTIONS.muscle, state.visitDraft, true)}
        <div class="step-group-title">ทรงที่ออกแบบ</div>
        ${chipGroup("shapeDesign", OPTIONS.shapeDesign, state.visitDraft, true)}
        <div class="step-group-title">การกันคิ้ว</div>
        ${radioField("browGuard", OPTIONS.browGuard, state.visitDraft)}
      </div>` : ""}

      <div class="step-group">
        <div class="step-group-title">สีที่ใช้</div>
        ${chipGroup("colorUsed", OPTIONS.colorUsed, state.visitDraft, false)}
      </div>

      <div class="step-group">
        <div class="step-group-title">ผลการวิเคราะห์จากช่าง</div>
        ${textAreaField("analysis", "บันทึกผลการวิเคราะห์ / หมายเหตุ", state.visitDraft)}
      </div>

      <div class="step-group">
        <div class="step-group-title">ลายเซ็นช่างผู้ให้บริการ *</div>
        <div class="sig-wrap"><canvas id="techSigCanvas"></canvas></div>
        <div class="sig-actions"><button id="techSigClearBtn" type="button">ล้างลายเซ็น</button></div>
        <p class="muted small" style="text-align:center">(ชนิสตา ศุภสุข)</p>
      </div>
    `;

    techPad = createSignaturePad(document.getElementById("techSigCanvas"));
    document.getElementById("techSigClearBtn").addEventListener("click", () => techPad.clear());

    body.querySelectorAll("[data-photo-input]").forEach((inputEl) => {
      inputEl.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const dataUrl = await readFileAsDataUrl(file);
        state.visitDraft[inputEl.dataset.photoInput + "PhotoDataUrl"] = dataUrl;
        render();
      });
    });
  }

  bindFieldEvents(body, state.visitDraft, () => {});

  saveBtn.addEventListener("click", async () => {
    if (!state.visitDraft.beforePhotoDataUrl || !state.visitDraft.afterPhotoDataUrl) {
      alert("กรุณาถ่ายรูป Before และ After ให้ครบก่อนบันทึก");
      return;
    }
    if (!techPad || techPad.isEmpty()) {
      alert("กรุณาให้ช่างเซ็นชื่อก่อนบันทึก");
      return;
    }
    saveBtn.disabled = true;

    const photoMeta = {
      customerId: state.currentCustomer.customerId,
      customerName: state.currentCustomer.name,
      serviceType: state.serviceType
    };
    const [beforeUp, afterUp, techSigUp] = await Promise.all([
      uploadImage(state.visitDraft.beforePhotoDataUrl, { ...photoMeta, filename: "before.jpg" }),
      uploadImage(state.visitDraft.afterPhotoDataUrl, { ...photoMeta, filename: "after.jpg" }),
      uploadImage(techPad.toDataURL(), { ...photoMeta, filename: "signature_tech.png" })
    ]);

    const payload = {
      customerId: state.currentCustomer.customerId,
      serviceType: state.serviceType,
      technique: state.visitDraft.technique || null,
      colorUsed: state.visitDraft.colorUsed || null,
      intensity: state.visitDraft.intensity || null,
      muscle: state.visitDraft.muscle || null,
      shapeDesign: state.visitDraft.shapeDesign || null,
      browGuard: state.visitDraft.browGuard || null,
      analysis: state.visitDraft.analysis || null,
      note: state.visitDraft.adjustFromLast || state.visitDraft.dontWant || null,
      beforePhotoUrl: beforeUp.url,
      afterPhotoUrl: afterUp.url,
      signatureCustomerUrl: state.visitDraft.signatureCustomerUrl || null,
      signatureTechUrl: techSigUp.url,
      rawAnswers: { ...state.visitDraft, beforePhotoDataUrl: undefined, afterPhotoDataUrl: undefined }
    };

    const res = await saveVisit(payload);
    saveBtn.disabled = false;
    state.lastSavedServiceId = res.serviceId;
    show("confirmation");
  });

  onEnter("techFields", render);
}
