<script>
// ==== js/utils.js ====
function formatDate(ts) {
  if (!ts) return "-";
  const d = new Date(ts);
  const months = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  const buddhistYear = d.getFullYear() + 543;
  return `${d.getDate()} ${months[d.getMonth()]} ${buddhistYear}`;
}

// วันที่แบบสั้น YYYY-MM-DD ใช้ในตาราง Customers (ตรงตามสไตล์ตัวอย่างที่ร้านส่งมา)
function formatDateShort(ts) {
  if (!ts) return "-";
  const d = new Date(ts);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function isCompletedVisitStatus(status) {
  return ["เสร็จสิ้น", "completed"].includes(String(status || "").trim());
}

function isCompletedBrowVisit(visit) {
  return Boolean(
    visit &&
    visit.serviceType === "สักคิ้ว" &&
    isCompletedVisitStatus(visit.status) &&
    (visit.technique || visit.colorUsed || visit.beforePhotoUrl || visit.afterPhotoUrl)
  );
}

// unique key ต่อ visit หนึ่งครั้ง ใช้กันชื่อ Drive folder ชนกันเมื่อลูกค้าคนเดียวกันมีหลาย visit วันเดียวกัน
// สร้างครั้งแรกที่เรียกแล้ว cache ไว้ใน draft — เรียกซ้ำได้ค่าเดิมตลอดวงจรชีวิตของ visit นั้น
function ensureVisitSessionKey(draft) {
  if (!draft.visitSessionKey) {
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    draft.visitSessionKey = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  }
  return draft.visitSessionKey;
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
</script>

<script>
// ==== js/state.js ====
// state.js — เก็บ state ระหว่างหน้าจอ (ฝั่ง client เท่านั้น, ไม่ persist)
// เทียบเท่ากับตัวแปรที่ส่งผ่านกันระหว่างหน้าใน Apps Script HtmlService

const state = {
  currentCustomer: null,      // customer object ที่กำลังเปิดดู/เพิ่มประวัติ
  serviceType: null,          // "สักคิ้ว" | "เติมสี" (หมวดกว้าง ใช้แสดงผลจุดเดิมที่มีอยู่)
  formType: null,             // "form1" | "form2" | "form3" (ใช้เลือก/บันทึกฟอร์มที่ตรงจริง)
  visitContext: null,         // { visitId, zervaBookingId, visitDate, timeSlot } — สร้างจาก Step 3 ก่อนเปิดฟอร์มเสมอ
  visitDraft: {},             // คำตอบฟอร์มที่กำลังกรอก สะสมไปเรื่อย ๆ จนกว่าจะบันทึกจริง
  browStepIndex: 0,
  lastSavedServiceId: null,

  // สำคัญ: ล้างค่าใน object เดิม (ไม่สร้าง object ใหม่) เพราะ bindFieldEvents()
  // เก็บ reference ของ state.visitDraft ไว้ตอน init หน้าจอ ถ้า reassign ใหม่
  // event handler เก่าจะยังชี้ไป object เก่า ทำให้ข้อมูลไม่ sync
  resetVisitDraft() {
    Object.keys(this.visitDraft).forEach((k) => delete this.visitDraft[k]);
  },

  reset() {
    this.currentCustomer = null;
    this.serviceType = null;
    this.formType = null;
    this.visitContext = null;
    this.resetVisitDraft();
    this.browStepIndex = 0;
  }
};
</script>
<script>
// ==== js/router.js ====
// router.js — สลับหน้าจอแบบง่าย (ไม่ใช้ URL hash เพื่อให้เหมือนพฤติกรรม Apps Script HtmlService SPA)

const enterHandlers = {};
let historyStack = ["home"];

function onEnter(screenId, handler) {
  enterHandlers[screenId] = handler;
}

function show(screenId, opts = {}) {
  document.querySelectorAll(".screen").forEach((el) => el.classList.remove("active"));
  const target = document.getElementById("screen-" + screenId);
  if (!target) {
    console.error("Unknown screen:", screenId);
    return;
  }
  target.classList.add("active");

  if (opts.pushHistory !== false) {
    if (historyStack[historyStack.length - 1] !== screenId) {
      historyStack.push(screenId);
    }
  }

  if (enterHandlers[screenId]) {
    enterHandlers[screenId](opts.data);
  }
  window.scrollTo(0, 0);
}

function goBack(fallback = "home") {
  historyStack.pop(); // ทิ้งหน้าปัจจุบัน
  const prev = historyStack.pop() || fallback;
  show(prev);
}

// ผูกปุ่มที่มี data-back="screenId" ให้กลับไปหน้านั้นแบบตรง ๆ (ไม่พึ่ง history stack)
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-back]");
  if (btn) {
    show(btn.getAttribute("data-back"));
  }
});
</script>
<script>
// ==== js/session.js ====
// session.js — จัดการ session token ฝั่ง client เก็บใน localStorage เพื่อให้ทั้ง dev (mockApi.js)
// และ production (gas/JavaScript.html bridge) ส่ง token เดิมแนบไปกับทุก request ฝั่งเซิร์ฟเวอร์ได้
//
// เดิมตั้งใจเก็บใน document.cookie แต่ทดสอบจริงบน production (Apps Script IFRAME sandbox — เนื้อหาแอป
// รันอยู่ใน iframe ที่ฝังซ้อนบน googleusercontent.com) พบว่า document.cookie เขียนไม่ติดเลยแบบเงียบๆ
// (เขียนแล้วอ่านกลับมาว่างทันที) เพราะโดน sandbox/third-party cookie policy ของเบราว์เซอร์บล็อก
// ส่วน localStorage ทดสอบแล้วใช้ได้จริงและอยู่ข้ามการ refresh หน้าได้ปกติใน context เดียวกันนี้
// จึงย้ายมาใช้ localStorage แทน — ยังเป็น client-side storage ที่ต้องผ่านการตรวจสอบจริงฝั่งเซิร์ฟเวอร์
// ทุกครั้งเหมือนเดิม (checkSession()/logout()/changePassword() ใน gas/Code.gs) ไม่ได้ลดความปลอดภัยลง
const TOKEN_KEY = "pyneCrmToken";

function getToken() {
  try {
    return localStorage.getItem(TOKEN_KEY) || "";
  } catch (e) {
    return "";
  }
}

function setToken(token) {
  try {
    localStorage.setItem(TOKEN_KEY, token);
  } catch (e) {
    // localStorage ไม่พร้อมใช้งาน (เช่น โหมดส่วนตัวบางเบราว์เซอร์) — ปล่อยผ่าน session จะแค่ไม่รอดข้าม refresh
  }
}

function clearToken() {
  try {
    localStorage.removeItem(TOKEN_KEY);
  } catch (e) {
    // เพิกเฉย
  }
}

// เรียกตอนพบว่า session ไม่ valid แล้วระหว่างใช้งาน (เช่น login เครื่องอื่นทับ หรือมีคนเปลี่ยนรหัสผ่าน)
// ล้าง token แล้วยิง event ให้ login.js ไปโชว์หน้า login ต่อ — แยกกันด้วย event กันไม่ให้ import วนกัน
function sessionExpired() {
  clearToken();
  window.dispatchEvent(new CustomEvent("pyne:session-expired"));
}
</script>
<script>
// ==== js/shell.js ====
function initShell() {
  const hamburgerBtn = document.getElementById("hamburgerBtn");
  const dropdown = document.getElementById("mobileDropdown");
  const overlay = document.getElementById("mobileMenuOverlay");
  const closeBtn = document.getElementById("mobileMenuClose");
  let closeTimer;

  function closeDropdown() {
    dropdown.classList.remove("is-open");
    overlay.classList.remove("is-visible");
    hamburgerBtn.setAttribute("aria-expanded", "false");
    clearTimeout(closeTimer);
    closeTimer = window.setTimeout(() => {
      dropdown.hidden = true;
      overlay.hidden = true;
    }, 220);
  }

  function openDropdown() {
    clearTimeout(closeTimer);
    dropdown.hidden = false;
    overlay.hidden = false;
    requestAnimationFrame(() => {
      dropdown.classList.add("is-open");
      overlay.classList.add("is-visible");
    });
    hamburgerBtn.setAttribute("aria-expanded", "true");
  }

  hamburgerBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (dropdown.hidden) openDropdown();
    else closeDropdown();
  });

  closeBtn.addEventListener("click", closeDropdown);
  overlay.addEventListener("click", closeDropdown);

  document.addEventListener("click", (e) => {
    if (!dropdown.hidden && !dropdown.contains(e.target) && e.target !== hamburgerBtn) {
      closeDropdown();
    }
  });

  dropdown.querySelectorAll(".mobile-dropdown-item").forEach((item) => {
    item.addEventListener("click", closeDropdown);
  });

  // ปุ่มโปรไฟล์ในเมนูมือถือ (Reset password / Log out)
  dropdown.querySelectorAll("[data-account-action]").forEach((item) => {
    item.addEventListener("click", () => {
      const action = item.dataset.accountAction;
      closeDropdown();
      if (action === "reset") {
        openReset();
      } else if (action === "logout") {
        logoutUser().finally(() => {
          show("home");
          showLogin();
        });
      }
    });
  });

  // ลิงก์เมนู (sidebar เดสก์ท็อป + dropdown มือถือ) ที่มี data-nav ให้พาไปหน้านั้นจริง ๆ
  document.querySelectorAll("[data-nav]").forEach((link) => {
    link.addEventListener("click", (e) => {
      e.preventDefault();
      show(link.dataset.nav);
    });
  });

  initUserMenu();
}

// เมนูผู้ใช้ที่ footer ของ sidebar: Reset password / Log out
function initUserMenu() {
  const menu = document.getElementById("userMenu");
  const trigger = document.getElementById("userMenuTrigger");
  const popover = document.getElementById("userMenuPopover");
  if (!menu || !trigger || !popover) return;

  function closeMenu() {
    menu.classList.remove("is-open");
    popover.hidden = true;
    trigger.setAttribute("aria-expanded", "false");
  }

  function openMenu() {
    menu.classList.add("is-open");
    popover.hidden = false;
    trigger.setAttribute("aria-expanded", "true");
  }

  trigger.addEventListener("click", (e) => {
    e.stopPropagation();
    if (popover.hidden) openMenu();
    else closeMenu();
  });

  document.addEventListener("click", (e) => {
    if (!popover.hidden && !menu.contains(e.target)) closeMenu();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeMenu();
  });

  popover.querySelectorAll(".user-menu-item").forEach((item) => {
    item.addEventListener("click", () => {
      const action = item.dataset.action;
      closeMenu();
      if (action === "reset") {
        openReset();
      } else if (action === "logout") {
        logoutUser().finally(() => {
          show("home");
          showLogin();
        });
      }
    });
  });
}
</script>
<script>
// ==== js/signaturePad.js ====
// signaturePad.js — canvas เซ็นชื่อแบบง่าย รองรับ touch/pen บน iPad Safari

function createSignaturePad(canvas) {
  const ctx = canvas.getContext("2d");
  let drawing = false;
  let hasInk = false;
  let last = null;

  function resize() {
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const newWidth = Math.round(rect.width * ratio);
    const newHeight = Math.round(rect.height * ratio);
    // ตั้ง canvas.width/height ล้างรูปที่วาดไว้เสมอ (พฤติกรรมมาตรฐานของ canvas) — ถ้าขนาดจริงไม่ได้เปลี่ยน
    // (เช่น resize event หลอกจากแถบเครื่องมือ Safari บน iOS ที่ย่อ/ขยายตอนเลื่อนหน้าจอ) ให้ข้ามไปเลย
    // กันลายเซ็นลูกค้าหายเงียบ ๆ ทั้งที่ hasInk ยังเป็น true อยู่ (isEmpty() จะโกหกว่ามีลายเซ็น)
    if (newWidth === canvas.width && newHeight === canvas.height) return;
    const snapshot = hasInk ? canvas.toDataURL("image/png") : null;
    canvas.width = newWidth;
    canvas.height = newHeight;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.4;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#261F1C"; /* Espresso Ink — token: --espresso-ink */
    if (snapshot) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
      img.src = snapshot;
    }
  }
  resize();
  window.addEventListener("resize", resize);

  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    const point = e.touches ? e.touches[0] : e;
    return { x: point.clientX - rect.left, y: point.clientY - rect.top };
  }

  function start(e) {
    e.preventDefault();
    drawing = true;
    last = pos(e);
  }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
    hasInk = true;
  }
  function end() { drawing = false; }

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  canvas.addEventListener("touchend", end);

  return {
    clear() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hasInk = false;
    },
    isEmpty() { return !hasInk; },
    toDataURL() { return canvas.toDataURL("image/png"); }
  };
}
</script>
<script>
// ==== js/fieldHelpers.js ====
// fieldHelpers.js — ตัวช่วยสร้าง HTML ฟิลด์ฟอร์มแบบใช้ซ้ำได้ (chip / radio / text)
// ใช้ร่วมกันระหว่าง formBrow.js และ techFields.js


function radioField(key, options, draft) {
  return `
    <div class="radio-row" data-radio-key="${key}">
      ${options.map((opt) => `
        <label class="native-choice">
          <input type="radio" name="${key}" value="${escapeHtml(opt)}" ${draft[key] === opt ? "checked" : ""}>
          <span>${escapeHtml(opt)}</span>
        </label>
      `).join("")}
    </div>`;
}

// option ที่ชื่อ "Other" จะมีช่องกรอกข้อความต่อท้ายทันที (โชว์เฉพาะตอนติ๊กเลือก) — ค่าที่พิมพ์เก็บแยกไว้ที่ draft[`${key}Other`]
function chipGroup(key, options, draft, multi) {
  const selected = multi ? (draft[key] || []) : [draft[key]].filter(Boolean);
  const otherKey = `${key}Other`;
  const inputType = multi ? "checkbox" : "radio";
  return `
    <div class="choice-grid" data-chip-key="${key}" data-chip-multi="${multi ? "1" : "0"}">
      ${options.map((opt) => {
        const isOther = opt === "Other";
        const checked = selected.includes(opt);
        return `
          <label class="native-choice">
            <input type="${inputType}" ${multi ? "" : `name="${key}"`} data-chip-value="${escapeHtml(opt)}" ${checked ? "checked" : ""}>
            <span>${isOther ? "อื่นๆ" : escapeHtml(opt)}</span>
          </label>
          ${isOther ? `<input type="text" class="input other-input" data-other-key="${otherKey}" placeholder="ระบุ..." value="${escapeHtml(draft[otherKey] || "")}" ${checked ? "" : "hidden"}>` : ""}
        `;
      }).join("")}
    </div>`;
}

// placeholder ปิดไว้ตามคำสั่งผู้ใช้ — พารามิเตอร์ยังรับไว้เผื่อเปิดใช้อีกครั้งในอนาคต
function textField(key, placeholder, draft) {
  return `<input type="text" class="input" data-text-key="${key}" value="${escapeHtml(draft[key] || "")}"><!-- placeholder="${escapeHtml(placeholder || "")}" -->`;
}

function textAreaField(key, placeholder, draft) {
  return `<textarea class="input textarea" data-text-key="${key}">${escapeHtml(draft[key] || "")}</textarea><!-- placeholder="${escapeHtml(placeholder || "")}" -->`;
}

// ===== สัดส่วนสีที่ใช้ (mix ratio) — Form 3 เติมสีคิ้ว =====
// เก็บค่าไว้ที่ draft[key] = { [ชื่อสี]: จำนวนหยด, __other__: จำนวนหยด, Solution: จำนวนหยด }
// และ draft[`${key}OtherLabel`] = ป้ายชื่อสีที่กรอกเองในช่อง "อื่นๆ"
// รูปแบบต่างจาก text/chip/radio ทั่วไป (ตัวเลขต่อแถวสี ไม่ใช่ 1 ค่าเดียว) จึงมี bind event แยกของตัวเอง
function mixRatioField(key, colorNames, draft) {
  const parts = draft[key] || (draft[key] = {});
  const otherLabel = draft[`${key}OtherLabel`] || "";
  const row = (label, colorKey, value) => `
    <div class="mix-row">
      <span class="mix-label">${escapeHtml(label)}</span>
      <input type="number" min="0" inputmode="numeric" class="input mix-input" data-mix-key="${key}" data-mix-color="${escapeHtml(colorKey)}" value="${value === undefined || value === null || value === "" ? "" : escapeHtml(String(value))}" placeholder="0">
      <span class="mix-unit">หยด</span>
    </div>`;
  return `
    <div class="mix-ratio-grid" data-mix-group="${key}">
      ${colorNames.map((name) => row(name, name, parts[name])).join("")}
      <div class="mix-row">
        <input type="text" class="input mix-other-label" data-mix-other-label="${key}" placeholder="อื่นๆ ระบุ..." value="${escapeHtml(otherLabel)}">
        <input type="number" min="0" inputmode="numeric" class="input mix-input" data-mix-key="${key}" data-mix-color="__other__" value="${parts.__other__ === undefined || parts.__other__ === null || parts.__other__ === "" ? "" : escapeHtml(String(parts.__other__))}" placeholder="0">
        <span class="mix-unit">หยด</span>
      </div>
      ${row("Solution", "Solution", parts.Solution === undefined ? 1 : parts.Solution)}
    </div>`;
}

// รวมค่าที่กรอกใน mixRatioField เป็น string บันทึกผล เช่น "น้ำตาลส้ม 3 : น้ำตาลเข้ม 1 : Solution 1"
// คืนค่า "" ถ้ายังไม่ได้กรอกสีไหนเลย (ใช้เช็ก required ตอนบันทึกปิด Visit ได้)
function formatMixRatio(key, draft) {
  const parts = draft[key] || {};
  const otherLabel = (draft[`${key}OtherLabel`] || "").trim();
  const segs = [];
  Object.keys(parts).forEach((name) => {
    if (name === "Solution" || name === "__other__") return;
    const v = Number(parts[name]);
    if (v > 0) segs.push(`${name} ${v}`);
  });
  const otherV = Number(parts.__other__);
  if (otherV > 0 && otherLabel) segs.push(`${otherLabel} ${otherV}`);
  if (!segs.length) return "";
  const solutionV = parts.Solution === undefined || parts.Solution === "" ? 1 : Number(parts.Solution);
  segs.push(`Solution ${solutionV}`);
  return segs.join(" : ");
}

function bindMixRatioEvents(container, draft) {
  container.addEventListener("input", (e) => {
    const groupKey = e.target.dataset.mixKey;
    if (groupKey) {
      const colorKey = e.target.dataset.mixColor;
      const parts = draft[groupKey] || (draft[groupKey] = {});
      // สเปก: "ใช้ไม่เกิน 3 หลุมสี" — Solution ไม่นับเป็นหลุมสี นับเฉพาะสีจริง + อื่นๆ
      if (colorKey !== "Solution") {
        const wellsUsed = new Set(Object.keys(parts).filter((k) => k !== "Solution" && Number(parts[k]) > 0));
        if (Number(e.target.value) > 0) wellsUsed.add(colorKey); else wellsUsed.delete(colorKey);
        if (wellsUsed.size > 3) {
          e.target.value = "";
          alert("สัดส่วนสีที่ใช้ได้ไม่เกิน 3 หลุม");
          return;
        }
      }
      parts[colorKey] = e.target.value;
    }
    const otherLabelKey = e.target.dataset.mixOtherLabel;
    if (otherLabelKey) {
      draft[`${otherLabelKey}OtherLabel`] = e.target.value;
    }
  });
}

// ===== ข้อมูลความพร้อมก่อนรับบริการ — ใช้ร่วมกันทุกฟอร์ม (Form 1/2/3) =====
function readinessBlockHtml(draft) {
  return `
    <div class="form-section-title">ข้อมูลความพร้อมก่อนรับบริการ</div>
    <div class="step-group">
      <div class="step-group-title">ผิวบริเวณคิ้วมีแผลเป็นหรือไม่ <span class="required-star">*</span></div>
      ${radioField("hasScar", ["ไม่มี", "มี"], draft)}
      <div id="scarCauseBlock" ${draft.hasScar === "มี" ? "" : "hidden"}>
        ${chipGroup("scarCause", ["จากรอยเก่า", "Other"], draft, true)}
      </div>
    </div>
    <div class="step-group">
      <div class="step-group-title">ผิวบริเวณคิ้วมีความระคายเคืองภายใน 7 วันที่ผ่านมาหรือไม่ <span class="required-star">*</span></div>
      ${radioField("irritation7d", ["ไม่มี", "มี"], draft)}
      <div id="irritationDetailBlock" ${draft.irritation7d === "มี" ? "" : "hidden"}>
        ${textField("irritationDetail", "ระบุรายละเอียด", draft)}
      </div>
    </div>
    <div class="step-group">
      <div class="step-group-title">มีอาการแพ้หรือข้อมูลสำคัญที่ต้องแจ้งช่างหรือไม่ <span class="required-star">*</span></div>
      ${radioField("allergyInfo", ["ไม่มี", "มี"], draft)}
      <div id="allergyDetailBlock" ${draft.allergyInfo === "มี" ? "" : "hidden"}>
        ${textField("allergyDetail", "ระบุรายละเอียด", draft)}
      </div>
    </div>`;
}

// ผูกกับ callback ของ bindFieldEvents(container, draft, onChange) — เรียกจาก onChange(changedRadioName)
function bindReadinessToggle(container, draft, changedRadioName) {
  if (changedRadioName === "hasScar") {
    const el = container.querySelector("#scarCauseBlock");
    if (el) el.hidden = draft.hasScar !== "มี";
  }
  if (changedRadioName === "irritation7d") {
    const el = container.querySelector("#irritationDetailBlock");
    if (el) el.hidden = draft.irritation7d !== "มี";
  }
  if (changedRadioName === "allergyInfo") {
    const el = container.querySelector("#allergyDetailBlock");
    if (el) el.hidden = draft.allergyInfo !== "มี";
  }
}

// ผูก event delegation ให้ container ที่มี chip/radio/text field จาก helper ข้างบน
// เรียกครั้งเดียวตอน init แล้ว renderStep() ใหม่ได้เรื่อย ๆ โดยไม่ต้องผูกซ้ำ
function bindFieldEvents(container, draft, onChange) {
  container.addEventListener("change", (e) => {
    const chipGroupEl = e.target.closest("[data-chip-key]");
    if (chipGroupEl && e.target.dataset.chipValue !== undefined) {
      const key = chipGroupEl.dataset.chipKey;
      const multi = chipGroupEl.dataset.chipMulti === "1";
      const value = e.target.dataset.chipValue;
      if (multi) {
        const arr = draft[key] || (draft[key] = []);
        const idx = arr.indexOf(value);
        if (e.target.checked && idx < 0) arr.push(value);
        if (!e.target.checked && idx >= 0) arr.splice(idx, 1);
      } else {
        draft[key] = e.target.checked ? value : null;
      }
      const otherInput = chipGroupEl.querySelector("[data-other-key]");
      if (otherInput) {
        otherInput.hidden = multi ? !draft[key].includes("Other") : draft[key] !== "Other";
      }
      onChange();
      return;
    }

    const radioGroupEl = e.target.closest("[data-radio-key]");
    if (radioGroupEl && e.target.name) {
      draft[e.target.name] = e.target.value;
      onChange(e.target.name);
    }
  });

  container.addEventListener("input", (e) => {
    if (e.target.dataset.textKey) {
      draft[e.target.dataset.textKey] = e.target.value;
    }
    if (e.target.dataset.otherKey) {
      draft[e.target.dataset.otherKey] = e.target.value;
    }
  });
}
</script>
<script>
// ==== Server API bridge (แทนที่ js/mockApi.js) ====
// ห่อ google.script.run ให้เรียกแบบ Promise เหมือน mockApi.js เดิม ชื่อฟังก์ชันตรงกันทุกตัว
// normalizePhone เป็น utility ล้วน ๆ (ไม่ต้องยิงเซิร์ฟเวอร์) — คัดลอกมาจาก js/mockApi.js ตรงตัว
// เพราะฝั่ง client (gas/JavaScript.html) กับฝั่ง server (gas/*.gs) เป็นคนละ scope กันโดยสิ้นเชิงใน Apps Script
function normalizePhone(phone) {
  if (!phone) return "";
  let p = String(phone).replace(/[^\d+]/g, "");
  if (p.startsWith("+66")) p = "0" + p.slice(3);
  else if (p.startsWith("66") && p.length > 9) p = "0" + p.slice(2);
  return p;
}
function callServer_(name, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler((err) => reject(err))
      [name](...args);
  });
}
// ฟังก์ชันที่ต้อง login ก่อนถึงจะเรียกได้ (เซิร์ฟเวอร์เช็คด้วย requireSession_() ดู gas/Utils.gs) — แนบ
// session token (จาก cookie ผ่าน getToken() ใน js/session.js) เป็นอาร์กิวเมนต์แรกให้อัตโนมัติทุกครั้ง
// ถ้าเซิร์ฟเวอร์ตอบ UNAUTHORIZED (session ไม่ valid แล้ว เช่น login เครื่องอื่นทับ/ถูกเปลี่ยนรหัสผ่าน)
// จะเคลียร์ cookie แล้วเด้งกลับหน้า login ทันทีผ่าน sessionExpired()
function callServerAuthed_(name, ...args) {
  return callServer_(name, getToken(), ...args).catch((err) => {
    const message = (err && err.message) || String(err || "");
    if (message.indexOf("UNAUTHORIZED") >= 0) sessionExpired();
    throw err;
  });
}
function login(username, password) { return callServer_("login", username, password); }
function checkSession(token) { return callServer_("checkSession", token); }
function logout(token) { return callServer_("logout", token); }
function changePassword(oldPassword, newPassword) { return callServer_("changePassword", oldPassword, newPassword); }
function searchCustomers(query) { return callServerAuthed_("searchCustomers", query); }
function listRecentCustomers(limit) { return callServerAuthed_("listRecentCustomers", limit); }
function listCustomersWithStats() { return callServerAuthed_("listCustomersWithStats"); }
function debugCustomerSearch(query) { return callServerAuthed_("debugCustomerSearch", query); }
function findCustomerByPhone(phone) { return callServerAuthed_("findCustomerByPhone", phone); }

<script>
// ==== js/visitFlow.js ====
// visitFlow.js — ส่วนที่ใช้ร่วมกันทุกฟอร์ม Consultation (Form 1/2/3 + หน้าบันทึกหลังทำ)
// ตาม "กติกากลางของทั้ง 3 ฟอร์ม": แสดง Customer ID/Visit ID/Zerva Booking ID/ชื่อ/ชื่อเล่น/วันเวลานัด
// ที่ดึงจากขั้นตอนก่อนหน้า + ปุ่ม "ไม่ได้รับบริการ" ที่กดได้ทุกจุดของฟอร์ม





function visitHeaderHtml() {
  const c = state.currentCustomer;
  const v = state.visitContext;
  if (!c || !v) return "";
  return `
    <div class="box-quiet visit-header">
      <div><b>${escapeHtml(c.fullName || c.nickname || c.name || "")}</b> (${escapeHtml(c.nickname || "-")}) &nbsp;·&nbsp; ${escapeHtml(c.customerId)}</div>
      <div class="muted small">Visit ${escapeHtml(v.visitId)} &nbsp;·&nbsp; Zerva ${escapeHtml(v.zervaBookingId || "-")} &nbsp;·&nbsp; ${formatDate(v.visitDate)} ${escapeHtml(v.timeSlot || "")}</div>
    </div>`;
}

// ปุ่ม "บันทึกแบบร่าง" มุมขวาบน — กดได้ตลอดทุกจุดของฟอร์ม โดยไม่ต้องรอข้อมูลบังคับครบ
// เก็บ rawAnswers ดิบทั้งหมดไว้ก่อน ไม่ normalize เป็นฟิลด์ทีละอันเหมือนตอนปิด Visit จริง
function wireDraftSaveButton(buttonEl) {
  if (!buttonEl) return;
  buttonEl.addEventListener("click", async () => {
    const c = state.currentCustomer;
    const v = state.visitContext;
    if (!c || !v) return;
    buttonEl.disabled = true;
    const draft = state.visitDraft;
    await saveVisit({
      serviceId: v.visitId,
      customerId: c.customerId,
      zervaBookingId: v.zervaBookingId,
      timeSlot: v.timeSlot,
      serviceType: state.serviceType,
      formType: state.formType,
      status: "draft",
      visitDate: v.visitDate || Date.now(),
      technique: draft.technique || null,
      colorUsed: draft.colorChoice || null,
      intensity: draft.intensity || null,
      rawAnswers: { ...draft, beforePhotoDataUrl: undefined, afterPhotoDataUrl: undefined, signatureCustomerDataUrl: undefined }
    });
    buttonEl.disabled = false;
    alert("บันทึกแบบร่างแล้ว — กลับมาทำต่อได้ทุกเมื่อ");
  });
}

// ปุ่ม "ไม่ได้รับบริการ" — บังคับกรอกเหตุผล แล้วปิด Visit ทันทีโดยไม่บังคับ Consent/ลายเซ็น/รายละเอียดการทำ/รูป After
function wireNotServedButton(buttonEl) {
  if (!buttonEl) return;
  buttonEl.addEventListener("click", async () => {
    const v = state.visitContext;
    if (!v) return;
    const reason = prompt("เหตุผลที่ไม่ได้รับบริการ (บังคับกรอก):", "");
    if (reason === null) return; // กดยกเลิก
    if (!reason.trim()) { alert("กรุณาระบุเหตุผล"); return; }
    buttonEl.disabled = true;
    await closeVisitNotServed(v.visitId, reason.trim());
    state.reset();
    show("home");
  });
}
</script>
<script>
// ==== js/screens/login.js ====
// login.js — หน้าเข้าสู่ระบบ + modal รีเซ็ตรหัสผ่าน วางทับทั้งแอปด้วย z-index สูง
// ตรวจ username/password จริง: local (mock) เทียบกับ js/data/authConfig.js,
// production (gas/) เทียบกับแท็บ Config ของ Sheet ผ่าน login()/changePassword() — ดู gas/Code.gs
// สถานะ login จริงคือ session token ที่เซิร์ฟเวอร์ออกให้ (ดู js/session.js) ไม่ใช่ flag ฝั่ง client เฉยๆ




let screen, form, userInput, pwInput, errorEl, submitBtn;
let resetOverlay, resetForm, resetOldPw, resetPw, resetPwConfirm, resetError;

function showLogin() {
  if (!screen) return;
  closeReset(); // กันไม่ให้ modal reset ค้างทับหน้า login
  screen.hidden = false;
  // ฟอร์มซ่อนไว้ตั้งแต่ต้น (ดู index.html) เพื่อให้ตอนโหลดหน้า/รอ checkSession() มีแค่โลโก้บนพื้นแบรนด์
  // โชว์เป็น splash เฉยๆ ไม่ใช่ฟอร์ม login เต็มที่กระพริบขึ้นมาแล้วหายไปทันทีถ้า session ยัง valid อยู่
  if (form) form.hidden = false;
  if (userInput) userInput.value = "";
  if (pwInput) pwInput.value = "";
  if (errorEl) errorEl.hidden = true;
  if (userInput) userInput.focus();
}

function hideLogin() {
  if (screen) screen.hidden = true;
}

// ออกจากระบบ: แจ้งเซิร์ฟเวอร์ให้เพิกถอน session token ก่อน (best-effort) แล้วค่อยล้าง cookie ฝั่ง client
// เผื่อเรียกซ้ำได้ปลอดภัยแม้ session จะหมดอายุไปแล้วก็ตาม
async function logoutUser() {
  const token = getToken();
  clearToken();
  if (token) {
    try {
      await logout(token);
    } catch (e) {
      // เพิกเฉย — client ล้าง token ไปแล้ว ต่อให้แจ้งเซิร์ฟเวอร์ไม่สำเร็จก็ยัง logout ฝั่งนี้ได้จริง
    }
  }
}

function openReset() {
  if (!resetOverlay) return;
  resetOldPw.value = "";
  resetPw.value = "";
  resetPwConfirm.value = "";
  resetError.hidden = true;
  resetOverlay.hidden = false;
  resetOldPw.focus();
}

function closeReset() {
  if (resetOverlay) resetOverlay.hidden = true;
}

function initLogin() {
  screen = document.getElementById("loginScreen");
  form = document.getElementById("loginForm");
  userInput = document.getElementById("loginUsername");
  pwInput = document.getElementById("loginPassword");
  errorEl = document.getElementById("loginError");
  submitBtn = form ? form.querySelector(".login-submit") : null;
  const toggleBtn = document.getElementById("loginTogglePw");
  const forgotBtn = document.getElementById("loginForgot");

  resetOverlay = document.getElementById("resetOverlay");
  resetForm = document.getElementById("resetForm");
  resetOldPw = document.getElementById("resetOldPw");
  resetPw = document.getElementById("resetPw");
  resetPwConfirm = document.getElementById("resetPwConfirm");
  resetError = document.getElementById("resetError");
  closeReset(); // เริ่มต้นให้ modal ปิดเสมอ กันสถานะค้างจากการโหลดผิดปกติ

  if (form) {
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = userInput.value.trim();
      const password = pwInput.value;
      if (!username || !password) {
        errorEl.textContent = "Please enter your username and password.";
        errorEl.hidden = false;
        return;
      }
      errorEl.hidden = true;
      if (submitBtn) submitBtn.disabled = true;
      const res = await login(username, password);
      if (submitBtn) submitBtn.disabled = false;
      if (res.success) {
        setToken(res.token);
        hideLogin();
        // หน้า home ถูก mount ไว้ใต้ overlay login ตั้งแต่ตอนเปิดแอป (ตอนนั้นยังไม่มี session จริง
        // โหลดข้อมูลลูกค้าไม่สำเร็จ) สั่ง show("home") ซ้ำหลัง login ผ่านเพื่อโหลดข้อมูลใหม่ด้วย session จริง
        show("home");
      } else {
        errorEl.textContent = "Invalid username or password.";
        errorEl.hidden = false;
      }
    });

    toggleBtn.addEventListener("click", () => {
      const show = pwInput.type === "password";
      pwInput.type = show ? "text" : "password";
      toggleBtn.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });

    forgotBtn.addEventListener("click", openReset);
  }

  initResetModal();

  // session หมดอายุระหว่างใช้งาน (เช่น login เครื่องอื่นทับ หรือถูกเปลี่ยนรหัสผ่าน) — เด้งกลับหน้า login
  window.addEventListener("pyne:session-expired", () => {
    showLogin();
  });
}

function initResetModal() {
  if (!resetOverlay || !resetForm) return;
  const closeBtn = document.getElementById("resetClose");
  const backBtn = document.getElementById("resetBack");
  const resetSubmitBtn = resetForm.querySelector(".login-submit");

  resetForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const oldPw = resetOldPw.value.trim();
    const pw = resetPw.value.trim();
    const confirm = resetPwConfirm.value.trim();
    if (!oldPw) {
      resetError.textContent = "Please enter your current password.";
      resetError.hidden = false;
      return;
    }
    if (!pw || pw !== confirm) {
      resetError.textContent = "Passwords do not match.";
      resetError.hidden = false;
      return;
    }
    resetError.hidden = true;
    if (resetSubmitBtn) resetSubmitBtn.disabled = true;
    const res = await changePassword(oldPw, pw);
    if (resetSubmitBtn) resetSubmitBtn.disabled = false;
    if (res.success) {
      // เปลี่ยนรหัสผ่านสำเร็จ = เพิกถอน session เดิมเสมอ (ฝั่งเซิร์ฟเวอร์ทำไปแล้ว) ต้อง login ใหม่ด้วยรหัสใหม่
      clearToken();
      closeReset();
      alert("Password updated. Please sign in again.");
      showLogin();
    } else if (res.error === "wrong_password") {
      resetError.textContent = "Current password is incorrect.";
      resetError.hidden = false;
    } else {
      resetError.textContent = "Could not update password. Please try again.";
      resetError.hidden = false;
    }
  });

  // ปุ่มลูกตาโชว์/ซ่อนรหัสของทั้งสองช่อง
  resetForm.querySelectorAll("[data-reset-toggle]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const field = document.getElementById(btn.dataset.resetToggle);
      const show = field.type === "password";
      field.type = show ? "text" : "password";
      btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });
  });

  closeBtn.addEventListener("click", closeReset);
  backBtn.addEventListener("click", closeReset);
  resetOverlay.addEventListener("click", (e) => {
    if (e.target === resetOverlay) closeReset();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !resetOverlay.hidden) closeReset();
  });
}
</script>
<script>
// ==== js/screens/home.js ====
const ICON_PHONE = `<svg class="cell-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>`;
const ICON_LINE = `<svg class="cell-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>`;
const ICON_CAL = `<svg class="cell-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
const ICON_STAR = `<svg class="cell-star" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
const ICON_MORE = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>`;
const ICON_VIEW = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/></svg>`;
const ICON_SERVICE = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;

function initials(name) {
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return "?";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

function initHome() {
  const tbody = document.getElementById("customersTableBody");
  const tableCard = document.getElementById("customersTableBody").closest(".customers-table-card");
  const table = tableCard.querySelector("table");
  const emptyState = document.getElementById("customersEmptyState");
  const searchInput = document.getElementById("searchInput");
  const startChoice = document.getElementById("homeStartChoice");
  const searchPanel = document.getElementById("homeSearchPanel");
  const chooseNewCustomerBtn = document.getElementById("chooseNewCustomerBtn");
  const chooseOldCustomerBtn = document.getElementById("chooseOldCustomerBtn");
  const searchBackBtn = document.getElementById("homeSearchBackBtn");
  const summary = document.getElementById("customersSummary");

  let visibleCustomers = [];
  let searchRequestSeq = 0;

  function renderSummary() {
    const total = visibleCustomers.length;
    summary.innerHTML = `<strong>${total}</strong> customer${total === 1 ? "" : "s"}`;
  }

  function openProfile(customer) {
    state.currentCustomer = customer;
    show("customerProfile");
  }

  function openService(customer) {
    // ทุกคิวต้องผ่าน Step 3 (สร้าง Visit) ก่อนเปิดฟอร์ม Consultation เสมอตามสเปก — ห้ามเปิด modal
    // เลือกฟอร์ม (Step 4) ตรง ๆ จากตรงนี้ เพราะ state.visitContext จะไม่ถูกตั้งค่า (ตั้งค่าเฉพาะใน
    // createVisit.js) ทำให้กด Next/บันทึกแบบร่างในฟอร์มแล้วเงียบ ๆ ไม่มีอะไรเกิดขึ้นหรือเด้งกลับ home
    state.currentCustomer = customer;
    state.serviceType = null;
    state.resetVisitDraft();
    show("createVisit");
  }

  function render(rows) {
    visibleCustomers = rows || [];
    renderSummary();
    const qPhone = normalizePhone(searchInput.value);

    if (qPhone.length < 3) {
      table.hidden = true;
      emptyState.hidden = false;
      emptyState.innerHTML = `กรอกเบอร์โทรศัพท์อย่างน้อย 3 หลักเพื่อค้นหา Customer Profile`;
      return;
    }

    if (visibleCustomers.length === 0) {
      table.hidden = true;
      emptyState.hidden = false;
      emptyState.innerHTML = `ไม่พบ Customer Profile จากเบอร์ "${escapeHtml(searchInput.value.trim())}"`;
      return;
    }
    table.hidden = false;
    emptyState.hidden = true;

    tbody.innerHTML = visibleCustomers.map((c) => {
      const visitsCount = Number(c.visitsCount || 0);
      const sub = visitsCount > 0 && c.lastTechnique && c.lastTechnique !== "-"
        ? `<span class="cust-sub">${escapeHtml(c.lastTechnique)}</span>` : "";
      const lineCell = c.line
        ? `${ICON_LINE}<span>@${escapeHtml(c.line)}</span>`
        : `<span class="cell-empty">—</span>`;
      const lastVisit = visitsCount === 0
        ? `<span class="cell-empty">New customer</span>`
        : `${ICON_CAL}<span>${escapeHtml(formatDateShort(c.lastVisitDate))}</span>`;
      return `
      <tr data-id="${c.customerId}">
        <td class="cell-customer">
          <span class="avatar">${escapeHtml(initials(c.nickname || c.fullName))}</span>
          <span class="cust-meta">
            <span class="cust-name">${escapeHtml(c.nickname || c.fullName)}</span>
            ${sub}
          </span>
        </td>
        <td><span class="cell-ico">${ICON_PHONE}<span>${escapeHtml(c.phoneDisplay)}</span></span></td>
        <td><span class="cell-ico">${lineCell}</span></td>
        <td><span class="cell-ico">${lastVisit}</span></td>
        <td><span class="cell-visits">${ICON_STAR}<span><strong>${visitsCount}</strong> visit${visitsCount === 1 ? "" : "s"}</span></span></td>
        <td class="cell-actions">
          <div class="row-menu">
            <button type="button" class="row-menu-trigger" aria-haspopup="true" aria-expanded="false" aria-label="Actions">
              ${ICON_MORE}
            </button>
            <div class="row-menu-popover" role="menu" hidden>
              <button type="button" class="row-menu-item" role="menuitem" data-action="view">
                ${ICON_VIEW}<span>View profile</span>
              </button>
              <button type="button" class="row-menu-item" role="menuitem" data-action="service">
                ${ICON_SERVICE}<span>New service</span>
              </button>
            </div>
          </div>
        </td>
      </tr>`;
    }).join("");

    function closeAllMenus() {
      tbody.querySelectorAll(".row-menu").forEach((menu) => {
        menu.classList.remove("is-open");
        const pop = menu.querySelector(".row-menu-popover");
        const trigger = menu.querySelector(".row-menu-trigger");
        if (pop) pop.hidden = true;
        if (trigger) trigger.setAttribute("aria-expanded", "false");
      });
    }

    tbody.querySelectorAll("tr").forEach((tr) => {
      const customer = visibleCustomers.find((c) => c.customerId === tr.dataset.id);
      const menu = tr.querySelector(".row-menu");
      const trigger = tr.querySelector(".row-menu-trigger");
      const popover = tr.querySelector(".row-menu-popover");
      if (!menu || !trigger || !popover) return;

      trigger.addEventListener("click", (e) => {
        e.stopPropagation();
        const willOpen = popover.hidden;
        closeAllMenus();
        if (willOpen) {
          menu.classList.add("is-open");
          popover.hidden = false;
          trigger.setAttribute("aria-expanded", "true");

          // ลอย dropdown ออกจากกรอบ table-scroll เพื่อไม่ให้ overflow ตัดเมนู
          const triggerRect = trigger.getBoundingClientRect();
          const popoverRect = popover.getBoundingClientRect();
          const gap = 6;
          const left = Math.min(
            window.innerWidth - popoverRect.width - 12,
            Math.max(12, triggerRect.right - popoverRect.width)
          );
          const spaceBelow = window.innerHeight - triggerRect.bottom;
          const top = spaceBelow >= popoverRect.height + gap
            ? triggerRect.bottom + gap
            : triggerRect.top - popoverRect.height - gap;
          popover.style.left = `${left}px`;
          popover.style.top = `${Math.max(12, top)}px`;
        }
      });

      popover.querySelectorAll("[data-action]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          closeAllMenus();
          if (!customer) return;
          if (btn.dataset.action === "view") openProfile(customer);
          else if (btn.dataset.action === "service") openService(customer);
        });
      });
    });
  }

  function closeAllOpenMenus() {
    tbody.querySelectorAll(".row-menu.is-open").forEach((menu) => {
      menu.classList.remove("is-open");
      const pop = menu.querySelector(".row-menu-popover");
      const trigger = menu.querySelector(".row-menu-trigger");
      if (pop) pop.hidden = true;
      if (trigger) trigger.setAttribute("aria-expanded", "false");
    });
  }

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".row-menu")) closeAllOpenMenus();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeAllOpenMenus();
  });

  async function runPhoneSearch() {
    const qPhone = normalizePhone(searchInput.value);
    const requestId = ++searchRequestSeq;
    if (qPhone.length < 3) {
      render([]);
      return;
    }
    table.hidden = true;
    emptyState.hidden = false;
    emptyState.textContent = "กำลังค้นหา...";
    try {
      const rows = await searchCustomers(qPhone);
      if (requestId !== searchRequestSeq) return;
      render(rows);
      if (!rows.length) {
        try {
          const debug = await debugCustomerSearch(qPhone);
          if (requestId !== searchRequestSeq) return;
          emptyState.innerHTML = `
            ไม่พบ Customer Profile จากเบอร์ "${escapeHtml(searchInput.value.trim())}"
            <br><span class="muted small">debug: rows=${escapeHtml(debug.rowCount)} lastRow=${escapeHtml(debug.lastRow)} q=${escapeHtml(debug.qPhone)} sample=${escapeHtml(JSON.stringify(debug.sample || []))}</span>
          `;
        } catch (debugErr) {
          console.warn("debugCustomerSearch failed:", debugErr);
        }
      }
    } catch (e) {
      if (requestId !== searchRequestSeq) return;
      console.warn("searchCustomers failed:", e);
      emptyState.innerHTML = `ค้นหาลูกค้าไม่สำเร็จ — ${escapeHtml((e && e.message) || String(e))}<br><button type="button" class="btn btn-primary" id="retryLoadCustomersBtn" style="margin-top:10px">ลองใหม่</button>`;
      const retryBtn = document.getElementById("retryLoadCustomersBtn");
      if (retryBtn) retryBtn.addEventListener("click", runPhoneSearch);
      return;
    }
  }

  ["input", "keyup", "change", "paste"].forEach((evt) => {
    searchInput.addEventListener(evt, () => setTimeout(runPhoneSearch, 0));
  });

  function showStartChoice() {
    startChoice.hidden = false;
    searchPanel.hidden = true;
  }

  function showSearchPanel() {
    startChoice.hidden = true;
    searchPanel.hidden = false;
    searchInput.value = "";
    visibleCustomers = [];
    render([]);
    searchInput.focus();
  }

  chooseNewCustomerBtn.addEventListener("click", () => {
    // ลูกค้าใหม่: สร้างลูกค้าเข้าฐานข้อมูลก่อน แล้วจึงเลือกบริการ (แยกตัวตนออกจากฟอร์มคอนเซ้นต์)
    state.currentCustomer = null;
    state.serviceType = null;
    state.resetVisitDraft();
    show("newCustomer");
  });

  // ลูกค้าเก่า: ต้องเลือกก่อนถึงจะเข้าค้นหาได้ (Step 1 ตามสเปก Flow การรับลูกค้า) — กันไม่ให้เห็นตาราง
  // ลูกค้าทั้งหมดตั้งแต่แรกเข้า
  chooseOldCustomerBtn.addEventListener("click", showSearchPanel);
  searchBackBtn.addEventListener("click", showStartChoice);

  onEnter("home", () => {
    showStartChoice();
    searchInput.value = "";
    visibleCustomers = [];
    renderSummary();
  });
}
</script>
<script>
// ==== js/screens/newCustomer.js ====
// newCustomer.js — Step 2 (ลูกค้าใหม่): กรอกข้อมูลส่วนตัว 5 ฟิลด์ > ยืนยันข้อมูล > กรอกประวัติผิวและคิ้ว > สร้าง Customer Profile
// flow: home > "+ New Customer" > หน้านี้ > สร้างลูกค้าเข้า DB > ไปหน้าสร้าง Visit (Step 3)







// state ชั่วคราวของหน้านี้เท่านั้น (ยังไม่ได้สร้าง customer จริงจนกว่าจะกด Continue) — ไม่ใช้ state.visitDraft
// เพราะฟิลด์นี้เป็นของ Customer Profile ไม่ใช่ของ Visit
const draft = {};

function ageFromDob(dobStr) {
  if (!dobStr) return null;
  const dob = new Date(dobStr);
  if (isNaN(dob.getTime())) return null;
  const now = new Date();
  let age = now.getFullYear() - dob.getFullYear();
  const m = now.getMonth() - dob.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < dob.getDate())) age--;
  return age;
}

function initNewCustomer() {
  const container = document.getElementById("newCustomerBody");
  const backBtn = document.getElementById("newCustomerBackBtn");

  function summaryHtml() {
    const age = ageFromDob(draft.dob);
    return `
      <div class="detail-row"><div class="detail-label">ชื่อ–นามสกุล</div><div class="detail-value">${escapeHtml(draft.fullName || "-")}</div></div>
      <div class="detail-row"><div class="detail-label">ชื่อเล่น</div><div class="detail-value">${escapeHtml(draft.nickname || "-")}</div></div>
      <div class="detail-row"><div class="detail-label">วันเดือนปีเกิด</div><div class="detail-value">${escapeHtml(draft.dob || "-")}${age !== null ? ` (อายุ ${age} ปี)` : ""}</div></div>
      <div class="detail-row"><div class="detail-label">เบอร์โทรศัพท์</div><div class="detail-value">${escapeHtml(draft.phone || "-")}</div></div>
    `;
  }

  function render() {
    container.innerHTML = `
      <p class="choose-lead">กรอกข้อมูลลูกค้าใหม่เพื่อสร้าง Customer Profile</p>

      <label class="field-label">ชื่อ–นามสกุลจริง <span class="required-star">*</span></label>
      <input type="text" id="ncFullName" class="input" placeholder="เช่น มาลี ใจดี" autocomplete="off">
      <label class="field-label">ชื่อเล่น <span class="required-star">*</span></label>
      <input type="text" id="ncNickname" class="input" placeholder="เช่น มายด์" autocomplete="off">
      <label class="field-label">วันเดือนปีเกิด <span class="required-star">*</span></label>
      <input type="date" id="ncDob" class="input">
      <label class="field-label">เบอร์โทรศัพท์ <span class="required-star">*</span></label>
      <input type="tel" id="ncPhone" class="input" inputmode="tel" placeholder="08x-xxx-xxxx" autocomplete="off">
      <label class="field-label">LINE ID (ถ้ามี)</label>
      <input type="text" id="ncLine" class="input" placeholder="Optional" autocomplete="off">
      <div id="ncWarning"></div>

      <div class="form-section-title">ยืนยันข้อมูลส่วนตัว</div>
      <div class="box-quiet" id="ncSummaryBox">${summaryHtml()}</div>
      <div class="step-group">
        <div class="step-group-title">ข้อมูลส่วนตัวถูกต้องหรือไม่ <span class="required-star">*</span></div>
        ${radioField("confirmOk", ["ถูกต้อง", "แก้ไข"], draft)}
      </div>

      <div class="form-section-title">ประวัติผิวและคิ้ว</div>
      <div class="step-group">
        <div class="step-group-title">ลักษณะผิวโดยรวม</div>
        ${radioField("skinType", OPTIONS.skinType, draft)}
      </div>
      <div class="step-group">
        <div class="step-group-title">ลักษณะเส้นขน</div>
        ${radioField("hairLook", OPTIONS.hairLook, draft)}
      </div>
      <div class="step-group">
        <div class="step-group-title">ความหนาแน่นเส้นขน</div>
        ${radioField("hairDensity", OPTIONS.hairDensity, draft)}
      </div>
      <div class="step-group">
        <div class="step-group-title">ทรงคิ้ว</div>
        ${chipGroup("browShape", OPTIONS.browShape, draft, true)}
      </div>
      <p class="muted small">กล้ามเนื้อคิ้ว: ยังไม่ได้ประเมิน (จะประเมินหลังเช็ดคิ้ว/วัดทรงจริงในฟอร์ม 1 หรือ 2 ครั้งแรก)</p>

      <button class="btn btn-primary btn-block" id="ncCreateBtn2" style="margin-top:14px">Create Customer &amp; Continue</button>
    `;

    ["ncFullName", "ncNickname", "ncDob", "ncPhone", "ncLine"].forEach((id) => {
      const el = document.getElementById(id);
      const key = { ncFullName: "fullName", ncNickname: "nickname", ncDob: "dob", ncPhone: "phone", ncLine: "line" }[id];
      el.value = draft[key] || "";
      el.addEventListener("input", () => {
        draft[key] = el.value;
        el.classList.remove("field-error");
        document.getElementById("ncSummaryBox").innerHTML = summaryHtml();
      });
    });

    document.getElementById("ncCreateBtn2").addEventListener("click", onCreate);
  }

  bindFieldEvents(container, draft, () => {});

  container.addEventListener("input", (e) => {
    const errEl = e.target.closest(".field-error");
    if (errEl) errEl.classList.remove("field-error");
  });
  container.addEventListener("click", (e) => {
    const errEl = e.target.closest(".field-error");
    if (errEl) errEl.classList.remove("field-error");
  });

  function clearErrors() {
    container.querySelectorAll(".field-error").forEach((el) => el.classList.remove("field-error"));
    document.getElementById("ncWarning").innerHTML = "";
  }
  function flagError(selector) {
    const el = container.querySelector(selector);
    if (el) el.classList.add("field-error");
    return el;
  }

  backBtn.addEventListener("click", () => show("home"));

  async function onCreate() {
    clearErrors();
    const nameEl = !draft.fullName?.trim() ? flagError("#ncFullName") : null;
    const nickEl = !draft.nickname?.trim() ? flagError("#ncNickname") : null;
    const dobEl = !draft.dob ? flagError("#ncDob") : null;
    const phoneEl = !draft.phone?.trim() ? flagError("#ncPhone") : null;
    const confirmEl = draft.confirmOk !== "ถูกต้อง" ? flagError('[data-radio-key="confirmOk"]') : null;
    const firstErr = nameEl || nickEl || dobEl || phoneEl || confirmEl;
    if (firstErr) { firstErr.scrollIntoView({ behavior: "smooth", block: "center" }); return; }

    const createBtn2 = document.getElementById("ncCreateBtn2");
    createBtn2.disabled = true;

    // ทุก request ข้างล่างนี้ยิงไปเซิร์ฟเวอร์จริง (Apps Script + LockService) พังได้ทั้งจาก network
    // hiccup หรือ lock timeout เวลาช่างหลายคนกดพร้อมกัน — เดิมไม่มี try/catch เลยสักจุด ถ้า request ไหน
    // reject ปุ่มจะค้าง disabled (หรือค้างหน้าเดิมเฉยๆ ไม่ error ไม่ navigate ต่อ) ดูเหมือนแอปค้าง/โหลดไม่ขึ้น
    let existing;
    try {
      existing = await findCustomerByPhone(draft.phone);
    } catch (e) {
      createBtn2.disabled = false;
      document.getElementById("ncWarning").innerHTML = `<div class="dup-warning">⚠ เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง</div>`;
      return;
    }
    if (existing) {
      createBtn2.disabled = false;
      document.getElementById("ncWarning").innerHTML = `
        <div class="dup-warning">
          ⚠ This phone number already exists: <b>${escapeHtml(existing.fullName || existing.nickname)}</b> (${escapeHtml(existing.phoneDisplay)})<br>
          Please use the existing customer instead of creating a duplicate.
          <br><button class="btn btn-primary" id="ncUseExistingBtn" type="button" style="margin-top:8px">Open this customer</button>
        </div>`;
      document.getElementById("ncUseExistingBtn").addEventListener("click", () => {
        state.currentCustomer = existing;
        show("customerProfile");
      });
      return;
    }

    let res;
    try {
      res = await createCustomer({
        fullName: draft.fullName.trim(), nickname: draft.nickname.trim(),
        dob: draft.dob, phone: draft.phone.trim(), line: (draft.line || "").trim()
      });
    } catch (e) {
      createBtn2.disabled = false;
      document.getElementById("ncWarning").innerHTML = `<div class="dup-warning">⚠ สร้าง Customer Profile ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง</div>`;
      return;
    }
    createBtn2.disabled = false;
    if (!res.success) {
      document.getElementById("ncWarning").innerHTML = `<div class="dup-warning">⚠ Could not create customer (this phone may have just been added). Please try again.</div>`;
      return;
    }

    // ลูกค้าถูกสร้างสำเร็จแล้ว ณ จุดนี้ (มี customerId จริงในฐานข้อมูล) — ตั้ง state ทันทีกันไม่ให้ค้าง
    // หน้าเดิมถ้าขั้นตอนถัดไป (บันทึกประวัติผิว/ยืนยันข้อมูล) พังภายหลัง ประวัติผิวแก้ทีหลังได้ใน Customer Profile
    state.currentCustomer = res.customer;
    try {
      const skinRes = await saveSkinProfile(res.customer.customerId, {
        skinType: draft.skinType || null,
        hairLook: draft.hairLook || null,
        hairDensity: draft.hairDensity || null,
        browShape: draft.browShape || []
      });
      const confirmRes = await confirmCustomerProfile(res.customer.customerId);
      // ใช้ผลลัพธ์ล่าสุดหลังอัปเดต skinProfile/profileConfirmedAt แล้ว ไม่ใช่ res.customer ตอน createCustomer()
      // ตอนนั้น (ก่อน saveSkinProfile/confirmCustomerProfile เขียนทับ) เพราะจะทำให้หน้าถัดไปเห็น skinProfile ว่างเปล่า
      state.currentCustomer = confirmRes.customer || skinRes.customer || res.customer;
    } catch (e) {
      console.warn("saveSkinProfile/confirmCustomerProfile failed after customer was created:", e);
    }

    Object.keys(draft).forEach((k) => delete draft[k]);
    show("createVisit");
  }

  onEnter("newCustomer", () => {
    Object.keys(draft).forEach((k) => delete draft[k]);
    render();
  });
}
</script>
<script>
// ==== js/screens/customerProfile.js ====
function ageFromDob(dobStr) {
  if (!dobStr) return null;
  const dob = new Date(dobStr);
  if (isNaN(dob.getTime())) return null;
  const now = new Date();
  let age = now.getFullYear() - dob.getFullYear();
  const m = now.getMonth() - dob.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < dob.getDate())) age--;
  return age;
}

// ระยะเวลาจากวันที่มารับบริการล่าสุดถึงวันนี้ ปัดเป็นจำนวนเดือนเต็ม (ตามสเปก "ครั้งที่มารับบริการล่าสุด (คำนวณเดือน)")
function monthsSince(ts) {
  if (!ts) return "-";
  const months = Math.max(0, Math.round((Date.now() - ts) / (1000 * 60 * 60 * 24 * 30)));
  return months === 0 ? "เดือนนี้" : `${months} เดือนที่แล้ว`;
}

function initCustomerProfile() {
  const profileCard = document.getElementById("profileCard");
  const skinCard = document.getElementById("skinProfileCard");
  const historySummary = document.getElementById("historySummary");
  const historyList = document.getElementById("historyList");
  const addVisitBtn = document.getElementById("addVisitBtn");

  // object เดียวคงที่ตลอดอายุโมดูล (mutate ด้วย key เอา ห้าม reassign เป็น {} ใหม่) เพราะ bindFieldEvents
  // ผูก event delegation ไว้กับ reference นี้ตอน init ครั้งเดียว — ดูคำเตือนแบบเดียวกันใน state.js
  const skinEditDraft = {};
  let isEditingSkin = false;

  addVisitBtn.addEventListener("click", () => show("createVisit"));

  function skinSummaryHtml(sp) {
    sp = sp || {};
    return `
      <div class="detail-row"><div class="detail-label">ลักษณะผิวโดยรวม</div><div class="detail-value">${escapeHtml(sp.skinType || "-")}</div></div>
      <div class="detail-row"><div class="detail-label">ลักษณะเส้นขน</div><div class="detail-value">${escapeHtml(sp.hairLook || "-")}</div></div>
      <div class="detail-row"><div class="detail-label">ความหนาแน่นเส้นขน</div><div class="detail-value">${escapeHtml(sp.hairDensity || "-")}</div></div>
      <div class="detail-row"><div class="detail-label">ทรงคิ้ว</div><div class="detail-value">${(sp.browShape || []).join(", ") || "-"}</div></div>
      <div class="detail-row">
        <div class="detail-label">กล้ามเนื้อคิ้ว</div>
        <div class="detail-value">${sp.muscle ? escapeHtml(sp.muscle) + (sp.muscleEvaluatedAt ? ` (ประเมินล่าสุด ${formatDate(sp.muscleEvaluatedAt)})` : "") : "ยังไม่ได้ประเมิน"}${sp.muscleNote ? `<br><span class="muted small">${escapeHtml(sp.muscleNote)}</span>` : ""}</div>
      </div>
      <button type="button" class="icon-btn" id="skinEditBtn" style="padding-left:0">แก้ไขประวัติผิวและคิ้ว</button>
    `;
  }

  function skinEditHtml() {
    return `
      <div class="step-group">
        <div class="step-group-title">ลักษณะผิวโดยรวม</div>
        ${radioField("skinType", OPTIONS.skinType, skinEditDraft)}
      </div>
      <div class="step-group">
        <div class="step-group-title">ลักษณะเส้นขน</div>
        ${radioField("hairLook", OPTIONS.hairLook, skinEditDraft)}
      </div>
      <div class="step-group">
        <div class="step-group-title">ความหนาแน่นเส้นขน</div>
        ${radioField("hairDensity", OPTIONS.hairDensity, skinEditDraft)}
      </div>
      <div class="step-group">
        <div class="step-group-title">ทรงคิ้ว</div>
        ${chipGroup("browShape", OPTIONS.browShape, skinEditDraft, true)}
      </div>
      <div style="display:flex; gap:10px; margin-top:10px">
        <button type="button" class="btn btn-outline" id="skinCancelBtn" style="flex:1">ยกเลิก</button>
        <button type="button" class="btn btn-primary" id="skinSaveBtn" style="flex:1">บันทึก</button>
      </div>
    `;
  }

  function renderSkinCard(c) {
    skinCard.innerHTML = isEditingSkin ? skinEditHtml() : skinSummaryHtml(c.skinProfile);
    if (isEditingSkin) {
      document.getElementById("skinCancelBtn").addEventListener("click", () => { isEditingSkin = false; renderSkinCard(c); });
      document.getElementById("skinSaveBtn").addEventListener("click", async (e) => {
        e.currentTarget.disabled = true;
        const payload = { ...skinEditDraft };
        await saveSkinProfile(c.customerId, payload);
        c.skinProfile = { ...c.skinProfile, ...payload };
        isEditingSkin = false;
        renderSkinCard(c);
      });
    } else {
      document.getElementById("skinEditBtn").addEventListener("click", () => {
        Object.keys(skinEditDraft).forEach((k) => delete skinEditDraft[k]);
        Object.assign(skinEditDraft, c.skinProfile || {});
        skinEditDraft.browShape = [...(c.skinProfile?.browShape || [])];
        isEditingSkin = true;
        renderSkinCard(c);
      });
    }
  }

  bindFieldEvents(skinCard, skinEditDraft, () => {});

  onEnter("customerProfile", async () => {
    const c = state.currentCustomer;
    if (!c) { show("home"); return; }
    isEditingSkin = false;

    const age = ageFromDob(c.dob);
    profileCard.innerHTML = `
      <div class="pname">${escapeHtml(c.fullName || c.nickname)}</div>
      <div class="pmeta">
        ${c.nickname ? `ชื่อเล่น: ${escapeHtml(c.nickname)} &nbsp;·&nbsp; ` : ""}${c.dob ? `${escapeHtml(c.dob)}${age !== null ? ` (${age} ปี)` : ""} &nbsp;·&nbsp; ` : ""}☎ ${escapeHtml(c.phoneDisplay)}${c.line ? " &nbsp;·&nbsp; LINE: " + escapeHtml(c.line) : ""}
      </div>
      <div class="pmeta">${escapeHtml(c.customerId)}</div>
    `;

    renderSkinCard(c);

    historySummary.hidden = true;
    historyList.innerHTML = `<div class="empty-hint">Loading history...</div>`;
    const history = await getHistoryByCustomer(c.customerId);

    if (history.length === 0) {
      historyList.innerHTML = `<div class="empty-hint">No service history yet</div>`;
      return;
    }

    // สรุปย่อตามสเปก: "ครั้งที่มารับบริการล่าสุด (คำนวณเดือน)" + "เทคนิคที่ทำ" ก่อนรายการเต็มด้านล่าง
    historySummary.hidden = false;
    historySummary.innerHTML = `
      <div class="detail-row"><div class="detail-label">ครั้งที่มารับบริการล่าสุด</div><div class="detail-value">${escapeHtml(monthsSince(history[0].visitDate))}</div></div>
      <div class="detail-row"><div class="detail-label">เทคนิคที่ทำ</div><div class="detail-value">${escapeHtml(history[0].technique || "-")}</div></div>
    `;

    historyList.innerHTML = history.map((v) => `
      <div class="history-item" data-id="${v.serviceId}">
        <span class="hdate">${formatDate(v.visitDate)}</span>
        <span class="htype ${v.serviceType === "เติมสี" ? "touchup" : ""}">${escapeHtml(v.serviceType)}</span>
        ${v.status === "draft" ? `<span class="draft-badge" style="margin:0 0 0 6px">Draft</span>` : ""}
        ${v.status === "ไม่ได้รับบริการ" ? `<span class="draft-badge" style="margin:0 0 0 6px; background:var(--error-bg); color:var(--error-text)">Not served</span>` : ""}
        <div class="hdetail">
          Technique: ${escapeHtml(v.technique || "-")} · Color: ${escapeHtml(v.colorUsed || "-")}<br>
          Intensity: ${escapeHtml(v.intensity || "-")}
          ${v.note ? `<br>Note: ${escapeHtml(v.note)}` : ""}
        </div>
      </div>
    `).join("");

    historyList.querySelectorAll(".history-item").forEach((el) => {
      el.addEventListener("click", () => {
        const visit = history.find((h) => h.serviceId === el.dataset.id);
        show("visitDetail", { data: visit });
      });
    });
  });
}
</script>
<script>
// ==== js/screens/visitDetail.js ====
// visitDetail.js — หน้าดูรายละเอียดประวัติการเข้ารับบริการแบบอ่านอย่างเดียว (แก้ไขไม่ได้)
// เปิดจากการกดรายการใน customerProfile.js (ส่ง visit object มาทาง show("visitDetail", { data: visit }))



const FIELD_LABELS = {
  hadBrowBefore: "เคยสักคิ้วมาก่อนหรือไม่",
  oldMarkLook: "ลักษณะรอยเก่าที่เห็นในปัจจุบัน",
  oldMarkTone: "โทนสีรอยเดิม",
  fixPoints: "จุดที่ต้องการแก้ไขจากรอยเดิม",
  browHairLook: "ลักษณะขนคิ้ว",
  browHairDensity: "ความแน่นของขนคิ้ว",
  skinType: "ประเภทผิว",
  hasScar: "ผิวบริเวณคิ้วมีแผลเป็นหรือไม่",
  scarCause: "สาเหตุแผลเป็น",

}

<script>
// ==== js/screens/createVisit.js ====
// createVisit.js — Step 3: สร้างประวัติการเข้ารับบริการใหม่ (ทุกคิว ไม่ว่าลูกค้าใหม่/เก่า ต้องผ่านหน้านี้ก่อนเปิดฟอร์ม)
// เก็บ Zerva Booking ID + วันที่ + เวลานัด แล้วสร้าง Visit สถานะ "กำลังดำเนินการ" ก่อนไปหน้าเลือกฟอร์ม (Step 4)






function pad2(n) { return String(n).padStart(2, "0"); }
function todayDateValue() {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function initCreateVisit() {
  const profileBox = document.getElementById("cvProfileBox");
  const zervaEl = document.getElementById("cvZervaId");
  const dateEl = document.getElementById("cvDate");
  const slotButtons = document.querySelectorAll("[data-time-slot]");
  const customSlotBtn = document.getElementById("cvCustomSlotBtn");
  const customTimeEl = document.getElementById("cvCustomTime");
  const continueBtn = document.getElementById("cvContinueBtn");
  const backBtn = document.getElementById("createVisitBackBtn");

  let selectedSlot = null;

  function selectSlot(slot) {
    selectedSlot = slot;
    slotButtons.forEach((b) => b.classList.toggle("is-selected", b.dataset.timeSlot === slot));
    customSlotBtn.classList.toggle("is-selected", slot === "custom");
    customTimeEl.hidden = slot !== "custom";
    zervaEl.closest(".page-pad")?.querySelectorAll(".field-error").forEach((el) => {
      if (el.id === "cvSlotGroup") el.classList.remove("field-error");
    });
  }

  slotButtons.forEach((btn) => btn.addEventListener("click", () => selectSlot(btn.dataset.timeSlot)));
  customSlotBtn.addEventListener("click", () => selectSlot("custom"));

  backBtn.addEventListener("click", () => show(state.currentCustomer ? "customerProfile" : "home"));

  [zervaEl].forEach((el) => el.addEventListener("input", () => el.classList.remove("field-error")));

  continueBtn.addEventListener("click", async () => {
    const c = state.currentCustomer;
    if (!c) { show("home"); return; }

    document.querySelectorAll(".field-error").forEach((el) => el.classList.remove("field-error"));
    let firstErr = null;
    if (!zervaEl.value.trim()) { zervaEl.classList.add("field-error"); firstErr = firstErr || zervaEl; }
    const slotGroup = document.getElementById("cvSlotGroup");
    const timeValue = selectedSlot === "custom" ? customTimeEl.value : selectedSlot;
    if (!timeValue) { slotGroup.classList.add("field-error"); firstErr = firstErr || slotGroup; }
    if (firstErr) { firstErr.scrollIntoView({ behavior: "smooth", block: "center" }); return; }

    continueBtn.disabled = true;
    try {
      // เช็คก่อนว่าลูกค้าคนนี้มี Visit ที่ยังไม่ปิด ("กำลังดำเนินการ") ค้างอยู่ไหม — ปกติไม่ควรมี แต่เกิดได้
      // ถ้าหน้าเว็บ reload กลางทางระหว่างกรอกฟอร์ม (visitContext เป็นแค่ state ในหน่วยความจำ ไม่ persist)
      // แล้วช่างกลับมาเริ่มใหม่ ไม่งั้นจะได้ Visit ซ้อนกัน 2 แถวสำหรับคิวเดียวกันแบบเงียบ ๆ
      const history = await getHistoryByCustomer(c.customerId);
      const openVisit = history.find((v) => v.status === "กำลังดำเนินการ");
      if (openVisit) {
        const proceed = confirm(
          `ลูกค้าคนนี้มี Visit ที่ยังไม่ปิดอยู่ (${openVisit.serviceId}, สร้างเมื่อ ${formatDate(openVisit.createdAt || openVisit.visitDate)}) ` +
          `อาจเป็นครั้งก่อนที่กรอกค้างไว้แล้วหลุดไปกลางทาง\n\n` +
          `กด OK เพื่อสร้าง Visit ใหม่ต่อไป (Visit เก่าจะยังค้างอยู่ ต้องไปปิดเองทีหลัง) หรือ Cancel เพื่อหยุดแล้วไปเช็ค Visit เก่าก่อน`
        );
        if (!proceed) { continueBtn.disabled = false; return; }
      }
    } catch (e) {
      // เช็ค Visit ค้างไม่สำเร็จ — ไม่บล็อกการทำงานต่อ แค่ข้ามการเตือนไปเฉย ๆ
      console.warn("checking for open visit failed:", e);
    }

    const visitDate = dateEl.value ? new Date(dateEl.value).getTime() : Date.now();
    try {
      const res = await createVisit({
        customerId: c.customerId,
        zervaBookingId: zervaEl.value.trim(),
        visitDate,
        timeSlot: timeValue
      });
      state.visitContext = {
        visitId: res.visitId,
        zervaBookingId: zervaEl.value.trim(),
        visitDate,
        timeSlot: timeValue
      };
      state.resetVisitDraft();
      state.formType = null;
      state.serviceType = null;
      openServiceTypeModal();
    } catch (e) {
      console.warn("createVisit failed:", e);
      alert("สร้าง Visit ไม่สำเร็จ — เช็คสัญญาณอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง");
    } finally {
      continueBtn.disabled = false;
    }
  });

  onEnter("createVisit", () => {
    const c = state.currentCustomer;
    if (!c) { show("home"); return; }
    profileBox.innerHTML = `
      <div><b>${escapeHtml(c.fullName || c.nickname)}</b> (${escapeHtml(c.nickname || "-")})</div>
      <div class="muted small">${escapeHtml(c.customerId)} &nbsp;·&nbsp; ☎ ${escapeHtml(c.phoneDisplay || "-")}</div>
    `;
    zervaEl.value = "";
    dateEl.value = todayDateValue();
    customTimeEl.value = "";
    customTimeEl.hidden = true;
    selectedSlot = null;
    slotButtons.forEach((b) => b.classList.remove("is-selected"));
    customSlotBtn.classList.remove("is-selected");
    document.querySelectorAll(".field-error").forEach((el) => el.classList.remove("field-error"));
    continueBtn.disabled = false;
  });
}
</script>
<script>
// ==== js/screens/serviceType.js ====
let modalEl = null;
let closeTimer = null;

function getModal() {
  if (!modalEl) modalEl = document.getElementById("serviceTypeModal");
  return modalEl;
}

// เปิด modal เลือกฟอร์ม Consultation (Step 4) ทับหน้าจอปัจจุบัน — เรียกหลังสร้าง Visit (Step 3) เสร็จเสมอ
async function openServiceTypeModal() {
  const modal = getModal();
  if (!modal) return;
  const form3Btn = document.getElementById("chooseForm3Btn");
  // "เติมสีคิ้ว" (Form 3) ใช้ได้เฉพาะลูกค้าที่เคยมีประวัติเข้ารับบริการกับร้านมาก่อนหน้า Visit นี้เท่านั้น
  // เดิมเช็คแค่ "มี state.currentCustomer อยู่ไหม" ซึ่งจริงอยู่เสมอ (ทั้งลูกค้าใหม่/เก่า) ณ จุดนี้ของ flow
  // เลยไม่เคยซ่อนปุ่มนี้จริง ๆ เลยสักครั้ง — ต้องเช็คประวัติจริงจากเซิร์ฟเวอร์ ซ่อนไว้ก่อนเป็นค่า default
  // ระหว่างรอผลเช็ค กันโชว์ผิดช่วง loading
  form3Btn.hidden = true;
  clearTimeout(closeTimer);
  modal.hidden = false;
  requestAnimationFrame(() => modal.classList.add("is-open"));

  if (state.currentCustomer) {
    try {
      const history = await getHistoryByCustomer(state.currentCustomer.customerId);
      const currentVisitId = state.visitContext && state.visitContext.visitId;
      const hasPriorVisit = history.some((v) => v.serviceId !== currentVisitId && isCompletedBrowVisit(v));
      form3Btn.hidden = !hasPriorVisit;
    } catch (e) {
      // เช็คประวัติไม่สำเร็จ — ปลอดภัยไว้ก่อนด้วยการซ่อน Form 3 ต่อไป แทนที่จะเสี่ยงโชว์ผิด
    }
  }
}

function closeServiceTypeModal() {
  const modal = getModal();
  if (!modal || modal.hidden) return;
  modal.classList.remove("is-open");
  closeTimer = setTimeout(() => { modal.hidden = true; }, 220);
}

function initServiceType() {
  const modal = getModal();
  if (!modal) return;

  document.getElementById("serviceTypeCloseBtn").addEventListener("click", closeServiceTypeModal);

  // คลิกพื้นหลัง (backdrop) เพื่อปิด
  modal.addEventListener("click", (e) => {
    if (e.target === modal) closeServiceTypeModal();
  });

  // ปุ่ม Esc เพื่อปิด
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !modal.hidden) closeServiceTypeModal();
  });

  document.getElementById("chooseForm1Btn").addEventListener("click", () => {
    state.serviceType = "สักคิ้ว";
    state.formType = "form1";
    closeServiceTypeModal();
    show("form1");
  });

  document.getElementById("chooseForm2Btn").addEventListener("click", () => {
    state.serviceType = "สักคิ้ว";
    state.formType = "form2";
    closeServiceTypeModal();
    show("form2");
  });

  document.getElementById("chooseForm3Btn").addEventListener("click", () => {
    state.serviceType = "เติมสี";
    state.formType = "form3";
    closeServiceTypeModal();
    show("formTouchup");
  });
}
</script>

  bindFieldEvents(container, state.visitDraft, (changedRadioName) => {

function monthsSince(ts) {
  if (!ts) return "-";
  const months = Math.max(0, Math.round((Date.now() - ts) / (1000 * 60 * 60 * 24 * 30)));
  return `${months} เดือน`;
}

function row(label, value) {
  return `<div class="detail-row"><div class="detail-label">${escapeHtml(label)}</div><div class="detail-value">${escapeHtml(value || "-")}</div></div>`;
}

function photoBoxReadOnly(url) {

// ล่าสุด = Visit สักคิ้วที่ปิดเสร็จแล้วตัวล่าสุด (ใช้เป็นค่าเดิมสำหรับเติมสี)
async function loadHistoryCtx(customerId) {
  const history = await getHistoryByCustomer(customerId);
  const browVisits = history.filter(isCompletedBrowVisit);
  if (!browVisits.length) return null;
  const first = browVisits[browVisits.length - 1];
  const last = browVisits[0];
  return { first, last };
}
