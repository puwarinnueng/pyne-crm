<style>
@import url("https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Dancing+Script:wght@600&display=swap");

:root {
  --green-900: #6b4a30;
  --green-700: #8a6142;
  --green-50: #f3ede1;
  --amber-600: #b45309;
  --red-600: #b3261e;
  --gray-500: #6b7280;
  --gray-200: #e5e7eb;
  --border: #d9cfb8;
  --radius: 12px;
  --cream: #eeece0;
  --ink: #2c3345;

  --bg-page: #fbf9f4;
  --bg-white: #ffffff;
  --sidebar-w: 250px;
  --mobile-topbar-h: 58px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: "Sarabun", "Thonburi", "Noto Sans Thai", -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-page);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

#app { min-height: 100%; background: var(--bg-page); position: relative; }

/* จอกว้าง (แท็บเล็ต/เดสก์ท็อป): topbar ของหน้าย่อย (profile/forms) ชิดขอบบนสุดของ main-area ได้เลย เพราะ mobile topbar ถูกซ่อนไปแล้ว */
@media (min-width: 860px) {
  .topbar { top: 0; }
  .page-pad { max-width: 640px; margin: 0 auto; width: 100%; }
  .page-pad.center-col { max-width: 480px; }
}

/* จอแคบ: topbar ของหน้าย่อยต้องอยู่ใต้ mobile topbar ที่ sticky ค้างอยู่บนสุดแล้ว ไม่งั้นซ้อนทับกัน */
@media (max-width: 859px) {
  .topbar { top: var(--mobile-topbar-h); }
}

.screen { display: none; min-height: 100vh; flex-direction: column; }
.screen.active { display: flex; }

/* ===================== App shell: sidebar (desktop) + mobile topbar/hamburger ===================== */
.app-shell { display: flex; min-height: 100vh; background: var(--bg-page); }

.logo-pyne {
  font-family: "Playfair Display", Georgia, serif;
  font-style: italic; font-weight: 600; font-size: 26px; color: var(--green-900);
  display: block; line-height: 1;
}
.logo-studio {
  font-family: "Dancing Script", cursive;
  font-size: 17px; color: var(--green-700);
  display: block; margin-top: 2px; margin-left: 2px;
}

.sidebar {
  width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
  background: var(--bg-white); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 24px 18px;
  position: sticky; top: 0; height: 100vh;
}
.sidebar-logo {
  margin: -4px -18px 18px; padding: 18px 14px 16px;
  border-bottom: 1px solid var(--border); text-align: center;
}
.sidebar-logo .logo-pyne { font-size: 54px; line-height: .85; }
.sidebar-logo .logo-studio {
  font-size: 24px; display: block; margin: -8px 0 0 auto; width: fit-content;
  margin-right: 14%;
}
.sidebar-nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.sidebar-nav-item {
  display: flex; align-items: center; gap: 12px; padding: 11px 14px;
  border-radius: 10px; color: var(--ink); text-decoration: none;
  font-size: 14.5px; font-weight: 600; transition: background .15s, color .15s;
}
.sidebar-nav-item:hover { background: var(--green-50); }
.sidebar-nav-item.active { background: var(--green-900); color: #fff; }
.sidebar-nav-item .nav-icon { width: 19px; height: 19px; flex-shrink: 0; }
.sidebar-footer { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
.sidebar-copyright { font-size: 11.5px; color: #9a978c; padding: 10px 14px 0; }

.main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.mobile-topbar {
  display: none; align-items: center; justify-content: space-between;
  height: var(--mobile-topbar-h); padding: 0 16px; background: var(--bg-white);
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50;
}
.mobile-logo { display: flex; align-items: baseline; gap: 6px; }
.mobile-logo .logo-pyne { font-size: 21px; }
.mobile-logo .logo-studio { font-size: 14px; }
.hamburger-btn {
  background: none; border: none; color: var(--green-900); padding: 8px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.hamburger-btn svg { width: 24px; height: 24px; }
.mobile-dropdown {
  position: absolute; top: 100%; right: 12px; margin-top: 6px; width: 190px;
  background: var(--bg-white); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 10px 30px rgba(43,30,15,.15); padding: 6px; display: flex; flex-direction: column; gap: 2px;
}
.mobile-dropdown[hidden] { display: none; }
.mobile-dropdown-item {
  display: block; padding: 10px 12px; border-radius: 8px; color: var(--ink);
  text-decoration: none; font-size: 14px; font-weight: 600;
}
.mobile-dropdown-item.active { background: var(--green-900); color: #fff; }
.mobile-dropdown-item:not(.active):hover { background: var(--green-50); }

@media (max-width: 859px) {
  .sidebar { display: none; }
  .mobile-topbar { display: flex; }
}

.page-pad { padding: 18px 20px 100px; flex: 1; }
.center-col { display: flex; flex-direction: column; justify-content: center; gap: 16px; min-height: 60vh; }

/* Topbar */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 12px; background: var(--green-900); color: #fff;
  position: sticky; top: 0; z-index: 10;
}
.topbar-title { font-size: 16px; font-weight: 600; }
.icon-btn {
  background: none; border: none; color: #fff; font-size: 15px;
  padding: 8px 10px; cursor: pointer; min-width: 44px;
}
.step-indicator { font-size: 13px; color: #cfe9da; min-width: 44px; text-align: right; }

/* Gate screen */
.gate-wrap {
  max-width: 340px; margin: 15vh auto 0; padding: 0 24px; text-align: center;
}
.brand { font-size: 34px; color: var(--green-900); margin-bottom: 4px; font-weight: 700; }
.brand span { display: block; font-size: 13px; letter-spacing: 4px; color: var(--gray-500); font-weight: 400; }
.muted { color: #667; font-size: 13.5px; }
.muted.small { font-size: 11.5px; }
.mock-hint { margin-top: 18px; color: var(--amber-600); }

/* Inputs */
.input {
  width: 100%; padding: 13px 14px; font-size: 16px; border: 1.5px solid var(--border);
  border-radius: 10px; margin: 6px 0 14px; font-family: inherit; background: #fff;
}
.input:focus { outline: none; border-color: var(--green-900); }
.input-lg { text-align: center; font-size: 22px; letter-spacing: 6px; }
.textarea { min-height: 80px; resize: vertical; }
.field-label { display: block; font-size: 13px; font-weight: 600; color: var(--green-700); margin-top: 4px; }
select.input { -webkit-appearance: none; appearance: none; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  border: none; border-radius: 10px; font-size: 15.5px; font-weight: 600;
  padding: 14px 18px; cursor: pointer; font-family: inherit; text-align: center;
  transition: opacity .15s;
}
.btn:active { opacity: .75; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-block { display: flex; width: 100%; }
.btn-primary { background: var(--green-900); color: #fff; }
.btn-secondary { background: var(--gray-500); color: #fff; }
.btn-outline { background: #fff; color: var(--green-900); border: 1.5px solid var(--green-900); }
.btn-tall { flex-direction: column; padding: 20px; gap: 4px; }
.btn-sub { font-size: 11.5px; font-weight: 400; opacity: .85; }

.error-text { color: var(--red-600); font-size: 12.5px; margin: -8px 0 10px; }

/* กรอบแดงบนฟิลด์ที่ยังไม่ได้กรอก (ใช้แทน alert ตอนกดถัดไป/บันทึกแล้วข้อมูลไม่ครบ) */
.field-error { border: 1.5px solid var(--red-600) !important; border-radius: 10px; }
.field-error.radio-row, .field-error.choice-grid { padding: 8px; background: #fdf1f0; }
input.field-error, textarea.field-error { background: #fdf1f0; }

/* ===================== Customers page (dashboard-style list) ===================== */
.customers-page { padding: 28px 32px 60px; max-width: 1180px; }

.customers-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  flex-wrap: wrap; margin-bottom: 22px;
}
.page-title { font-family: "Playfair Display", Georgia, serif; font-size: 30px; font-weight: 600; color: var(--ink); margin: 0; }
.page-subtitle { color: var(--gray-500); font-size: 14px; margin: 4px 0 0; }

/* เดสก์ท็อป: หัวหน้า Customers ค้างอยู่บนสุดตอนเลื่อนดูตาราง (ไม่ไหลตาม content) — มือถือไม่แตะ ยังเลื่อนหายตามปกติ */
@media (min-width: 860px) {
  .customers-header {
    position: sticky; top: 0; z-index: 20; background: var(--bg-white);
    margin: -28px -32px 22px; padding: 24px 32px 20px;
    border-bottom: 1px solid var(--border);
  }
}

.search-bar-wrap { position: relative; margin-bottom: 20px; }
.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--gray-500); pointer-events: none; }
.search-input { margin: 0; padding-left: 42px; }

.customers-table-card {
  background: var(--bg-white); border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
}
.table-scroll { overflow-x: auto; }
.customers-table { width: 100%; border-collapse: collapse; min-width: 640px; }
.customers-table thead th {
  text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--gray-500); background: var(--green-50); padding: 14px 20px; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.customers-table tbody td { padding: 16px 20px; border-bottom: 1px solid #f0ede3; font-size: 14px; color: var(--ink); white-space: nowrap; }
.customers-table tbody tr:last-child td { border-bottom: none; }
.customers-table tbody tr:hover { background: var(--green-50); }
.cell-name { font-weight: 700; white-space: nowrap; }
.btn-link-view {
  background: none; border: 1.5px solid var(--border); color: var(--green-900); font-weight: 600;
  font-size: 13px; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-family: inherit;
}
.btn-link-view:hover { background: var(--green-50); }
.customers-table-card .empty-hint { padding: 40px 20px; }

@media (max-width: 640px) {
  .customers-page { padding: 20px 16px 60px; }
  .customers-header { flex-direction: column; align-items: stretch; }
  .customers-header .btn { width: 100%; }
}

.empty-hint { text-align: center; color: #999; padding: 30px 10px; font-size: 13.5px; }

/* Profile */
.profile-card {
  border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px;
  background: var(--green-50);
}
.profile-card .pname { font-size: 18px; font-weight: 700; color: var(--green-900); }
.profile-card .pmeta { font-size: 13px; color: #556; margin-top: 4px; }
.section-title { font-size: 14px; color: var(--green-700); margin: 20px 0 8px; }
.history-list { display: flex; flex-direction: column; gap: 10px; }
.history-item { border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; background: #fff; }
.history-item:active { background: var(--green-50); }
.history-item .htype {
  display: inline-block; font-size: 11px; font-weight: 700; color: #fff;
  background: var(--green-900); padding: 2px 8px; border-radius: 999px; margin-bottom: 6px;
}
.history-item .htype.touchup { background: var(--amber-600); }
.history-item .hdate { font-size: 12px; color: #667; float: right; }
.history-item .hdetail { font-size: 12.5px; color: #444; margin-top: 4px; }

/* Duplicate warning banner */
.dup-warning {
  background: #fff3e0; border: 1.5px solid var(--amber-600); border-radius: 10px;
  padding: 12px 14px; margin: 10px 0; font-size: 13px;
}
.dup-warning button { margin-top: 8px; }

/* หัวข้อใหญ่คั่นแต่ละส่วนของฟอร์ม (ตรงตามหัวข้อใน Jotform ต้นฉบับ) */
.form-section-title {
  font-size: 19px; font-weight: 700; color: var(--ink); margin: 30px 0 14px;
  padding-bottom: 10px; border-bottom: 1.5px solid var(--border);
}
.form-section-title:first-of-type { margin-top: 4px; }

/* Multi-step form */
.step-group { margin-bottom: 20px; }
.step-group-title { font-size: 14px; font-weight: 700; color: var(--green-900); margin-bottom: 10px; }
.required-star { color: var(--red-600); }
.choice-grid, .radio-row { display: flex; flex-direction: column; gap: 2px; margin-bottom: 14px; }
.native-choice {
  display: flex; align-items: center; gap: 10px; padding: 9px 4px;
  font-size: 14px; cursor: pointer; user-select: none;
}
.native-choice input[type="radio"], .native-choice input[type="checkbox"] {
  width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--green-900); cursor: pointer;
}
.native-choice:has(input:checked) span { color: var(--green-900); font-weight: 700; }
.other-input { margin: -4px 0 8px 32px; width: calc(100% - 32px); }

/* Consent */
.consent-block {
  background: #fffdf5; border: 1px solid #e8dfba; border-left: 4px solid var(--amber-600);
  border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; font-size: 13px; line-height: 1.6;
}
.consent-block .src { font-size: 11px; color: #92700f; font-weight: 700; margin-bottom: 6px; }
.intensity-option {
  display: flex; align-items: flex-start; gap: 10px;
  border: 1.5px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; font-size: 13px; cursor: pointer;
}
.intensity-option input[type="radio"] { width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px; accent-color: var(--green-900); cursor: pointer; }
.intensity-option:has(input:checked) { border-color: var(--green-900); background: var(--green-50); }
.agree-row { display: flex; align-items: flex-start; gap: 10px; margin: 16px 0; font-size: 13px; }
.agree-row input { width: 20px; height: 20px; margin-top: 2px; }

/* Signature pad */
.sig-wrap { border: 1.5px dashed var(--border); border-radius: 10px; overflow: hidden; margin: 10px 0; background: #fff; }
.sig-wrap canvas { display: block; width: 100%; height: 180px; touch-action: none; }
.sig-actions { display: flex; justify-content: flex-end; padding: 6px 10px; background: #fafafa; }
.sig-actions button { background: none; border: none; color: var(--green-700); font-size: 12.5px; }

/* Static technician signature (fixed image, not a live pad) */
.tech-sig-wrap {
  border: 1.5px solid var(--border); border-radius: 10px; overflow: hidden; margin: 10px 0;
  background: #fff; display: flex; align-items: center; justify-content: center; padding: 10px;
}
.tech-sig-wrap img { max-width: 220px; width: 100%; height: auto; display: block; }

/* Photo capture */
.photo-row { display: flex; gap: 12px; margin: 10px 0; }
.photo-slot {
  flex: 1; aspect-ratio: 1; border: 1.5px dashed var(--border); border-radius: 10px;
  display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: #fafafa;
}
.photo-slot img { width: 100%; height: 100%; object-fit: cover; }
.photo-slot label {
  display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: #667; cursor: pointer;
}
.photo-slot input[type=file] { display: none; }
.photo-label { text-align: center; font-size: 12px; color: var(--green-700); font-weight: 600; margin-top: 4px; }

/* Footer actions */
.footer-actions {
  position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--border);
  padding: 12px 20px; padding-bottom: max(12px, env(safe-area-inset-bottom));
}

/* Confirmation */
.confirm-wrap { max-width: 360px; margin: 12vh auto 0; padding: 0 24px; text-align: center; }
.confirm-check {
  width: 64px; height: 64px; border-radius: 50%; background: var(--green-900); color: #fff;
  font-size: 30px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
}

.box-quiet { background: var(--green-50); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 12.5px; margin-bottom: 14px; }

/* หน้ารายละเอียดประวัติ (อ่านอย่างเดียว) */
.detail-row { padding: 8px 0; border-bottom: 1px solid var(--border); }
.detail-row:last-child { border-bottom: none; }
.detail-label { font-size: 12px; color: var(--green-700); font-weight: 600; }
.detail-value { font-size: 14px; color: var(--ink); margin-top: 2px; white-space: pre-wrap; }
.photo-slot-sig { aspect-ratio: auto; height: 90px; background: #fff; }
.photo-slot-sig img { object-fit: contain; }
.draft-badge {
  display: inline-block; background: var(--amber-600); color: #fff; font-size: 11px;
  padding: 3px 10px; border-radius: 999px; margin-bottom: 12px;
}

@media (min-width: 600px) {
  .page-pad { padding-left: 32px; padding-right: 32px; }
}

</style>
