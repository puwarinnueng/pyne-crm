<style>
/* =====================================================================
   DESIGN TOKENS — PYNE CRM DEV STYLE GUIDE (source of truth)
   Native Apple system UI only. No Google Fonts / custom font files.
   EN → San Francisco · TH → system Thai (Thonburi on iPadOS)
   ===================================================================== */

:root {
  /* ---- Color — core ---- */
  --ivory: #F8F3EC;
  --paper-sand: #F0ECE4;
  --white: #FEFEFE;
  --greige: #E8E3DB;
  --soft-bronze: #BD9C8A;
  --pyne-gold: #A58672;
  --deep-bronze: #866957;
  --espresso: #5E4737;
  --espresso-ink: #261F1C;
  --soft-charcoal: #3A322D;
  --muted-taupe: #8A7D70;
  --hairline: #DFD8CE;

  /* ---- Color — semantic ---- */
  --success-bg: #EAEFE6; --success-text: #5F7052;
  --warning-bg: #FBF0E4; --warning-text: #96591F;
  --error-bg:   #FDECEA; --error-text:   #C4302A;
  --info-bg:    #EAF0F5; --info-text:    #4A6884;
  --row-selected: #F3E9E1;

  /* ---- Role aliases ---- */
  --bg-page: var(--ivory);
  --bg-alt: var(--paper-sand);
  --bg-white: var(--white);
  --border: var(--hairline);
  --ink: var(--espresso-ink);
  --heading: var(--soft-charcoal);
  --text-secondary: var(--muted-taupe);
  --disabled-bg: var(--greige);
  --disabled-text: var(--muted-taupe);
  --destructive: var(--error-text);

  /* ---- Type scale (never weight > 600) ---- */
  --fs-display: 28px; --lh-display: 34px; --fw-display: 500;
  --fs-h1: 22px; --lh-h1: 28px; --fw-h1: 600;
  --fs-h2: 16px; --lh-h2: 22px; --fw-h2: 600;
  --fs-h3: 13px; --lh-h3: 18px; --fw-h3: 500;
  --fs-body: 13px; --lh-body: 20px; --fw-body: 400;
  --fs-body-sm: 12px; --lh-body-sm: 18px; --fw-body-sm: 400;
  --fs-caption: 11px; --lh-caption: 16px; --fw-caption: 400;
  --fs-label: 11px; --lh-label: 14px; --fw-label: 500; --tr-label: .06em;
  --fs-button: 13px; --lh-button: 16px; --fw-button: 500;

  /* ---- Spacing (4px base) ---- */
  --sp-4: 4px; --sp-8: 8px; --sp-12: 12px; --sp-16: 16px;
  --sp-24: 24px; --sp-32: 32px; --sp-48: 48px; --sp-64: 64px;

  /* ---- Radius & elevation ---- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-pill: 999px;
  --shadow: 0 2px 8px rgba(38, 31, 28, .08);
  --focus-ring: 0 0 0 3px rgba(165, 134, 114, .18);
  --overlay: rgba(38, 31, 28, .36);
  --overlay-soft: rgba(38, 31, 28, .30);

  /* ---- Font — Apple system UI only ---- */
  --font-ui: -apple-system, BlinkMacSystemFont, sans-serif;

  --sidebar-w: 250px;
  --mobile-topbar-h: 56px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-page);
  color: var(--ink);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  font-weight: var(--fw-body);
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea {
  font-family: inherit;
}

/* ---- Spacing / layout helpers (prefer classes over inline styles) ---- */
.mt-4  { margin-top: var(--sp-4)  !important; }
.mt-8  { margin-top: var(--sp-8)  !important; }
.mt-12 { margin-top: var(--sp-12) !important; }
.mt-16 { margin-top: var(--sp-16) !important; }
.ml-8  { margin-left: var(--sp-8) !important; }
.text-center { text-align: center; }
.row-actions { display: flex; gap: var(--sp-12); margin-top: var(--sp-12); }
.row-actions .btn { flex: 1; }
.icon-btn--flush { padding-left: 0; }
.draft-badge--inline { margin: 0 0 0 var(--sp-8); }

/* ---- Typography utilities (scale from style guide) ---- */
.type-display { font-size: var(--fs-display); line-height: var(--lh-display); font-weight: var(--fw-display); color: var(--heading); }
.type-h1 { font-size: var(--fs-h1); line-height: var(--lh-h1); font-weight: var(--fw-h1); color: var(--heading); }
.type-h2 { font-size: var(--fs-h2); line-height: var(--lh-h2); font-weight: var(--fw-h2); color: var(--heading); }
.type-h3 { font-size: var(--fs-h3); line-height: var(--lh-h3); font-weight: var(--fw-h3); color: var(--heading); }
.type-body { font-size: var(--fs-body); line-height: var(--lh-body); font-weight: var(--fw-body); color: var(--ink); }
.type-body-sm { font-size: var(--fs-body-sm); line-height: var(--lh-body-sm); font-weight: var(--fw-body-sm); color: var(--ink); }
.type-caption { font-size: var(--fs-caption); line-height: var(--lh-caption); font-weight: var(--fw-caption); color: var(--text-secondary); }
.type-label {
  font-size: var(--fs-label); line-height: var(--lh-label); font-weight: var(--fw-label);
  letter-spacing: var(--tr-label); text-transform: uppercase; color: var(--deep-bronze);
}

#app { min-height: 100%; background: var(--bg-page); position: relative; }

/* จอกว้าง (แท็บเล็ต/เดสก์ท็อป): topbar ของหน้าย่อย (profile/forms) ชิดขอบบนสุดของ main-area ได้เลย เพราะ mobile topbar ถูกซ่อนไปแล้ว */
@media (min-width: 1024px) {
  .topbar { top: 0; padding-left: var(--sp-32); padding-right: var(--sp-32); }
  .page-pad { max-width: 640px; margin: 0 auto; width: 100%; }
  .page-pad.center-col { max-width: 480px; }
}

/* จอแคบ: topbar ของหน้าย่อยต้องอยู่ใต้ mobile topbar ที่ sticky ค้างอยู่บนสุดแล้ว ไม่งั้นซ้อนทับกัน */
@media (max-width: 1023px) {
  .topbar { top: var(--mobile-topbar-h); }
}

.screen { display: none; min-height: 100vh; flex-direction: column; }
.screen.active { display: flex; }

/* ===================== App shell: sidebar (desktop) + mobile topbar/hamburger ===================== */
.app-shell { display: flex; width: 100%; min-height: 100dvh; background: var(--bg-page); }

/* โลโก้ข้อความ (fallback ถ้าไม่มีรูป) — ใช้ system font ตาม UI type scale ไม่โหลดฟอนต์แบรนด์แยก */
.logo-pyne {
  font-family: inherit;
  font-style: normal; font-weight: 600; font-size: 26px; color: var(--espresso);
  display: block; line-height: 1;
}
.logo-studio {
  font-family: inherit;
  font-size: 16px; font-weight: 500; color: var(--deep-bronze);
  display: block; margin-top: var(--sp-4); margin-left: var(--sp-4);
}
.logo-img { display: block; width: 100%; height: auto; object-fit: contain; }

.sidebar {
  width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
  background: var(--bg-white); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: var(--sp-24) var(--sp-16);
  position: sticky; top: 0; height: 100vh;
}
.sidebar-logo {
  margin: calc(var(--sp-4) * -1) calc(var(--sp-16) * -1) var(--sp-16); padding: var(--sp-16) var(--sp-12);
  border-bottom: 1px solid var(--border); text-align: center;
}
.sidebar-logo .logo-pyne { font-size: 54px; line-height: .85; }
.sidebar-logo .logo-studio {
  font-size: 24px; display: block; margin: -8px 0 0 auto; width: fit-content;
  margin-right: 14%;
}
.sidebar-logo .logo-img { max-width: 150px; margin: 0 auto; }
.sidebar-nav { display: flex; flex-direction: column; gap: var(--sp-4); flex: 1; }
.sidebar-nav-item {
  display: flex; align-items: center; gap: var(--sp-12); padding: var(--sp-12) var(--sp-16);
  border-radius: var(--radius-md); color: var(--ink); text-decoration: none;
  min-height: 48px; font-size: var(--fs-body); font-weight: 600;
  transition: background .15s, color .15s, transform .15s;
}
.sidebar-nav-item:hover { background: var(--bg-alt); transform: translateX(2px); }
.sidebar-nav-item.active { background: var(--deep-bronze); color: var(--white); }
.sidebar-nav-item .nav-icon { width: 19px; height: 19px; flex-shrink: 0; }
.sidebar-footer { border-top: 1px solid var(--border); padding-top: var(--sp-12); margin-top: var(--sp-12); }
.sidebar-copyright { font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--text-secondary); padding: var(--sp-8) var(--sp-16) 0; }
.user-menu { position: relative; }
.sidebar-user {
  display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-8); width: 100%;
  border: none; background: transparent; text-align: left; font: inherit;
  border-radius: var(--radius-md); cursor: pointer; transition: background .15s;
}
.sidebar-user:hover { background: var(--bg-alt); }
.user-menu.is-open .sidebar-user { background: var(--bg-alt); }
.user-menu.is-open .sidebar-user-chevron { transform: rotate(180deg); }
.sidebar-user-chevron { transition: transform .18s ease; }

.user-menu-popover {
  position: absolute; left: 0; right: 0; bottom: calc(100% + var(--sp-8));
  background: var(--bg-white); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow);
  padding: var(--sp-8); z-index: 60;
  transform-origin: bottom center; animation: userMenuIn .16s ease;
}
@keyframes userMenuIn {
  from { opacity: 0; transform: translateY(6px) scale(.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.user-menu-item {
  display: flex; align-items: center; gap: var(--sp-8); width: 100%;
  padding: var(--sp-8) var(--sp-12); border: none; background: transparent; cursor: pointer;
  border-radius: var(--radius-md); font: inherit; font-size: var(--fs-body-sm); line-height: var(--lh-body-sm); color: var(--ink);
  text-align: left; transition: background .12s;
}
.user-menu-item:hover { background: var(--bg-alt); }
.user-menu-item svg { width: 17px; height: 17px; flex: 0 0 auto; color: var(--muted-taupe); }
.user-menu-item-danger { color: var(--error-text); }
.user-menu-item-danger svg { color: var(--error-text); }
.user-menu-item-danger:hover { background: var(--error-bg); }
.sidebar-user-avatar {
  flex: 0 0 36px; width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--deep-bronze); color: var(--white); font-weight: 600; font-size: var(--fs-h3);
}
.sidebar-user-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.sidebar-user-name { font-size: var(--fs-body-sm); font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-user-role { font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--text-secondary); }
.sidebar-user-chevron { width: 16px; height: 16px; color: var(--muted-taupe); flex: 0 0 auto; }

.main-area { flex: 1 1 auto; min-width: 0; width: 0; display: flex; flex-direction: column; }

.mobile-topbar {
  display: none; align-items: center; justify-content: space-between;
  height: var(--mobile-topbar-h); padding: 0 var(--sp-16); background: var(--bg-white);
  border-bottom: 1px solid var(--border); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 50;
}
.mobile-logo { display: flex; align-items: center; gap: var(--sp-8); }
.mobile-logo .logo-pyne { font-size: 21px; }
.mobile-logo .logo-studio { font-size: 14px; }
.mobile-logo .logo-img { width: auto; height: 30px; }
.hamburger-btn {
  background: var(--bg-alt); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--deep-bronze); padding: var(--sp-8);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.hamburger-btn svg { width: 24px; height: 24px; }
.mobile-dropdown {
  position: fixed; inset: 0 0 0 auto; z-index: 101; margin: 0; width: min(360px, 88vw);
  background: var(--bg-white); border-left: 1px solid var(--border); border-radius: var(--radius-lg) 0 0 var(--radius-lg);
  box-shadow: var(--shadow); padding: max(var(--sp-24), env(safe-area-inset-top)) var(--sp-16) var(--sp-24);
  display: flex; flex-direction: column; gap: var(--sp-8); transform: translateX(100%);
  transition: transform .22s ease-out;
}
.mobile-dropdown[hidden] { display: none; }
.mobile-dropdown.is-open { transform: translateX(0); }
.mobile-menu-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-12); }
.mobile-menu-title { color: var(--ink); font-size: var(--fs-h1); line-height: var(--lh-h1); font-weight: var(--fw-h1); }
.mobile-menu-close {
  width: 44px; height: 44px; border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--bg-alt); color: var(--deep-bronze); cursor: pointer; font-size: 30px; line-height: 1;
}
.mobile-dropdown-item {
  display: block; min-height: 52px; padding: var(--sp-16); border-radius: var(--radius-md); color: var(--ink);
  text-decoration: none; font-size: var(--fs-h2); line-height: var(--lh-h2); font-weight: 600;
}
.mobile-dropdown-item.active { background: var(--deep-bronze); color: var(--white); }
.mobile-dropdown-item:not(.active):hover { background: var(--bg-alt); }
/* กล่องโปรไฟล์ท้ายเมนูมือถือ (Reset password / Log out) */
.mobile-menu-account {
  margin-top: auto; padding-top: var(--sp-16); border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: var(--sp-8);
}
.mobile-account-user {
  display: flex; align-items: center; gap: var(--sp-12); padding: var(--sp-8) var(--sp-4) var(--sp-12);
}
.mobile-account-user .sidebar-user-avatar { flex: 0 0 42px; width: 42px; height: 42px; font-size: var(--fs-h2); }
.mobile-account-user .sidebar-user-name { font-size: var(--fs-h3); }
.mobile-account-user .sidebar-user-role { font-size: var(--fs-caption); }
.mobile-account-item {
  display: flex; align-items: center; gap: var(--sp-12); width: 100%;
  min-height: 50px; padding: var(--sp-12) var(--sp-16); border: none; background: transparent;
  border-radius: var(--radius-md); cursor: pointer; font: inherit; font-size: var(--fs-h3); font-weight: 600;
  color: var(--ink); text-align: left;
}
.mobile-account-item:hover { background: var(--bg-alt); }
.mobile-account-item svg { width: 19px; height: 19px; flex: 0 0 auto; color: var(--muted-taupe); }
.mobile-account-item-danger { color: var(--error-text); }
.mobile-account-item-danger svg { color: var(--error-text); }
.mobile-account-item-danger:hover { background: var(--error-bg); }

.mobile-menu-overlay {
  position: fixed; inset: 0; z-index: 100; background: var(--overlay);
  opacity: 0; transition: opacity .22s ease-out;
}
.mobile-menu-overlay[hidden] { display: none; }
.mobile-menu-overlay.is-visible { opacity: 1; }

/* iPad portrait and phones share a familiar, touch-friendly top navigation. */
@media (max-width: 1023px) {
  .sidebar { display: none; }
  .mobile-topbar { display: flex; }
}

.page-pad { padding: var(--sp-16) var(--sp-16) 100px; flex: 1; }
.center-col { display: flex; flex-direction: column; justify-content: center; gap: var(--sp-16); min-height: 60vh; }

/* Topbar — ปุ่มกลับแยกชั้นอยู่เหนือหัวข้อ ไม่ใช่แถบสีทึบเต็มความกว้างแบบเดิม */
.topbar {
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-8);
  padding: var(--sp-12) var(--sp-16); background: var(--bg-white); color: var(--ink);
  position: sticky; top: 0; z-index: 10;
  border-bottom: 1px solid var(--border); box-shadow: var(--shadow);
}
.topbar-title { font-size: var(--fs-h1); line-height: var(--lh-h1); font-weight: var(--fw-h1); color: var(--heading); margin: 0; }
.back-link {
  display: inline-flex; align-items: center; gap: var(--sp-4);
  background: none; border: none; color: var(--deep-bronze);
  font-size: var(--fs-body-sm); font-weight: 600; font-family: inherit;
  padding: var(--sp-8) var(--sp-8) var(--sp-8) var(--sp-4); margin-left: calc(var(--sp-8) * -1); border-radius: var(--radius-md);
  cursor: pointer; transition: background .15s, color .15s;
}
.back-link:hover { background: var(--bg-alt); color: var(--espresso); }
/* alias เผื่อยังมี markup เก่าใช้ .icon-btn อยู่ */
.icon-btn {
  background: none; border: none; color: var(--deep-bronze); font-size: var(--fs-body-sm);
  font-weight: 600; padding: var(--sp-8) var(--sp-12); cursor: pointer; font-family: inherit;
}
.step-indicator { font-size: var(--fs-body-sm); line-height: var(--lh-body-sm); color: var(--deep-bronze); }

.muted { color: var(--text-secondary); font-size: var(--fs-body-sm); }
.muted.small { font-size: var(--fs-caption); }

/* Inputs */
.input {
  width: 100%; padding: var(--sp-12) var(--sp-12); font-size: 16px; border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); margin: var(--sp-4) 0 var(--sp-16); font-family: inherit; background: var(--white);
  color: var(--ink); transition: border-color .15s, box-shadow .15s;
}
.input:focus {
  outline: none; border-color: var(--pyne-gold); border-width: 1.5px;
  box-shadow: var(--focus-ring);
}
.input-lg { text-align: center; font-size: var(--fs-h1); letter-spacing: var(--sp-8); }
.textarea { min-height: 80px; resize: vertical; }
.field-label {
  display: block; font-size: var(--fs-label); line-height: var(--lh-label); font-weight: var(--fw-label);
  letter-spacing: var(--tr-label); text-transform: uppercase; color: var(--deep-bronze); margin-top: var(--sp-4);
}
select.input { -webkit-appearance: none; appearance: none; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  border: none; border-radius: var(--radius-md); font-size: var(--fs-button); line-height: var(--lh-button); font-weight: var(--fw-button);
  min-height: 46px; padding: var(--sp-12) var(--sp-16); cursor: pointer; font-family: inherit; text-align: center;
  transition: background .15s, color .15s, transform .15s;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:disabled { cursor: not-allowed; }
.btn-block { display: flex; width: 100%; }
.btn[hidden] { display: none; } /* .btn ตั้ง display:inline-flex ทับ default [hidden] ของเบราว์เซอร์ */

/* Button · Primary */
.btn-primary { background: var(--deep-bronze); color: var(--white); }
.btn-primary:hover:not(:disabled) { background: var(--espresso); }
.btn-primary:disabled { background: var(--disabled-bg); color: var(--disabled-text); }

/* Button · Secondary (neutral surface — same palette) */
.btn-secondary { background: var(--greige); color: var(--espresso-ink); }
.btn-secondary:hover:not(:disabled) { background: var(--soft-bronze); color: var(--white); }
.btn-secondary:disabled { background: var(--disabled-bg); color: var(--disabled-text); }

/* Button · Ghost */
.btn-outline { background: transparent; color: var(--deep-bronze); border: 1px solid var(--pyne-gold); }
.btn-outline:hover:not(:disabled) { background: var(--bg-alt); }
.btn-outline:disabled { color: var(--disabled-text); border-color: var(--hairline); }

/* Button · Destructive */
.btn-destructive { background: var(--destructive); color: var(--white); }
.btn-destructive:hover:not(:disabled) { background: var(--espresso); }
.btn-destructive:disabled { background: var(--disabled-bg); color: var(--disabled-text); }

.btn-tall { flex-direction: column; padding: var(--sp-16); gap: var(--sp-4); }
.btn-sub { font-size: var(--fs-caption); line-height: var(--lh-caption); font-weight: 400; opacity: .85; }

/* ===================== Service type — การ์ดเลือกบริการ ===================== */
.choose-lead { color: var(--text-secondary); font-size: var(--fs-body); line-height: var(--lh-body); margin: var(--sp-8) var(--sp-4) var(--sp-24); }
.service-choices { display: flex; flex-direction: column; gap: var(--sp-12); }
.service-card {
  display: flex; align-items: center; gap: var(--sp-16); width: 100%; text-align: left;
  background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--sp-16); cursor: pointer; font-family: inherit;
  box-shadow: var(--shadow);
  transition: transform .15s, border-color .15s;
}
.service-card:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--deep-bronze); }
.service-card:active:not(:disabled) { transform: translateY(0); }
.service-card:disabled { cursor: not-allowed; }
.service-card.is-muted { opacity: .46; }
.service-card.is-loading {
  border-color: var(--deep-bronze);
  background: var(--bg-white);
}
.service-card[hidden] { display: none; }
.service-card-icon {
  flex: 0 0 52px; width: 52px; height: 52px; border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-alt); color: var(--deep-bronze);
}
.service-card-icon svg { width: 26px; height: 26px; }
.service-card-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-4); }
.service-card-title { font-size: var(--fs-h3); line-height: var(--lh-h3); font-weight: var(--fw-h3); color: var(--heading); }
.service-card-sub { font-size: var(--fs-body-sm); line-height: var(--lh-body-sm); color: var(--text-secondary); }
.service-card-arrow {
  flex: 0 0 auto; color: var(--deep-bronze); font-size: 26px; line-height: 1;
  transition: transform .15s;
}
.service-card:hover:not(:disabled) .service-card-arrow { transform: translateX(3px); }
.service-card.is-loading .service-card-arrow {
  width: 18px; height: 18px; border: 2px solid var(--border);
  border-top-color: var(--deep-bronze); border-radius: 50%;
  color: transparent; font-size: 0; animation: spin .8s linear infinite;
}

/* ===================== Glass modal (เลือกประเภทบริการ) ===================== */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  display: flex; align-items: center; justify-content: center; padding: var(--sp-16);
  background: var(--overlay-soft);
  backdrop-filter: blur(8px) saturate(120%);
  -webkit-backdrop-filter: blur(8px) saturate(120%);
  opacity: 0; transition: opacity .22s ease;
}
.modal-overlay.is-open { opacity: 1; }
.modal-overlay[hidden] { display: none; }

.glass-modal {
  position: relative; width: min(460px, 100%);
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: var(--sp-32) var(--sp-24) var(--sp-24);
  transform: translateY(16px) scale(.97);
  transition: transform .26s cubic-bezier(.2,.8,.2,1);
}
.modal-overlay.is-open .glass-modal { transform: translateY(0) scale(1); }
.glass-modal-title {
  font-size: var(--fs-h1); line-height: var(--lh-h1); font-weight: var(--fw-h1);
  color: var(--heading); margin: 0 0 var(--sp-4); text-align: center;
}
.glass-modal-sub { text-align: center; color: var(--text-secondary); font-size: var(--fs-body-sm); line-height: var(--lh-body-sm); margin: 0 0 var(--sp-24); }
.glass-modal-close {
  position: absolute; top: var(--sp-12); right: var(--sp-12); width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--bg-alt); color: var(--deep-bronze);
  font-size: 22px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: background .15s;
}
.glass-modal-close:hover { background: var(--greige); }

/* การ์ดในกล่องโมดัลใช้โทนพื้นรองเข้าธีมเดียวกับพื้นหลังหลัก */
.glass-modal .service-choices { gap: var(--sp-12); }
.glass-modal .service-card {
  background: var(--bg-page); border-color: var(--border); box-shadow: none;
}
.glass-modal .service-card:hover {
  background: var(--bg-white); border-color: var(--deep-bronze);
  box-shadow: var(--shadow);
}
.glass-modal .service-card:hover:disabled { box-shadow: none; }
.glass-modal .service-card-icon { background: var(--bg-white); }

@keyframes spin { to { transform: rotate(360deg); } }

.error-text { color: var(--error-text); font-size: var(--fs-caption); line-height: var(--lh-caption); margin: calc(var(--sp-8) * -1) 0 var(--sp-8); }

/* กรอบแดงบนฟิลด์ที่ยังไม่ได้กรอก (ใช้แทน alert ตอนกดถัดไป/บันทึกแล้วข้อมูลไม่ครบ) */
.field-error { border: 1.5px solid var(--error-text) !important; border-radius: var(--radius-sm); }
.field-error.radio-row, .field-error.choice-grid, .field-error.mix-ratio-grid { padding: var(--sp-8); background: var(--error-bg); }
input.field-error, textarea.field-error { background: var(--error-bg); }

/* ===================== Customers page (dashboard-style list) ===================== */
/* Page header (title + subtitle) — แถบหัวหน้า Customers */
.page-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-16);
  padding: var(--sp-24) clamp(var(--sp-24), 3vw, var(--sp-48));
  background: var(--bg-white); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.page-title { font-size: var(--fs-display); line-height: var(--lh-display); font-weight: var(--fw-display); color: var(--heading); margin: 0; }
.page-subtitle { color: var(--text-secondary); font-size: var(--fs-body-sm); line-height: var(--lh-body-sm); margin: var(--sp-8) 0 0; }

.customers-page {
  width: 100%;
  padding: clamp(var(--sp-24), 2.5vw, var(--sp-32)) clamp(var(--sp-24), 3vw, var(--sp-48)) var(--sp-64);
}

.toolbar-row { display: flex; align-items: center; gap: var(--sp-12); margin-bottom: var(--sp-24); }
.search-bar-wrap { position: relative; flex: 1; min-width: 0; }
.search-icon { position: absolute; left: var(--sp-16); top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted-taupe); pointer-events: none; }
.search-input { margin: 0; padding-left: var(--sp-48); border-radius: var(--radius-pill); background: var(--bg-white); }
.toolbar-row .btn-primary { flex: 0 0 auto; border-radius: var(--radius-pill); white-space: nowrap; }

.customers-summary { font-size: var(--fs-body-sm); line-height: var(--lh-body-sm); color: var(--text-secondary); margin: 0 var(--sp-4) var(--sp-16); }
.customers-summary strong { color: var(--ink); font-weight: 600; }
.customers-summary .dot { margin: 0 var(--sp-8); color: var(--hairline); }

.customers-table-card {
  background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius-md);
  box-shadow: var(--shadow);
  /* อย่าใช้ overflow:hidden — จะตัด dropdown Actions ของแต่ละแถว */
  overflow: visible;
}
.table-scroll { overflow-x: auto; overflow-y: visible; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; }
.customers-table { width: 100%; border-collapse: collapse; min-width: 760px; }
.customers-table thead th {
  text-align: left; font-size: var(--fs-label); line-height: var(--lh-label); font-weight: var(--fw-label);
  letter-spacing: var(--tr-label); text-transform: uppercase;
  color: var(--deep-bronze); background: var(--bg-alt); padding: var(--sp-16) var(--sp-24); border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.customers-table tbody td { padding: var(--sp-16) var(--sp-24); border-bottom: 1px solid var(--border); font-size: var(--fs-body-sm); line-height: var(--lh-body-sm); color: var(--ink); white-space: nowrap; vertical-align: middle; }
.customers-table tbody tr { transition: background .12s; cursor: pointer; }
.customers-table tbody tr:focus-visible { outline: 2px solid var(--pyne-gold); outline-offset: -2px; }
.customers-table tbody tr:last-child td { border-bottom: none; }
.customers-table tbody tr:hover { background: var(--bg-alt); }
.customers-table tbody tr.is-selected { background: var(--row-selected); box-shadow: inset 2px 0 0 0 var(--pyne-gold); }
.th-actions, .cell-actions { text-align: right; width: 1%; vertical-align: middle; }
.row-menu { position: relative; display: inline-flex; justify-content: flex-end; }

.row-menu-trigger {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; padding: 0; border-radius: var(--radius-sm);
  border: 1px solid transparent; background: transparent; color: var(--muted-taupe);
  cursor: pointer; transition: background .12s, border-color .12s, color .12s;
}
.row-menu-trigger:hover,
.row-menu.is-open .row-menu-trigger {
  background: var(--bg-alt); border-color: var(--border); color: var(--ink);
}
.row-menu-trigger svg { width: 16px; height: 16px; display: block; }

.row-menu-popover {
  position: fixed; z-index: 200;
  min-width: 168px; padding: var(--sp-8);
  background: var(--bg-white); border: 1px solid var(--border);
  border-radius: var(--radius-md); box-shadow: var(--shadow);
}
.row-menu-popover[hidden] { display: none !important; }

.row-menu-item {
  display: flex; align-items: center; gap: var(--sp-8); width: 100%;
  height: 38px; padding: 0 var(--sp-12); margin: 0;
  border: none; background: transparent; cursor: pointer;
  border-radius: var(--radius-sm); font: inherit; font-size: var(--fs-body-sm); line-height: var(--lh-body-sm); font-weight: 500;
  color: var(--ink); text-align: left; white-space: nowrap;
  transition: background .12s;
}
.row-menu-item:hover { background: var(--bg-alt); }
.row-menu-item svg {
  width: 16px !important; height: 16px !important;
  max-width: 16px; max-height: 16px;
  flex: 0 0 16px; color: var(--muted-taupe); display: block;
}

/* Customer cell: avatar + name + note */
.cell-customer { display: flex; align-items: center; gap: var(--sp-12); }
.avatar {
  flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-alt); color: var(--deep-bronze); font-weight: 600; font-size: var(--fs-body-sm);
}
.cust-meta { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
.cust-name { font-weight: 600; color: var(--ink); }
.cust-sub { font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--text-secondary); }

/* Icon-prefixed cells (phone / line / last visit) */
.cell-ico { display: inline-flex; align-items: center; gap: var(--sp-8); color: var(--ink); }
.cell-ic { width: 15px; height: 15px; color: var(--soft-bronze); flex: 0 0 auto; }
.cell-empty { color: var(--text-secondary); }

/* Visits with star */
.cell-visits { display: inline-flex; align-items: center; gap: var(--sp-8); color: var(--ink); }
.cell-visits strong { color: var(--ink); font-weight: 600; }
.cell-star { width: 15px; height: 15px; color: var(--warning-text); flex: 0 0 auto; }

.customers-table-card .empty-hint { padding: var(--sp-32) var(--sp-16); }

@media (max-width: 1023px) {
  .page-header { padding: var(--sp-16); position: static; }
  .customers-page { padding: var(--sp-16) var(--sp-16) var(--sp-64); }
}

@media (max-width: 599px) {
  .toolbar-row { flex-direction: column; align-items: stretch; }
  .toolbar-row .btn-primary { width: 100%; }
}

/* Clear keyboard focus is essential for external keyboards and accessibility. */
.btn:focus-visible, .hamburger-btn:focus-visible, .sidebar-nav-item:focus-visible,
.mobile-dropdown-item:focus-visible, .input:focus-visible, .btn-link-view:focus-visible {
  outline: 2px solid var(--pyne-gold);
  outline-offset: 2px;
}

.empty-hint { text-align: center; color: var(--text-secondary); padding: var(--sp-24) var(--sp-8); font-size: var(--fs-body-sm); line-height: var(--lh-body-sm); }

/* Profile */
.profile-card {
  border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--sp-16);
  background: var(--bg-alt);
}
.profile-card .pname { font-size: var(--fs-h2); line-height: var(--lh-h2); font-weight: var(--fw-h2); color: var(--deep-bronze); }
.profile-card .pmeta { font-size: var(--fs-body-sm); line-height: var(--lh-body-sm); color: var(--text-secondary); margin-top: var(--sp-4); }
.section-title { font-size: var(--fs-h3); line-height: var(--lh-h3); font-weight: var(--fw-h3); color: var(--deep-bronze); margin: var(--sp-24) 0 var(--sp-8); }
.history-list { display: flex; flex-direction: column; gap: var(--sp-8); }
.history-item { border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--sp-12); cursor: pointer; background: var(--bg-white); }
.history-item:active { background: var(--bg-alt); }
.history-item .htype {
  display: inline-block; font-size: var(--fs-label); line-height: var(--lh-label); font-weight: var(--fw-label);
  letter-spacing: var(--tr-label); text-transform: uppercase;
  color: var(--success-text); background: var(--success-bg); padding: var(--sp-4) var(--sp-8); border-radius: var(--radius-pill); margin-bottom: var(--sp-8);
}
.history-item .htype.touchup { color: var(--warning-text); background: var(--warning-bg); }
.history-item .hdate { font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--text-secondary); float: right; }
.history-item .hdetail { font-size: var(--fs-body-sm); line-height: var(--lh-body-sm); color: var(--ink); margin-top: var(--sp-4); }

/* Duplicate warning banner */
.dup-warning {
  background: var(--warning-bg); border: 1px solid var(--warning-text); border-radius: var(--radius-md);
  padding: var(--sp-12); margin: var(--sp-8) 0; font-size: var(--fs-body-sm); line-height: var(--lh-body-sm); color: var(--warning-text);
}
.dup-warning button { margin-top: var(--sp-8); }

/* หัวข้อใหญ่คั่นแต่ละส่วนของฟอร์ม (ตรงตามหัวข้อใน Jotform ต้นฉบับ) */
.form-section-title {
  font-size: var(--fs-h2); line-height: var(--lh-h2); font-weight: var(--fw-h2); color: var(--heading); margin: var(--sp-32) 0 var(--sp-12);
  padding-bottom: var(--sp-8); border-bottom: 1px solid var(--border);
}
.form-section-title:first-of-type { margin-top: var(--sp-4); }

/* Multi-step form */
.step-group { margin-bottom: var(--sp-16); }
.step-group-title { font-size: var(--fs-h3); line-height: var(--lh-h3); font-weight: var(--fw-h3); color: var(--deep-bronze); margin-bottom: var(--sp-8); }
.required-star { color: var(--error-text); }
.choice-grid, .radio-row { display: flex; flex-direction: column; gap: var(--sp-4); margin-bottom: var(--sp-12); }
.native-choice {
  display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-8) var(--sp-4);
  font-size: var(--fs-body); line-height: var(--lh-body); cursor: pointer; user-select: none;
}
.native-choice input[type="radio"], .native-choice input[type="checkbox"] {
  width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--deep-bronze); cursor: pointer;
}
.native-choice:has(input:checked) span { color: var(--deep-bronze); font-weight: 600; }
.other-input { margin: calc(var(--sp-4) * -1) 0 var(--sp-8) var(--sp-32); width: calc(100% - var(--sp-32)); }

/* Consent */
.consent-block {
  background: var(--warning-bg); border: 1px solid var(--hairline); border-left: 3px solid var(--warning-text);
  border-radius: var(--radius-md); padding: var(--sp-12); margin-bottom: var(--sp-12); font-size: var(--fs-body); line-height: var(--lh-body); color: var(--ink);
}
details.consent-block { cursor: pointer; }
details.consent-block summary {
  font-weight: 600; color: var(--deep-bronze); list-style: none;
}
details.consent-block summary::-webkit-details-marker { display: none; }
details.consent-block .consent-body { margin-top: var(--sp-12); }
.consent-block .src { font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--warning-text); font-weight: 600; margin-bottom: var(--sp-8); }
.intensity-option {
  display: flex; align-items: flex-start; gap: var(--sp-8);
  border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--sp-12); margin-bottom: var(--sp-8); font-size: var(--fs-body); line-height: var(--lh-body); cursor: pointer;
}
.intensity-option input[type="radio"] { width: 18px; height: 18px; flex-shrink: 0; margin-top: var(--sp-4); accent-color: var(--deep-bronze); cursor: pointer; }
.intensity-option:has(input:checked) { border-color: var(--deep-bronze); background: var(--bg-alt); }
.agree-row { display: flex; align-items: flex-start; gap: var(--sp-8); margin: var(--sp-16) 0; font-size: var(--fs-body); line-height: var(--lh-body); }
.agree-row input { width: 20px; height: 20px; margin-top: var(--sp-4); accent-color: var(--deep-bronze); }

/* Signature pad */
.sig-wrap { border: 1.5px dashed var(--border); border-radius: var(--radius-md); overflow: hidden; margin: var(--sp-8) 0; background: var(--white); }
.sig-wrap canvas { display: block; width: 100%; height: 180px; touch-action: none; }
.sig-actions { display: flex; justify-content: flex-end; padding: var(--sp-8); background: var(--bg-alt); }
.sig-actions button { background: none; border: none; color: var(--deep-bronze); font-size: var(--fs-caption); font-family: inherit; cursor: pointer; }

/* Static technician signature (fixed image, not a live pad) */
.tech-sig-wrap {
  border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; margin: var(--sp-8) 0;
  background: var(--white); display: flex; align-items: center; justify-content: center; padding: var(--sp-8);
}
.tech-sig-wrap img { max-width: 220px; width: 100%; height: auto; display: block; }

/* Photo capture */
.photo-row { display: flex; gap: var(--sp-12); margin: var(--sp-8) 0; }
.photo-slot {
  flex: 1; aspect-ratio: 1; border: 1.5px dashed var(--border); border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: var(--bg-alt);
}
.photo-slot img { width: 100%; height: 100%; object-fit: cover; }
.photo-slot label {
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-8); font-size: var(--fs-caption); color: var(--text-secondary); cursor: pointer;
}
.photo-slot input[type=file] { display: none; }
.photo-label {
  text-align: center; font-size: var(--fs-label); line-height: var(--lh-label); font-weight: var(--fw-label);
  letter-spacing: var(--tr-label); text-transform: uppercase; color: var(--deep-bronze); margin-top: var(--sp-4);
}

/* Footer actions */
.footer-actions {
  position: sticky; bottom: 0; background: var(--bg-white); border-top: 1px solid var(--border);
  padding: var(--sp-12) var(--sp-16); padding-bottom: max(var(--sp-12), env(safe-area-inset-bottom));
}
.touchup-save-actions { display: flex; gap: var(--sp-12); }
.touchup-save-actions .btn { flex: 1; }

/* Step 3 — เลือกเวลานัด */
.time-slot-row { display: flex; flex-wrap: wrap; gap: var(--sp-8); margin: var(--sp-4) 0 var(--sp-16); }
.time-slot-btn { flex: 1 1 calc(50% - var(--sp-8)); min-width: 100px; }
.time-slot-btn.is-selected,
.time-slot-btn.is-selected:hover { background: var(--deep-bronze); color: var(--white); border-color: var(--deep-bronze); }
#cvSlotGroup.field-error { border: 1.5px solid var(--error-text) !important; border-radius: var(--radius-md); padding: var(--sp-8); background: var(--error-bg); }

/* ปุ่ม "บันทึกแบบร่าง" มุมขวาบนของ topbar ทุกฟอร์ม Consultation */
.topbar-actions { position: absolute; top: var(--sp-12); right: var(--sp-16); display: flex; gap: var(--sp-8); }
.draft-save-btn {
  background: transparent; border: 1px solid var(--pyne-gold); color: var(--deep-bronze);
  font-size: var(--fs-body-sm); font-weight: 600; padding: var(--sp-8) var(--sp-12);
  border-radius: var(--radius-md); cursor: pointer; font-family: inherit;
}
.draft-save-btn:disabled {
  background: var(--disabled-bg); border-color: var(--border); color: var(--disabled-text);
  cursor: not-allowed; opacity: .78;
}
.draft-save-btn[aria-busy="true"] { min-width: 116px; }
.not-served-link {
  background: var(--error-bg); border: 1px solid var(--error-text);
  color: var(--error-text); font-size: var(--fs-body-sm); font-weight: 600;
  cursor: pointer; font-family: inherit; padding: var(--sp-8) var(--sp-12);
  border-radius: var(--radius-md); box-shadow: var(--shadow);
}
.not-served-link:hover { border-color: var(--error-text); background: var(--error-bg); filter: brightness(.98); }
.not-served-link:active { transform: translateY(1px); }
.not-served-link:disabled {
  cursor: not-allowed; opacity: .55; transform: none;
}
.visit-header { margin-bottom: var(--sp-16); }

/* สัดส่วนสีที่ใช้ (mix ratio) — Form 3 เติมสีคิ้ว */
.mix-ratio-grid { display: flex; flex-direction: column; gap: var(--sp-8); margin-bottom: var(--sp-12); }
.mix-row { display: flex; align-items: center; gap: var(--sp-8); }
.mix-row .mix-label { flex: 1 1 40%; font-size: var(--fs-body); color: var(--ink); }
.mix-row .mix-input { width: 76px; flex: 0 0 76px; margin: 0; text-align: right; }
.mix-row .mix-other-label { flex: 1 1 40%; margin: 0; }
.mix-row .mix-unit { font-size: var(--fs-body-sm); color: var(--text-secondary); flex: 0 0 auto; }

/* Confirmation */
.confirm-wrap { max-width: 360px; margin: var(--sp-64) auto 0; padding: 0 var(--sp-24); text-align: center; }
.confirm-check {
  width: 64px; height: 64px; border-radius: 50%; background: var(--success-text); color: var(--white);
  font-size: 30px; display: flex; align-items: center; justify-content: center; margin: 0 auto var(--sp-16);
}

.box-quiet { background: var(--bg-alt); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--sp-12); font-size: var(--fs-body-sm); line-height: var(--lh-body-sm); color: var(--ink); margin-bottom: var(--sp-12); }

/* หน้ารายละเอียดประวัติ (อ่านอย่างเดียว) */
.detail-row { padding: var(--sp-8) 0; border-bottom: 1px solid var(--border); }
.detail-row:last-child { border-bottom: none; }
.detail-label {
  font-size: var(--fs-label); line-height: var(--lh-label); font-weight: var(--fw-label);
  letter-spacing: var(--tr-label); text-transform: uppercase; color: var(--deep-bronze);
}
.detail-value { font-size: var(--fs-body); line-height: var(--lh-body); color: var(--ink); margin-top: var(--sp-4); white-space: pre-wrap; }
.photo-slot-sig { aspect-ratio: auto; height: 90px; background: var(--white); }
